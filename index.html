<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boîte à Mots — Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&display=swap" rel="stylesheet">
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  /* Палітра: теплий матовий папір + глибокий лісовий зелений.
     Кожна пара «текст / тло» перевірена тестом tests/contrast.test.js — не правити наосліп. */
  /* Поверхні теж виводяться з --accent-h: змінюється весь інтерфейс, а не лише кнопки.
     Насиченість навмисно крихітна — папір лишається папером, а не кольоровою плашкою. */
  --bg-page: oklch(0.949 0.014 var(--accent-h));
  --bg-card: oklch(0.989 0.005 var(--accent-h));
  --bg-elevated: oklch(0.931 0.018 var(--accent-h));
  --bg-input: oklch(0.992 0.004 var(--accent-h));
  --text-main: oklch(0.252 0.013 var(--accent-h));
  --text-muted: oklch(0.487 0.021 var(--accent-h));

  /* Акцент виводиться з ОДНОГО відтінку: світлота й насиченість зафіксовані,
     тож будь-який вибір учня лишається контрастним (перевірено tests/contrast.test.js).
     156° — це рівно #2d4f3a, решта пресетів нижче — його рідня по колу. */
  --accent-h: 156;
  --accent: oklch(0.395 0.054 var(--accent-h));
  --accent-hover: oklch(0.343 0.046 var(--accent-h));
  --accent-contrast: #ffffff;   /* текст НА акцентній поверхні; у темній темі стає майже чорним */
  --accent-soft: oklch(0.934 0.014 var(--accent-h));
  --border: oklch(0.925 0.016 var(--accent-h));
  --border-subtle: oklch(0.951 0.011 var(--accent-h));


  --danger: #a6453c;
  --danger-soft: #f9efed;
  /* текст НА суцільному кольорі: у темній темі success/danger світлішають, і білий стає нечитабельним */
  --on-success: #ffffff;
  --on-danger: #ffffff;
  --warning: #8a5010;
  --warning-soft: #f8f1e4;
  --success: #296d46;
  --success-soft: #e8f3ec;

  --st-new: #8a9183;
  --st-learn: #b07c33;
  --st-know: #4d8296;
  --st-master: #296d46;

  --shadow: 0 8px 24px rgba(45, 60, 45, 0.055), 0 2px 6px rgba(45, 60, 45, 0.035);
  /* Шкала заокруглень: pill для дій, велике для поверхонь, середнє для полів вводу */
  --radius: 14px;
  --radius-card: 20px;
  --radius-pill: 999px;
  --radius-bar: 8px;   /* стовпчики прогнозу: вужчі за 14px, інакше заокруглення з'їдає сам стовпчик */
  --font-ui: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-fr: 'Literata', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Шкала розмірів зі spec-листа дизайну. Нижче 12px не опускатися: на телефоні
     дрібніший текст нечитабельний, і тест tests/design-home.test.js це стереже. */
  --fs-micro: 12px;   /* підписи статистики, дні тижня, вкладки, чіпи */
  --fs-small: 13px;   /* описи режимів, підзаголовок привітання */
  --fs-body: 14px;    /* значення статистики, звичайний текст */
  --fs-action: 15px;  /* кнопки, назви режимів */
  --fs-title: 20px;   /* заголовки карток */
  --fs-greet: 26px;   /* привітання */
  --fs-hero: 36px;    /* велике число «до повторення» */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* Той самий зошит у приглушеному світлі: теплий графіт, не холодний синій. */
    --bg-page: oklch(0.200 0.008 var(--accent-h)); --bg-card: oklch(0.252 0.007 var(--accent-h)); --bg-elevated: oklch(0.294 0.010 var(--accent-h)); --bg-input: oklch(0.218 0.006 var(--accent-h));
    --text-main: oklch(0.928 0.010 var(--accent-h)); --text-muted: oklch(0.703 0.014 var(--accent-h));
    --accent: oklch(0.692 0.059 var(--accent-h)); --accent-hover: oklch(0.769 0.059 var(--accent-h)); --accent-contrast: oklch(0.200 0.008 var(--accent-h)); --accent-soft: oklch(0.295 0.021 var(--accent-h));
    --border: oklch(0.356 0.011 var(--accent-h)); --border-subtle: oklch(0.300 0.009 var(--accent-h));
    --danger: #e5847c; --danger-soft: #2e1d1a; --on-success: #10241a; --on-danger: #2a1512; --warning: #d9a441; --warning-soft: #2e2415;
    --success: #86d9a5; --success-soft: #1c2a22;
    --st-new: #8d8373; --st-learn: #d9a441; --st-know: #7fb0c2; --st-master: #7ba891;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
}

:root[data-theme="dark"] {
  --bg-page: oklch(0.200 0.008 var(--accent-h)); --bg-card: oklch(0.252 0.007 var(--accent-h)); --bg-elevated: oklch(0.294 0.010 var(--accent-h)); --bg-input: oklch(0.218 0.006 var(--accent-h));
  --text-main: oklch(0.928 0.010 var(--accent-h)); --text-muted: oklch(0.703 0.014 var(--accent-h));
  --accent: oklch(0.692 0.059 var(--accent-h)); --accent-hover: oklch(0.769 0.059 var(--accent-h)); --accent-contrast: oklch(0.200 0.008 var(--accent-h)); --accent-soft: oklch(0.295 0.021 var(--accent-h));
  --border: oklch(0.356 0.011 var(--accent-h)); --border-subtle: oklch(0.300 0.009 var(--accent-h));
  --danger: #e5847c; --danger-soft: #2e1d1a; --on-success: #10241a; --on-danger: #2a1512; --warning: #d9a441; --warning-soft: #2e2415;
  --success: #86d9a5; --success-soft: #1c2a22;
  --st-new: #8d8373; --st-learn: #d9a441; --st-know: #7fb0c2; --st-master: #7ba891;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; overflow-x: hidden; background: var(--bg-page); color: var(--text-main); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* АВТОРИЗАЦІЯ */
/* Блідий: застереження має бути, але не відволікати від навчання. */
.legal-note { margin: 20px 0 0; font-size: var(--fs-micro); line-height: 1.45; color: var(--text-muted); opacity: 0.55; text-align: center; }
.auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
.auth-container { width: 100%; max-width: 440px; background: var(--bg-card); padding: 32px 28px; border-radius: var(--radius-card); box-shadow: var(--shadow); border: 1px solid var(--border); border-top: 4px solid var(--accent); }
.auth-logo { font-family: var(--font-fr); font-size: 30px; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--text-main); }
.teacher-textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--bg-input); font-family: var(--font-mono); font-size: 13px; resize: vertical; margin-bottom: 16px; }

/* ШАПКА ТА НАВІГАЦІЯ */
/* Нижній відступ = висота панелі навігації + safe-area iPhone, інакше остання картка під неї ховається */
.app-shell { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(80px + env(safe-area-inset-bottom, 0px)); display: none; flex-direction: column; gap: 16px; }
.app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 16px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-title { font-family: var(--font-fr); font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-main); line-height: 1.15; }
.brand-sub { font-size: var(--fs-micro); font-family: var(--font-mono); color: var(--text-muted); white-space: nowrap; }
/* На вузькому екрані підпис автора з'їдає два рядки шапки — ховаємо, назва лишається */
@media (max-width: 559px) { .brand-sub { display: none; } }
.header-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn { width: 40px; height: 40px; flex-shrink: 0; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); border-radius: var(--radius-pill); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn .icon { width: 18px; height: 18px; }
/* Підпис лишається для зчитувача екрана, хоча на екрані його заміняє іконка */
/* Панель викладача живе в тій самій оболонці, що й застосунок учня,
   але без нижньої навігації — вкладок тут лише дві. */
.teacher-shell { padding-bottom: 32px; -webkit-user-select: text; user-select: text; }
/* Пошту, ім'я та слова учня можна виділити й скопіювати; кнопка «Копіювати» робить це одним дотиком. */
.copy-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.copy-line .copy-text { min-width: 0; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.copy-btn { flex-shrink: 0; width: 36px; height: 36px; border: 0; border-radius: var(--radius); background: transparent; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.copy-btn:hover { color: var(--accent); background: var(--bg-elevated); }
.copy-btn .icon { width: 16px; height: 16px; }
.t-add-card textarea { margin-bottom: 12px; }
.t-add-result { font-size: var(--fs-small); margin-bottom: 12px; line-height: 1.45; }
.seg-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: var(--bg-elevated); padding: 4px; border-radius: var(--radius-card); border: 1px solid var(--border); }
.seg-tab { min-height: 44px; border: none; background: transparent; border-radius: var(--radius-pill); font-family: var(--font-ui); font-weight: 600; font-size: var(--fs-action); color: var(--text-muted); cursor: pointer; }
.seg-tab.active { background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow); }
.student-card { width: 100%; text-align: left; -webkit-user-select: text; user-select: text; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px; cursor: pointer; display: block; margin-bottom: 10px; }
.student-card:hover { border-color: var(--accent); }
.student-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.student-name { font-family: var(--font-fr); font-size: var(--fs-title); font-weight: 700; color: var(--text-main); }
.student-email { font-size: var(--fs-micro); color: var(--text-muted); overflow-wrap: anywhere; }
.student-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px 14px; background: var(--bg-elevated); border-radius: var(--radius); }
/* «Мовчить» — не докір, а підказка, кому написати першим */
.student-quiet { margin-top: 10px; font-size: var(--fs-small); color: var(--warning); font-weight: 600; }
.stat-mini-lbl { font-size: var(--fs-micro); color: var(--text-muted); line-height: 1.3; }
.stat-mini-val { font-size: var(--fs-body); font-weight: 700; line-height: 1.3; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.lang-switch { display: inline-flex; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 2px; }
.lang-switch button { min-height: 38px; padding: 0 12px; border: none; background: transparent; border-radius: var(--radius-pill); font-size: 0.8125rem; font-family: var(--font-mono); font-weight: 600; cursor: pointer; color: var(--text-muted); }
.lang-switch button.active { background: var(--bg-card); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

/* Пресети акценту: змінюється ЛИШЕ відтінок, світлота й насиченість — ні */
:root[data-accent="terre"]  { --accent-h: 40; }
:root[data-accent="olive"]  { --accent-h: 110; }
:root[data-accent="forest"] { --accent-h: 156; }
:root[data-accent="ocean"]  { --accent-h: 205; }
:root[data-accent="ink"]    { --accent-h: 255; }
:root[data-accent="plum"]   { --accent-h: 330; }

.accent-row { display: flex; flex-wrap: wrap; gap: 10px; }
.accent-swatch { width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--border); background: oklch(0.395 0.054 var(--sw-h)); position: relative; }
.accent-swatch[aria-pressed="true"] { border-color: var(--text-main); }
.accent-swatch[aria-pressed="true"]::after { content: '✓'; position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center; color: #fff; font-size: 17px; font-weight: 700; }

/* Перемикач напрямку в режимі «Вибір» */
.dir-switch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.dir-switch-label { font-size: 0.78rem; color: var(--text-muted); }
.dir-switch button { min-height: 34px; padding: 0 10px; font-size: 0.72rem; }

/* Панель навігації живе внизу екрана: великий палець дістає її без перехоплення телефона.
   Колонки рівні, іконки й підписи на одній лінії — бейдж накладається, а не розсовує. */
.nav-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; background: var(--bg-card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-tabs-inner { width: 100%; max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav-tab { min-height: 64px; border: none; background: transparent; font-family: var(--font-ui); font-weight: 600; font-size: var(--fs-micro); color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: color 0.15s; padding: 0; }
.nav-tab .icon { width: 22px; height: 22px; }
.nav-tab.active { color: var(--accent); }
.nav-tab-ico { position: relative; display: inline-flex; }
/* Акцент, а не амбра: білий на #b07c33 дає 3.6:1 — замало для 11px. Акцент перевірений на всіх пресетах. */
.nav-badge { position: absolute; top: -5px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-contrast); font-size: var(--fs-micro); font-weight: 700; line-height: 18px; text-align: center; }

/* КАРТКИ (ЗОШИТ SÉYÈS) */
.panel-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow); padding: 18px; }

/* КНОПКИ ТА ПОЛЯ */
.btn { min-height: 44px; padding: 8px 16px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-weight: 500; font-size: 0.9375rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; }
.btn:hover:not(:disabled) { background: var(--bg-elevated); border-color: var(--border-subtle); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.btn-sm { min-height: 38px; padding: 4px 10px; font-size: 0.8125rem; }
.btn-icon { min-width: 42px; min-height: 42px; padding: 8px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-icon:hover { background: var(--bg-elevated); color: var(--accent); }
svg.icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.pw-field { position: relative; margin-bottom: 12px; }
.pw-field .input { margin-bottom: 0; padding-right: 48px; }
.pw-toggle { position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: transparent; color: var(--text-muted); border-radius: var(--radius); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.pw-toggle:hover { color: var(--text-main); }
.pw-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text-main); font-size: 0.95rem; margin-bottom: 12px; box-sizing: border-box; }
.select { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text-main); font-size: 0.9375rem; }
.textarea { width: 100%; min-height: 120px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text-main); font-size: 0.85rem; font-family: var(--font-mono); resize: vertical; box-sizing: border-box; }

/* ДАШБОРД */
.topic-focus-bar { display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 44px; margin-bottom: 18px; margin-top: 2px; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); font-size: var(--fs-body); }
.topic-focus-bar .icon { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
.topic-focus-select { flex: 1; min-width: 0; padding: 6px 0; background: transparent; border: none; font-family: var(--font-ui); font-size: var(--fs-body); font-weight: 600; color: var(--text-main); cursor: pointer; }
.greeting-block { margin-bottom: 14px; }
.greeting-title { font-family: var(--font-fr); font-size: var(--fs-greet); font-weight: 700; line-height: 1.25; color: var(--text-main); }
.greeting-sub { font-size: var(--fs-small); line-height: 1.45; color: var(--text-muted); margin-top: 6px; }
.card-caption { font-size: var(--fs-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.due-row { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 16px; }
.due-number { font-family: var(--font-fr); font-size: var(--fs-hero); font-weight: 700; line-height: 1; color: var(--text-main); }
.due-label { font-family: var(--font-fr); font-size: 18px; font-weight: 600; color: var(--text-main); }
/* Значення вирівняні по низу: підпис «Повторено за тиждень» лягає у два рядки й не зсуває сусідів */
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px 14px; background: var(--bg-elevated); border-radius: var(--radius); }
.stat-item { display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.stat-lbl { font-size: var(--fs-micro); font-weight: 500; line-height: 1.3; color: var(--text-muted); }
.stat-val { font-size: var(--fs-body); font-weight: 700; line-height: 1.3; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-title { font-family: var(--font-fr); font-size: var(--fs-title); font-weight: 700; line-height: 1.3; color: var(--text-main); }
.pill-badge { font-size: var(--fs-micro); font-weight: 600; padding: 4px 10px; background: var(--bg-elevated); border-radius: var(--radius-pill); color: var(--text-muted); white-space: nowrap; }
.section-label { font-size: var(--fs-micro); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 10px; }
.segment-bar { height: 10px; width: 100%; background: var(--bg-elevated); border-radius: var(--radius-pill); overflow: hidden; display: flex; margin-bottom: 12px; }
.seg-part { height: 100%; transition: width 0.3s ease; }
.segment-legend { display: flex; align-items: center; gap: 14px; font-size: var(--fs-micro); flex-wrap: wrap; color: var(--text-muted); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-count { font-weight: 700; color: var(--text-main); }
.forecast-chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.forecast-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.forecast-val { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.forecast-bar-wrap { width: 26px; height: 48px; display: flex; align-items: flex-end; background: var(--bg-elevated); border-radius: var(--radius-bar); overflow: hidden; }
.forecast-bar { width: 100%; background: var(--accent); border-radius: var(--radius-bar); min-height: 4px; }
.forecast-day { width: 26px; height: 26px; font-size: var(--fs-micro); font-weight: 600; color: var(--text-muted); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-pill); }
/* Сьогодні позначаємо кольором, а не скороченням «Сьог»: день тижня лишається на місці */
.forecast-col.is-today .forecast-day { background: var(--accent); color: var(--accent-contrast); font-weight: 700; }
.forecast-col.is-today .forecast-val { color: var(--accent); font-weight: 700; }
/* Дві колонки навіть на 360px: іконка зверху, назва й опис знизу — усі плитки однакової висоти.
   min-height, а не фіксована: на вузькому екрані опис має право перенестися, а не обрізатися. */
.modes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
/* Текст притиснутий до іконки, а не до низу плитки: інакше опис у два рядки
   зсуває назву вгору й назви в сусідніх плитках стоять на різній висоті. */
.mode-tile { text-align: left; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; gap: 14px; transition: border-color 0.15s; min-height: 108px; }
.mode-tile:hover:not(.disabled) { border-color: var(--accent); }
.mode-tile.disabled { opacity: 0.55; cursor: not-allowed; }
.mode-icon-box { width: 36px; height: 36px; border-radius: var(--radius-pill); background: var(--bg-elevated); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mode-icon-box .icon { width: 18px; height: 18px; }
/* Назва має бути помітнішою за опис — інакше ієрархія читається навпаки */
.mode-title { font-weight: 600; font-size: var(--fs-action); line-height: 1.25; margin-bottom: 2px; color: var(--text-main); }
.mode-desc { font-size: var(--fs-small); color: var(--text-muted); line-height: 1.3; }

/* НАВЧАЛЬНІ ЕКРАНИ ТА ТИПОГРАФІКА */
.session-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.session-progress { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
.instruction-text { font-family: var(--font-ui); font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
.study-word-title { font-family: var(--font-fr); font-size: 2rem; font-weight: 700; line-height: 1.25; margin-bottom: 4px; color: var(--text-main); }
.study-pos { font-family: var(--font-fr); font-size: 0.88rem; color: var(--text-muted); font-style: italic; margin-bottom: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.study-divider { border: none; border-top: 1px dashed var(--border); margin: 16px 0; }
/* Слово-значення у завданнях: той самий шрифт, що й французькі варіанти (Literata має кирилицю),
   інакше питання і відповіді виглядають як різні сутності. Інтерфейс лишається в Golos Text. */
.study-meaning { font-family: var(--font-fr); font-size: 1.4rem; font-weight: 700; line-height: 1.3; color: var(--accent); margin-bottom: 8px; }
.study-def { font-family: var(--font-fr); font-size: 0.98rem; line-height: 1.5; color: var(--text-muted); margin-bottom: 12px; padding-left: 10px; border-left: 2px solid var(--border); }
.study-synonyms { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
.study-example { font-family: var(--font-fr); font-size: 1.05rem; line-height: 1.45; padding: 12px 14px; background: var(--bg-elevated); border-radius: var(--radius); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
/* Цільове слово в прикладі: м'яка акцентна плашка замість помаранчевого підкреслення зошита */
.hl-word { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: var(--radius-bar); padding: 1px 5px; }

.grade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
@media (min-width: 480px) { .grade-grid { grid-template-columns: repeat(4, 1fr); } }
.grade-btn { min-height: 54px; padding: 8px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: background 0.15s; }
.grade-btn:hover { background: var(--bg-elevated); }
.grade-btn .g-name { font-weight: 600; font-size: 0.9rem; }
.grade-btn .g-time { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
.grade-again { border-bottom: 3px solid var(--danger); }
.grade-hard { border-bottom: 3px solid var(--warning); }
.grade-good { border-bottom: 3px solid var(--accent); }
.grade-easy { border-bottom: 3px solid var(--success); }

/* ВІДМІНЮВАННЯ */
.btn-toggle-conj { background-color: var(--bg-card); color: var(--accent); border: 1px solid var(--accent); padding: 6px 16px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; margin-bottom: 16px; }
.btn-toggle-conj:hover { background-color: var(--accent-soft); }
.conj-box { display: none; background: var(--bg-elevated); border-radius: var(--radius-card); padding: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
.conj-box.open { display: block; }
.tabs-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
.tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; font-size: 13px; border-radius: var(--radius-pill); white-space: nowrap; cursor: pointer; }
.tab-btn.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
/* Ліва колонка — однина (je, tu, il), права — множина (nous, vous, ils): заповнення по колонках. */
.forms-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, auto); grid-auto-flow: column; gap: 8px 16px; background: var(--bg-card); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); }
@media (max-width: 480px) { .forms-grid { grid-template-columns: 1fr; grid-template-rows: auto; grid-auto-flow: row; } }
.form-row-c { font-family: var(--font-mono); font-size: 14px; display: flex; align-items: baseline; }
/* Фіксована ширина, щоб дієслівні форми вишикувались в рівний стовпчик (найдовше: qu'il/elle/on) */
.pronoun { color: var(--text-muted); margin-right: 6px; font-family: var(--font-ui); font-size: 12px; width: 86px; flex-shrink: 0; white-space: nowrap; display: inline-block; }
.passe-compose-banner { background: var(--bg-card); padding: 12px; border-radius: var(--radius); font-size: 14px; border: 1px solid var(--border); line-height: 1.6; }

/* ОПЦІЇ ТА ЗВОРОТНИЙ ЗВ'ЯЗОК */
/* Кнопка «Далі» у звичайному потоці: float виносив її за межі картки */
/* «Далі» — головна дія екрана: на всю ширину, щоб влучати великим пальцем, не цілячись у кут */
.next-row { margin-top: 16px; }
.next-row .btn { width: 100%; }
.btn-next { width: 100%; margin-top: 16px; gap: 8px; }
/* Картка навчального екрана: без ліній зошита — вони сперечалися з блоками відповідей.
   Лінії лишилися тільки в режимі «Картки», де метафора зошита доречна. */
.study-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow); padding: 20px; position: relative; }
@media (max-width: 480px) { .study-card { padding: 16px; } }
.options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.option-btn { min-height: 56px; padding: 12px 14px; border: 1px solid transparent; border-radius: var(--radius); background: var(--bg-elevated); text-align: left; cursor: pointer; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-family: var(--font-ui); font-size: 1rem; color: var(--text-main); transition: background-color 0.15s, border-color 0.15s, opacity 0.15s; }
.option-btn:hover:not(:disabled) { border-color: var(--accent); }
.option-btn:disabled { cursor: default; }
/* Варіант відповіді має однаковий вигляд, якою б мовою він не був:
   різний шрифт для латиниці й кирилиці читався як різна важливість. */
/* Текст і плашка стоять колонкою праворуч від цифри: довгий варіант переноситься
   поруч із номером, а «Ваша відповідь» лягає під текст і не стискає його. */
.option-btn .opt-body { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.option-btn .opt-word { font-family: var(--font-fr); font-weight: 700; font-size: 1.05rem; overflow-wrap: break-word; }
/* Питання у вікторині: один розмір і колір незалежно від напрямку */
.study-sub { font-family: var(--font-fr); color: var(--text-muted); }
.study-prompt { font-family: var(--font-fr); font-size: 1.6rem; font-weight: 700; line-height: 1.25; color: var(--text-main); margin-bottom: 4px; }
.option-key { font-family: var(--font-mono); font-size: var(--fs-small); font-weight: 600; width: 30px; height: 30px; border-radius: 50%; background: var(--bg-card); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.option-key .icon { width: 16px; height: 16px; }
/* Правильна — зелена, обрана помилкова — червона, решта просто гасне.
   Статус дублюється підписом і значком: самим кольором його позначати не можна. */
.option-btn.correct { background: var(--success-soft); }
.option-btn.correct .option-key { background: var(--success); color: var(--on-success); }
.option-btn.wrong { background: var(--danger-soft); }
.option-btn.wrong .option-key { background: var(--danger); color: var(--on-danger); }
.option-btn.faded { opacity: 0.5; }
.option-tag { font-size: var(--fs-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 10px; border-radius: var(--radius-pill); }
.option-btn.correct .option-tag { background: var(--success); color: var(--on-success); }
.option-btn.wrong .option-tag { background: var(--danger); color: var(--on-danger); }

.feedback-toast { position: absolute; top: 12px; right: 16px; padding: 6px 14px; border-radius: var(--radius-pill); font-weight: 600; font-size: 14px; opacity: 0; transition: all 0.3s ease; pointer-events: none; }
.feedback-toast.show { opacity: 1; transform: translateY(0); }
.bg-green { background: var(--success-soft); color: var(--success); border: 1px solid var(--success);}
.bg-red { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger);}
.feedback-box { margin-top: 12px; padding: 12px; border-radius: var(--radius); font-size: 0.9375rem; }
.feedback-box.ok { background: var(--success-soft); color: var(--success); border: 1px solid var(--success); }
.feedback-box.err { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }
.accent-miss { background: var(--bg-card); color: var(--warning); border-bottom: 2px solid var(--warning); border-radius: 3px; padding: 0 2px; }

/* РЕЖИМ НАПИШИ ТА АНАГРАМА */
.template-mask { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 16px 0; align-items: center; }
.template-word { display: inline-flex; gap: 5px; font-family: var(--font-mono); font-size: 1.35rem; color: var(--accent); letter-spacing: 0.05em; font-weight: 600; white-space: nowrap; }
.template-char-revealed { color: var(--accent); font-weight: 700; border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
.template-char-hidden { color: var(--text-muted); opacity: 0.75; }

.anagram-slots, .anagram-pool { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; margin: 12px 0; min-height: 48px; }
.letter-tile { min-width: 44px; min-height: 44px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.letter-tile.space-slot { background: transparent; border: 1px dashed var(--border); pointer-events: none; min-width: 28px; }
.letter-tile.used { opacity: 0.25; pointer-events: none; }

/* ПАРИ */
.pairs-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pair-btn { min-height: 54px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.9rem; word-break: break-word; }
.pair-left { font-family: var(--font-fr); font-weight: 700; font-size: 1.05rem; }
.pair-right { font-family: var(--font-ui); }
.pair-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
.pair-btn.matched { opacity: 0.35; pointer-events: none; border-color: var(--success); }

/* КРОСВОРД */
.cw-wrapper { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 10px; }
.cw-grid { display: grid; gap: 1px; background: var(--border-subtle); padding: 6px; border-radius: var(--radius); overflow-x: auto; max-width: 100%; border: 1px solid var(--border); }
.cw-cell { width: clamp(26px, 7.5vw, 38px); height: clamp(26px, 7.5vw, 38px); position: relative; background: var(--bg-elevated); }
.cw-cell.empty { background: transparent; }
.cw-cell input { width: 100%; height: 100%; border: 1px solid var(--border-subtle); background: var(--bg-card); text-align: center; font-family: var(--font-mono); font-size: 1rem; font-weight: 600; text-transform: lowercase; padding: 0; border-radius: 2px; }
.cw-cell input:focus { background: var(--accent-soft); border-color: var(--accent); outline: none; }
.cw-cell input.cw-ok { background: var(--success-soft); color: var(--success); }
.cw-cell input.cw-err { background: var(--danger-soft); color: var(--danger); }
.cw-num { position: absolute; top: 1px; left: 2px; font-size: 9px; font-family: var(--font-mono); color: var(--text-muted); pointer-events: none; z-index: 2; line-height: 1; }
.cw-clues { width: 100%; display: grid; grid-template-columns: 1fr; gap: 16px; font-size: 0.9rem; margin-top: 12px; }
@media (min-width: 540px) { .cw-clues { grid-template-columns: 1fr 1fr; } }
.cw-clue-item { padding: 6px 10px; border-radius: var(--radius); cursor: pointer; line-height: 1.4; }
.cw-clue-item:hover { background: var(--bg-elevated); }

/* СЛОВА */
.words-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters-bar { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
/* Контейнер застосунку завжди ≤760px, тож 4 контроли в один ряд тісні:
   пошук займає весь верхній рядок, три фільтри — нижній. */
@media (min-width: 540px) { .filters-bar { grid-template-columns: repeat(3, 1fr); } .filters-bar .f-search { grid-column: 1 / -1; } }
.word-list { display: flex; flex-direction: column; gap: 10px; }
.word-item { background: var(--bg-card); border: 1px solid var(--border); border-left: 4px solid var(--st-new); border-radius: var(--radius-card); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.word-item[data-status="learn"] { border-left-color: var(--st-learn); }
.word-item[data-status="know"] { border-left-color: var(--st-know); }
.word-item[data-status="master"] { border-left-color: var(--st-master); }
.word-item-header { display: flex; flex-direction: column; gap: 4px; }
.word-fr-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
.word-fr { font-family: var(--font-fr); font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
.word-pos { font-family: var(--font-fr); font-size: 0.82rem; font-style: italic; color: var(--text-muted); }
.word-badges-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.badge { font-size: 0.72rem; font-family: var(--font-mono); padding: 3px 10px; border-radius: var(--radius-pill); background: var(--bg-elevated); color: var(--text-muted); }
.word-meaning { font-family: var(--font-fr); font-size: 0.98rem; color: var(--accent); font-weight: 600; }
.word-item-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--border-subtle); font-size: 0.78rem; color: var(--text-muted); flex-wrap: wrap; }
.inline-confirm { display: inline-flex; align-items: center; gap: 6px; }

/* МОДАЛКИ ТА ТОСТИ */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal-backdrop.open { display: flex; }
.modal-box { background: var(--bg-card); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: var(--radius-card); max-width: 540px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.form-row { display: flex; flex-direction: column; gap: 4px; }
.form-row label { font-size: 0.8125rem; font-weight: 600; color: var(--text-muted); }
.toast-container { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 92vw; width: 420px; pointer-events: none; }
.toast { background: var(--text-main); color: var(--bg-card); padding: 12px 16px; border-radius: var(--radius-pill); font-size: 0.875rem; box-shadow: var(--shadow); pointer-events: auto; }
.setting-group { display: flex; flex-direction: column; gap: 12px; }
.setting-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); }
.setting-row:last-child { border-bottom: none; padding-bottom: 0; }
.summary-list { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; max-height: 300px; overflow-y: auto; }
.summary-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-elevated); border-radius: var(--radius); font-size: 0.9rem; }
.mark-ok { color: var(--success); font-family: var(--font-mono); font-weight: 700; }
.mark-err { color: var(--danger); font-family: var(--font-mono); font-weight: 700; }
.empty-state { text-align: center; padding: 38px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty-title { font-family: var(--font-fr); font-size: 1.45rem; font-weight: 600; }
.empty-desc { color: var(--text-muted); max-width: 460px; font-size: 0.9375rem; }
</style>

<body>

<!-- АВТОРИЗАЦІЯ -->
<div id="auth-screen" class="auth-wrapper" style="display:none;">
  <div class="auth-container">
    <div class="auth-logo">Boîte à Mots</div>
    <p style="text-align:center; color:var(--text-muted); margin-bottom:20px;">Вхід до картотеки</p>
    <input type="email" id="email-input" class="input" placeholder="Email" autocomplete="username" autocapitalize="none">
    <!-- Око показує пароль: на телефоні легко схибити з літерою й не помітити. -->
    <div class="pw-field">

<script>
  /* =====================================================================
   * НЕ ЛАМАТИ (рішення, які вже ухвалено; кожне захищене тестом у tests/)
   *  1. Список французьких голосів без дублів (refreshVoices).
   *  2. Озвучення лише по кнопці з динаміком, не при виборі відповіді.
   *  3. Enter підтверджує відповідь / веде далі в «Напиши», «Диктант», «Анаграма».
   *  4. Без технічних термінів («SM-2») в інтерфейсі для учня.
   *  5. Видалення: слово зникає з екрана ЛИШЕ після підтвердження бази (deleteCardsByIds).
   *  6. Прогрес раунду зберігається при згортанні вкладки (visibilitychange).
   *  7. «У контексті»: варіанти беруться з context_quiz, форми однорідні.
   *  8. Відмінювання: окремі форми для кожного часу, subjonctif із «que».
   *  9. У тренажерах немає qqn/qqch (getTestableFr), лишається основа й прийменник.
   * 10. У кросворді немає апострофів і дефісів.
   * 11. Помилки Supabase не кидають виняток, а повертають {error}: завжди перевіряти.
   *     Оцінки йдуть через чергу pendingProgress, а не «стріляються й забуваються».
   * 12. Відмінювання: ліва колонка — однина, права — множина (grid-auto-flow: column).
   *     Займенник відрізається по межі слова, інакше «ils/elles» ріжеться на «il» + «s/elles».
   * 13. Питання і варіанти відповіді — однією гарнітурою (--font-fr має кирилицю).
   * 14. Кнопки «Далі» — у потоці (.next-row), ніякого float: він виносить кнопку за картку.
   * 15. «Вибір»: напрямок обирає учень (choiceDir), напрямки питань живуть у revs
   *     і не перевертаються при перемальовуванні.
   * 16. «Повільно» в диктанті: SLOW_RATE і звичайний (не Siri/enhanced) голос,
   *     бо iOS ігнорує rate на покращених голосах.
   * 19. Мова НЕ змінює оформлення: питання у «Виборі» — завжди .study-prompt,
   *     варіант відповіді — завжди .opt-word. Контент (слова, значення, переклади)
   *     набирається --font-fr; --font-ui лишається для інтерфейсу.
   * 20. Список слів і лічильники у фільтрах рахуються ОДНИМ предикатом
   *     wordPassesFilters. Інакше вони розходяться: лічильник частин мови
   *     показував весь словник, ігноруючи обрану тему.
   * 22. Ім'я для привітання бере ТІЛЬКИ з таблиці student_profiles (його вводить
   *     викладач у панелі). Не з пошти й не з user_metadata: «olena1992@…» дало б
   *     «Olena1992», а метадані чужого акаунта з браузера змінити неможливо.
   *     Немає імені — заголовок просто «Bonjour», без коми. Збій завантаження імені
   *     ніколи не блокує вхід і не показує помилок.
   * 21. УСЯ палітра виводиться з ОДНОГО відтінку (--accent-h): і акцент, і фони,
   *     і текст. Світлота та насиченість кожної ролі зафіксовані, змінюється лише
   *     відтінок — саме це гарантує контраст при будь-якому виборі учня.
   *     Пресети в CSS (:root[data-accent=...]) і в ACCENTS мають збігатися.
   *     Насиченість поверхонь навмисно крихітна: папір лишається папером.
   *     Семантичні кольори (помилка, успіх, статуси) за акцентом НЕ йдуть.
   * 18. Палітра і форма: теплий матовий папір, глибокий лісовий зелений як акцент,
   *     заокруглення лише зі шкали (--radius / --radius-card / --radius-pill).
   *     Текст на акцентній поверхні — var(--accent-contrast), НЕ жорсткий #fff:
   *     у темній темі акцент світлішає, і білий текст стає нечитабельним.
   *     Кожна пара кольорів перевірена tests/contrast.test.js — відтінки не правити на око.
   * 17. Письмова відповідь зараховується ЛИШЕ при точному написанні
   *     (isWrittenAnswerCorrect). Пропущений акцент — помилка, як на DELF.
   *     Регістр лишається пробачним: телефони автоматично ставлять велику літеру.
   * Перед змінами: npm test
   * ===================================================================== */
  // 1. ІНІЦІАЛІЗАЦІЯ SUPABASE ТА ЗМІННИХ СТАНУ
  const SUPABASE_URL = 'https://oxcpvcbvxmiszseckdcd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DAiE12czwiINHefrIYMyrg_brCfYWs-';
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ADMIN_EMAIL = 'nikita.francais@gmail.com';
  
  let currentUser = null; 
  let currentVerbData = null;
  let activeRoundState = null;
  const STORAGE_KEY = 'bam_app_data_cloud_v3';
  const SESSION_PROGRESS_KEY = 'bam_active_session_v3';
  const PENDING_KEY_PREFIX = 'bam_pending_progress_v1:';
  // Оцінки, які ще не потрапили в хмару (dbId -> дані). Зберігаються на пристрої, тож не губляться при збої мережі.
  const pendingProgress = new Map();
  let flushingProgress = false;
  let lastCloudWarnAt = 0;
  
  const defaultState = () => ({ 
    words: [], 
    settings: { langMode: 'UK_FR', newLimit: 10, voiceURI: '', theme: 'auto', accent: 'forest', focusTopic: 'all', choiceDir: 'random', profileName: '', autoNext: true },
    stats: { streak: 0, lastStudyDate: '', dailyDate: todayStr(), answersToday: 0, newLearnedToday: 0, blitzBest: 0 } 
  });
  let state = defaultState();

  // Нормалізація рядка (підтримка старих та нових полів JSON: context_quiz, context_translation, conj)
  function normalizeWordRow(row) {
    let rawConj = row.conj || row.conjugation || null;
    let ctxQuiz = row.context_quiz || null;
    let ctxTrans = String(row.context_translation || '').trim();

    if (rawConj && typeof rawConj === 'object') {
      if (!ctxQuiz && rawConj.context_quiz) ctxQuiz = rawConj.context_quiz;
      if (!ctxTrans && rawConj.context_translation) ctxTrans = String(rawConj.context_translation).trim();
    }

    const hasValidTenses = Boolean(rawConj && rawConj.tenses && typeof rawConj.tenses === 'object');
    const frText = String(row.fr || row.word || '').trim();

    return {
      dbId: row.id || row.dbId || null,
      // Чия це картка: учневі байдуже, але панель викладача без цього не розділить учнів
      userEmail: String(row.user_email || row.userEmail || '').toLowerCase(),
      id: makeWordId(frText),
      fr: frText,
      uk: String(row.uk || row.translation || '').trim(),
      def: String(row.def || '').trim(),
      ex: String(row.ex || row.context || '').trim(),
      context_translation: ctxTrans,
      syn: Array.isArray(row.syn) ? row.syn : (Array.isArray(row.synonyms) ? row.synonyms : []),
      conj: hasValidTenses ? rawConj : null,
      context_quiz: ctxQuiz,
      pos: String(row.pos || '').trim(),
      src: String(row.src || 'Загальний').trim(),
      added: row.added || todayStr(),
      iv: Number(row.iv) || 0,
      ef: Number(row.ef) || 2.5,
      r: Number(row.r) || 0,
      l: Number(row.l) || 0,
      due: Number(row.due) || 0,
      t: Number(row.t) || 0
    };
  }

  // 2. АВТОРИЗАЦІЯ ТА ХМАРНА СИНХРОНІЗАЦІЯ
  async function checkSession() {
    try {
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        if (String(currentUser.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          document.getElementById('teacher-screen').style.display = 'flex';
          loadLocalStats();
          initTeacherPanel();
        } else {
          document.getElementById('app-screen').style.display = 'flex';
          loadLocalStats();
          loadPendingProgress();
          await flushPendingProgress(); // догнати те, що не встигло зберегтись минулого разу
          await loadStudentProfile();
          await loadStudentWords();
        }
      } else {
        document.getElementById('auth-screen').style.display = 'flex';
      }
    } catch (err) {
      document.getElementById('auth-screen').style.display = 'flex';
    }
  }

  async function signInWithPassword() {
    const email = document.getElementById('email-input').value.trim();
    const password = document.getElementById('password-input').value;
    const errEl = document.getElementById('auth-err');
    if (!email || !password) {
      errEl.innerText = 'Введіть email та пароль';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('login-btn');
    btn.innerText = 'Вхід...';
    btn.disabled = true;
    errEl.style.display = 'none';
    const { error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.innerText = 'Помилка входу: перевірте пошту або пароль';
      errEl.style.display = 'block';
      btn.innerText = 'Увійти';
      btn.disabled = false;
    } else {
      window.location.reload();
    }
  }

  // Показати / сховати пароль. Курсор лишається в полі й у кінці тексту,
  // щоб можна було одразу дописати або виправити.
  function togglePasswordVisibility() {
    const inp = document.getElementById('password-input');
    const btn = document.getElementById('btnTogglePw');
    if (!inp || !btn) return;
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    const label = show ? 'Сховати пароль' : 'Показати пароль';
    btn.innerHTML = icon(show ? 'eyeOff' : 'eye');
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
    btn.setAttribute('aria-pressed', String(show));
    inp.focus();
    const len = String(inp.value || '').length;
    try { inp.setSelectionRange(len, len); } catch (e) {}
  }

  ['email-input', 'password-input'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); signInWithPassword(); } });
  });

  async function signOut() {
    clearActiveSessionProgress();
    await sbClient.auth.signOut();
    window.location.reload();
  }

  sbClient.auth.onAuthStateChange((event, session) => {
    if (event !== 'SIGNED_IN') return;
    // supabase-js повторно шле SIGNED_IN, коли учень повертається на вкладку (з Telegram тощо).
    // Для вже завантаженого користувача нічого не перезавантажуємо, інакше раунд скидається.
    if (currentUser && session && session.user && currentUser.id === session.user.id) return;
    document.getElementById('auth-screen').style.display = 'none';
    checkSession();
  });
  checkSession();

  function parseTolerantWordsJson(rawText) {
    let text = String(rawText || '').trim();
    if (!text) throw new Error('Поле порожнє. Вставте JSON-масив слів.');
    const firstBracket = text.indexOf('[');
    const lastBracket = text.lastIndexOf(']');
    if (firstBracket !== -1 && lastBracket !== -1 && lastBracket > firstBracket) {
      text = text.slice(firstBracket, lastBracket + 1);
    } else if (text.startsWith('{') && text.endsWith('}')) {
      text = `[${text}]`;
    } else {
      throw new Error('Не знайдено JSON-масиву у квадратних дужках [ ... ].');
    }
    text = text.replace(/[“”«»„‟]/g, '"').replace(/,\s*([\]}])/g, '$1');
    const parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) throw new Error('Очікувався масив об’єктів слів.');
    return parsed;
  }

  function isValidEmail(s) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());
  }

  async function insertWordsBatchForEmail(email, wordsArray) {
    // Supabase зберігає email малими літерами. Без нормалізації учень не побачить слова.
    const owner = String(email || '').trim().toLowerCase();
    const recordsToInsert = wordsArray.map(w => {
      let conjPayload = w.conj || w.conjugation || null;
      if (w.context_quiz || w.context_translation) {
        conjPayload = Object.assign({}, conjPayload || {});
        if (w.context_quiz) conjPayload.context_quiz = w.context_quiz;
        if (w.context_translation) conjPayload.context_translation = w.context_translation;
      }
      return {
        user_email: owner,
        fr: String(w.fr || w.word || '').trim(),
        uk: String(w.uk || w.translation || '').trim(),
        def: String(w.def || '').trim(),
        ex: String(w.ex || w.context || '').trim(),
        syn: Array.isArray(w.syn) ? w.syn : (Array.isArray(w.synonyms) ? w.synonyms : []),
        conj: conjPayload,
        pos: String(w.pos || '').trim(),
        src: String(w.src || 'Загальний').trim(),
        status: 'new',
        iv: 0, ef: 2.5, r: 0, l: 0, due: 0, t: 0,
        added: w.added || todayStr()
      };
    }).filter(r => r.fr && (r.uk || r.def));

    if (recordsToInsert.length === 0) throw new Error('Не знайдено валідних карток для імпорту.');
    const { data, error } = await sbClient.from('cards').insert(recordsToInsert).select();
    if (error) {
      if (error.code === '42501' || /row-level security/i.test(error.message || '')) {
        throw new Error('Немає дозволу додавати слова (налаштування бази). Зверніться до викладача.');
      }
      throw error;
    }
    const inserted = data || recordsToInsert;
    inserted.skipped = wordsArray.length - recordsToInsert.length; // картки без fr або без перекладу/тлумачення
    return inserted;
  }

  /* Зберігає ім'я учня для привітання. Повертає {ok, name} або {ok:false, message}, а не кидає виняток:
     ім'я другорядне, і його збій не повинен ламати відправку слів. */
  async function saveStudentName(email, rawName) {
    const name = String(rawName || '').trim().replace(/\s+/g, ' ');
    if (!name) return { ok: false, message: 'порожнє ім\'я.' };
    if (name.length > 60) return { ok: false, message: 'ім\'я довше за 60 символів.' };
    const { error } = await sbClient.from('student_profiles').upsert({ user_email: email, name, updated_at: new Date().toISOString() }, { onConflict: 'user_email' });
    if (error) {
      const missing = error.code === '42P01' || (/student_profiles/i.test(error.message || '') && /does not exist|schema cache|relation/i.test(error.message || ''));
      return { ok: false, message: missing
        ? 'у Supabase ще немає таблиці student_profiles. Виконайте supabase/002_student_profiles.sql (один раз).'
        : (error.message || 'невідома помилка.') };
    }
    return { ok: true, name };
  }
  async function saveStudentNameFromPanel() {
    const email = document.getElementById('target-student-email').value.trim().toLowerCase();
    const nameRaw = document.getElementById('target-student-name').value;
    if (!email || !nameRaw.trim()) return alert('Заповніть пошту та ім\'я учня');
    if (!isValidEmail(email)) return alert('Перевірте email учня: схоже, в адресі є помилка.');
    const res = await saveStudentName(email, nameRaw);
    alert(res.ok ? `✅ Ім'я «${res.name}» збережено для ${email}. Учень побачить його при наступному вході.` : `⚠️ Не вдалося: ${res.message}`);
  }

  /* =========================================================
   * ПАНЕЛЬ ВИКЛАДАЧА: УЧНІ
   * Читаємо всі картки одним запитом і рахуємо на місці — учнів десятки,
   * а не тисячі, тож окремі запити на кожного були б зайвим навантаженням.
   * ========================================================= */
  const teacher = { tab: 'students', rows: [], names: {}, openEmail: null, query: '', topic: 'all', loaded: false, error: '',
    addOpen: false, addTopic: '', addMsg: '', addBusy: false };

  function teacherView() { return document.getElementById('teacherView'); }

  async function loadTeacherData() {
    teacher.error = '';
    const cards = await sbClient.from('cards').select('*');
    if (cards.error) {
      teacher.error = /permission|policy|row-level/i.test(cards.error.message || '')
        ? 'Немає доступу до карток учнів. Виконайте supabase/003_teacher_manages_cards.sql (один раз).'
        : (cards.error.message || 'Не вдалося завантажити слова.');
      teacher.rows = [];
    } else {
      teacher.rows = (cards.data || []).map(r => normalizeWordRow(r));
    }
    const profs = await sbClient.from('student_profiles').select('user_email, name');
    teacher.names = {};
    if (!profs.error) (profs.data || []).forEach(r => { teacher.names[String(r.user_email).toLowerCase()] = r.name; });
    teacher.loaded = true;
  }

  /* Що саме ми можемо порахувати: у хмарі лежить лише стан кожної картки.
     Серії днів і «відповідей за день» тут немає — вони живуть на пристрої учня.
     «Повторено за 7 днів» = скільки РІЗНИХ слів учень відповідав цього тижня. */
  function teacherStudentStats(email) {
    const words = teacher.rows.filter(w => w.userEmail === email);
    const now = Date.now();
    const weekAgo = now - 7 * DAY_MS;
    const counts = { new: 0, learn: 0, know: 0, master: 0 };
    let due = 0, week = 0, last = 0;
    words.forEach(w => {
      counts[getWordStatus(w)]++;
      if (w.r > 0 && w.due && w.due <= now) due++;
      if (w.t && w.t >= weekAgo) week++;
      if (w.t && w.t > last) last = w.t;
    });
    return { email, words, total: words.length, counts, due, week, last };
  }

  function teacherStudents() {
    const emails = Array.from(new Set(teacher.rows.map(w => w.userEmail).filter(Boolean)));
    Object.keys(teacher.names).forEach(e => { if (!emails.includes(e)) emails.push(e); });
    return emails.map(teacherStudentStats).sort((a, b) => b.last - a.last || a.email.localeCompare(b.email));

    return `${days} ${ukPlural(days, 'день', 'дні', 'днів')} тому`;

  /* Копіювання: спершу сучасний буфер обміну, потім запасний шлях для старих браузерів.
     Якщо обидва не вийшли — чесно кажемо, текст однаково можна виділити вручну. */
  async function copyText(text, okMsg) {
    const value = String(text || '');
    if (!value) return false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(value); showToast(okMsg || 'Скопійовано'); return true; }
    } catch (e) { /* пробуємо запасний шлях */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = value; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) { showToast(okMsg || 'Скопійовано'); return true; }
    } catch (e) { /* нижче — повідомлення */ }
    showToast('Не вдалося скопіювати. Виділіть текст вручну.');
    return false;
  }

  function teacherWordsAsText(words) {
    return words.map(w => `${w.fr} — ${w.uk || w.def}`).join('\n');
  }

  // Ключ для пошуку дублів: регістр, зайві пробіли й різні апострофи не роблять слово новим
  function frKey(s) { return String(s || '').trim().toLowerCase().replace(/[’ʼ`´]/g, "'").replace(/\s+/g, ' '); }

  /* Слова з картки учня: пошта вже відома, тож вставляється лише JSON.
     Тема (якщо вказана) замінює src усієї партії. Слова, які в учня вже є
     (і повтори всередині самої партії), пропускаються — інакше учень отримав би дві однакові картки. */
  async function teacherAddWords(email, rawJson, topic) {
    const owner = String(email || '').trim().toLowerCase();
    const words = parseTolerantWordsJson(rawJson);
    const t = String(topic || '').trim();
    const have = new Set(teacher.rows.filter(w => w.userEmail === owner).map(w => frKey(w.fr)));
    const seen = new Set();
    const fresh = [], dups = [];
    words.forEach(w => {
      const k = frKey(w && (w.fr || w.word));
      if (k && (have.has(k) || seen.has(k))) { dups.push(String(w.fr || w.word).trim()); return; }
      if (k) seen.add(k);
      fresh.push(t ? Object.assign({}, w, { src: t }) : w);
    });
    if (fresh.length === 0) return { added: 0, dups, skipped: 0 };
    const inserted = await insertWordsBatchForEmail(owner, fresh);
    teacher.rows.push(...inserted.map(r => normalizeWordRow(Object.assign({ user_email: owner }, r))));
    return { added: inserted.length, dups, skipped: inserted.skipped || 0, topic: t };
  }

  async function teacherSubmitWords(email) {
    const view = teacherView();
    const ta = view && view.querySelector('#tAddJson');
    const topicEl = view && view.querySelector('#tAddTopic');
    const raw = ta ? ta.value : '';
    teacher.addTopic = topicEl ? topicEl.value.trim() : '';
    if (!String(raw).trim()) { teacher.addMsg = '<span style="color:var(--danger);">Вставте JSON зі словами.</span>'; renderTeacherPanel(); return; }
    teacher.addBusy = true; teacher.addMsg = ''; renderTeacherPanel();
    const keep = teacherView() && teacherView().querySelector('#tAddJson');
    if (keep) keep.value = raw; // поки йде запит, текст не зникає
    try {
      const res = await teacherAddWords(email, raw, teacher.addTopic);
      const parts = [];
      if (res.added) parts.push(`<span style="color:var(--success);">✓ Додано ${res.added} ${ukPlural(res.added, 'слово', 'слова', 'слів')}${res.topic ? ` у тему «${escapeHtml(res.topic)}»` : ''}.</span>`);
      else parts.push('<span style="color:var(--warning);">Нових слів немає — нічого не додано.</span>');
      if (res.dups.length) parts.push(`Пропущено ${res.dups.length}, бо вже є в учня: ${res.dups.slice(0, 8).map(escapeHtml).join(', ')}${res.dups.length > 8 ? '…' : ''}`);
      if (res.skipped) parts.push(`Пропущено ${res.skipped} без перекладу або тлумачення.`);
      teacher.addMsg = parts.join('<br>');
      teacher.addBusy = false;
      renderTeacherPanel();
      if (res.added) showToast(`Додано ${res.added} ${ukPlural(res.added, 'слово', 'слова', 'слів')}`);
    } catch (err) {
      teacher.addBusy = false;
      teacher.addMsg = `<span style="color:var(--danger);">Помилка: ${escapeHtml(err && err.message ? err.message : String(err))}</span>`;
      renderTeacherPanel();
      const back = teacherView() && teacherView().querySelector('#tAddJson');
      if (back) back.value = raw; // JSON не губимо — можна виправити й надіслати знову
    }
  }

  function teacherFindWord(dbId) { return teacher.rows.find(w => String(w.dbId) === String(dbId)) || null; }

  function teacherEditWord(dbId) {
    const w = teacherFindWord(dbId);
    if (!w) return;
    // Форма та сама, що й в учня: редагується лише текст, прогрес не чіпається
    openWordFormModal(w, () => renderTeacherPanel());
  }

  async function teacherDeleteWord(dbId) {
    const w = teacherFindWord(dbId);
    if (!w) return;
    if (!confirm(`Видалити «${w.fr}» в учня ${studentLabel(w.userEmail)}? Прогрес за цим словом зникне.`)) return;
    const { error } = await sbClient.from('cards').delete().eq('id', w.dbId);
    if (error) { alert('Не вдалося видалити: ' + (error.message || '')); return; }
    teacher.rows = teacher.rows.filter(x => x !== w);
    renderTeacherPanel();
    showToast('Слово видалено');
  }

    document.querySelectorAll('.seg-tab').forEach(b => b.addEventListener('click', () => {
