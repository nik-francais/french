  async function addWordsToStudent() {
    const email = document.getElementById('target-student-email').value.trim().toLowerCase();
    const code = document.getElementById('json-code').value.trim();
    if (!email || !code) return alert('Заповніть пошту та вставте код');
    if (!isValidEmail(email)) return alert('Перевірте email учня: схоже, в адресі є помилка.');
    try {
      const wordsArray = parseTolerantWordsJson(code);
      if (!confirm(`Додати ${wordsArray.length} слів учню ${email}?`)) return;
      const inserted = await insertWordsBatchForEmail(email, wordsArray);
      // Ім'я не обов'язкове: слова вже додані, тож збій імені не має їх «скасовувати», лише додає застереження
      const nameInput = document.getElementById('target-student-name');
      const nameRes = nameInput && nameInput.value.trim() ? await saveStudentName(email, nameInput.value) : null;
      alert(`✅ Додано ${inserted.length} слів учню ${email}.` +
        (inserted.skipped ? `\n⚠️ Пропущено карток без перекладу або тлумачення: ${inserted.skipped}.` : '') +
        (nameRes ? (nameRes.ok ? `\n✅ Ім'я збережено: ${nameRes.name}.` : `\n⚠️ Ім'я не збережено: ${nameRes.message}`) : ''));
      document.getElementById('json-code').value = '';
    } catch (err) {
      alert('Помилка: ' + err.message);
    }
  }

  async function loadStudentWords() {
    if (!currentUser) return;
    const { data, error } = await sbClient.from('cards').select('*').eq('user_email', String(currentUser.email).toLowerCase());
    if (!error && data) {
      state.words = data.map(row => normalizeWordRow(row));
      applyPendingToWords(state.words); // неотриману хмарою оцінку не затираємо старою версією
      saveLocalStats();
      updateNavBadge();
      if (!tryRestoreActiveSession()) {
        renderCurrentTab();
      }
    } else {
      updateNavBadge();
      if (!tryRestoreActiveSession()) {
        renderCurrentTab();
      }
    }
  }

  // ---- Хмарні операції: помилки Supabase не кидають виняток, а повертають {error}, тож їх треба перевіряти ----
  function reportCloudError(where, error) {
    console.error('[cloud] ' + where, error);
    const now = Date.now();
    if (now - lastCloudWarnAt < 20000) return; // не засипаємо учня повідомленнями
    lastCloudWarnAt = now;
    showToast('⚠️ Не вдалося синхронізувати з хмарою. Прогрес збережено на пристрої, спробуємо ще раз.');
  }

  function progressPayload(word) {
    return { iv: word.iv, ef: word.ef, r: word.r, l: word.l, due: word.due, t: word.t, status: getWordStatus(word) };
  }
  function pendingStorageKey() {
    return currentUser && currentUser.email ? PENDING_KEY_PREFIX + String(currentUser.email).toLowerCase() : null;
  }
  function savePendingProgress() {
    const key = pendingStorageKey();
    if (!key) return;
    try {
      if (pendingProgress.size === 0) window.localStorage.removeItem(key);
      else window.localStorage.setItem(key, JSON.stringify(Array.from(pendingProgress.entries())));
    } catch (e) {}
  }
  function loadPendingProgress() {
    pendingProgress.clear();
    const key = pendingStorageKey();
    if (!key) return;
    try {
      const raw = window.localStorage.getItem(key);
      if (raw) JSON.parse(raw).forEach(([id, payload]) => pendingProgress.set(id, payload));
    } catch (e) {}
  }
  function applyPendingToWords(words) {
    words.forEach(w => {
      const p = w.dbId && pendingProgress.get(w.dbId);
      if (p) Object.assign(w, { iv: p.iv, ef: p.ef, r: p.r, l: p.l, due: p.due, t: p.t });
    });
  }

  async function flushPendingProgress() {
    if (flushingProgress || !currentUser) return;
    flushingProgress = true;
    try {
      while (pendingProgress.size > 0) {
        const [id, payload] = pendingProgress.entries().next().value;
        const { data, error } = await sbClient.from('cards').update(payload).eq('id', id).select('id');
        if (error) { reportCloudError('збереження прогресу', error); break; }
        if (!data || data.length === 0) console.warn('[cloud] картки немає або доступ заборонено, пропускаємо', id);
        // Якщо поки йшов запит з'явилась новіша оцінка, не видаляємо її: цикл надішле її наступною
        if (pendingProgress.get(id) === payload) pendingProgress.delete(id);
      }
    } catch (err) {
      reportCloudError('збереження прогресу', err);
    } finally {
      flushingProgress = false;
      savePendingProgress();
    }
  }

  async function syncWordProgress(word) {
    saveLocalStats();
    if (!word.dbId) return;
    pendingProgress.set(word.dbId, progressPayload(word));
    savePendingProgress();
    await flushPendingProgress();
  }

  // true: збережено в хмарі; false: збережено лише на пристрої
  async function updateWordInCloud(word) {
    saveLocalStats();
    if (!word.dbId) return true;
    try {
      const { data, error } = await sbClient.from('cards').update({
        fr: word.fr, uk: word.uk, def: word.def, ex: word.ex, syn: word.syn, pos: word.pos, src: word.src
      }).eq('id', word.dbId).select('id');
      if (error) { reportCloudError('редагування слова', error); return false; }
      return Boolean(data && data.length);
    } catch (err) {
      reportCloudError('редагування слова', err);
      return false;
    }
  }

  // Видалення. Якщо RLS забороняє, Supabase НЕ видає помилки, а просто видаляє 0 рядків.
  // Тому питаємо, що саме видалено, а «0 рядків» перевіряємо повторним запитом (заборонено чи вже зникло деінде).
  async function deleteCardsByIds(ids) {
    const result = { deletedIds: [], failedIds: [], error: null };
    const wanted = Array.from(new Set((ids || []).filter(Boolean)));
    if (wanted.length === 0) return result;
    try {
      const del = await sbClient.from('cards').delete().in('id', wanted).select('id');
      if (del.error) { result.error = del.error; result.failedIds = wanted; return result; }
      const gone = new Set((del.data || []).map(r => r.id));
      const rest = wanted.filter(id => !gone.has(id));
      if (rest.length > 0) {
        const chk = await sbClient.from('cards').select('id').in('id', rest);
        if (chk.error) {
          result.error = chk.error;
          result.failedIds = rest;
        } else {
          const still = new Set((chk.data || []).map(r => r.id));
          rest.forEach(id => { if (still.has(id)) result.failedIds.push(id); else gone.add(id); });
        }
      }
      result.deletedIds = Array.from(gone);
    } catch (err) {
      result.error = err;
      result.deletedIds = [];
      result.failedIds = wanted;
    }
    return result;
  }

  // 3. ЗБЕРЕЖЕННЯ ТА ВІДНОВЛЕННЯ ПРОГРЕСУ СЕСІЇ ПРИ ПЕРЕМИКАННІ ЗАСТОСУНКІВ
  function saveActiveSessionProgress() {
    if (!activeRoundState || currentTab !== 'study') return;
    try {
      sessionStorage.setItem(SESSION_PROGRESS_KEY, JSON.stringify(activeRoundState));
    } catch (e) {}
  }

  function clearActiveSessionProgress() {
    activeRoundState = null;
    try {
      sessionStorage.removeItem(SESSION_PROGRESS_KEY);
    } catch (e) {}
  }

  function tryRestoreActiveSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_PROGRESS_KEY);
      if (!raw) return false;
      const saved = JSON.parse(raw);
      if (!saved || !saved.mode || state.words.length === 0) return false;
      currentTab = 'study';
      document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === 'study'));
      startMode(saved.mode, saved);
      return true;
    } catch (e) {
      return false;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      saveActiveSessionProgress();
      saveLocalStats();
    } else if (document.visibilityState === 'visible') {
      flushPendingProgress(); // учень повернувся: пробуємо догнати незбережене
    }
  });
  window.addEventListener('online', () => flushPendingProgress());
  window.addEventListener('pagehide', () => {
    saveActiveSessionProgress();
    saveLocalStats();
  });

  // 4. ДОПОМІЖНІ ФУНКЦІЇ ТА SM-2
  function todayStr(ts = Date.now()) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  // Кеш на пристрої окремий для кожного облікового запису: слова та налаштування одного учня не бачить інший.
  function storageKeyFor(email) {
    return email ? STORAGE_KEY + ':' + String(email).toLowerCase() : STORAGE_KEY;
  }
  function loadLocalStats() {
    try {
      const key = storageKeyFor(currentUser && currentUser.email);
      let raw = window.localStorage.getItem(key);
      if (!raw && key !== STORAGE_KEY) {
        // Міграція зі старого спільного ключа: перший, хто увійде після оновлення, зберігає свою серію й налаштування
        const legacy = window.localStorage.getItem(STORAGE_KEY);
        if (legacy) {
          raw = legacy;
          try { window.localStorage.setItem(key, legacy); window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        }
      }
      if (raw) {
        const p = JSON.parse(raw);
        state.settings = Object.assign(defaultState().settings, p.settings || {});
        state.stats = Object.assign(defaultState().stats, p.stats || {});
        if (Array.isArray(p.wordsCache) && state.words.length === 0) {
          state.words = p.wordsCache;
        }
      }
    } catch (e) {}
    checkDailyRollover();
    applyTheme();
  }
  function saveLocalStats() {
    checkDailyRollover();
    const key = storageKeyFor(currentUser && currentUser.email);
    const base = { settings: state.settings, stats: state.stats };
    try {
      window.localStorage.setItem(key, JSON.stringify(Object.assign({}, base, { wordsCache: state.words })));
    } catch (e) {
      // Не вмістилось (ліміт ~5 МБ): кеш слів можна відновити з хмари, а налаштування й серію втрачати не можна
      try { window.localStorage.setItem(key, JSON.stringify(base)); } catch (e2) {}
    }
  }
  function checkDailyRollover() {
    const today = todayStr();
    if (state.stats.dailyDate !== today) {
      state.stats.dailyDate = today;
      state.stats.answersToday = 0;
      state.stats.newLearnedToday = 0;
    }
  }
  function recordDailyActivity(wasNewWord) {
    checkDailyRollover();
    const today = todayStr();
    state.stats.answersToday += 1;
    if (wasNewWord) state.stats.newLearnedToday += 1;
    if (state.stats.lastStudyDate !== today) {
      const yesterday = todayStr(Date.now() - 86400000);
      if (state.stats.lastStudyDate === yesterday) state.stats.streak += 1;
      else state.stats.streak = 1;
      state.stats.lastStudyDate = today;
    }
  }
  // Відтінки мають збігатися з :root[data-accent="…"] у стилях
  const ACCENTS = [
    { id: 'forest', name: 'Ліс', h: 156 },
    { id: 'olive',  name: 'Олива', h: 110 },
    { id: 'ocean',  name: 'Океан', h: 205 },
    { id: 'ink',    name: 'Чорнило', h: 255 },
    { id: 'plum',   name: 'Слива', h: 330 },
    { id: 'terre',  name: 'Теракота', h: 40 }
  ];
  function applyTheme() {
    const root = document.documentElement;
    if (state.settings.theme === 'light' || state.settings.theme === 'dark') root.setAttribute('data-theme', state.settings.theme);
    else root.removeAttribute('data-theme');
    applyAccent();
    syncThemeButton();
  }
  /* Кнопка в шапці циклить ту саму настройку, що й список у «Налаштуваннях» —
     одне джерело правди, щоб два місця не розходилися. */
  const THEME_CYCLE = ['auto', 'light', 'dark'];
  const THEME_ICON = { auto: 'monitor', light: 'sun', dark: 'moon' };
  const THEME_NAME = { auto: 'Системна', light: 'Світла', dark: 'Темна' };
  function syncThemeButton() {
    const btn = document.getElementById('btnThemeToggle');
    if (!btn) return;
    const t = THEME_CYCLE.includes(state.settings.theme) ? state.settings.theme : 'auto';
    btn.innerHTML = icon(THEME_ICON[t]);
    btn.setAttribute('title', `Тема: ${THEME_NAME[t]}`);
    btn.setAttribute('aria-label', `Тема: ${THEME_NAME[t]}`);
  }
  function cycleTheme() {
    const cur = THEME_CYCLE.indexOf(state.settings.theme);
    state.settings.theme = THEME_CYCLE[(cur + 1) % THEME_CYCLE.length];
    applyTheme();
    saveLocalStats();
    if (currentTab === 'settings') renderCurrentTab();
  }
  function applyAccent() {
    const id = ACCENTS.some(a => a.id === state.settings.accent) ? state.settings.accent : 'forest';
    document.documentElement.setAttribute('data-accent', id);
  }
  function makeWordId(frText) {
    return String(frText || '').trim().toLowerCase().replace(/[^a-zàâäéèêëîïôöùûüÿçœæ]+/g, '-').replace(/^-+|-+$/g, '') || 'mot';
  }
  function stripDiacritics(str) {
    return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/œ/g, 'oe').replace(/æ/g, 'ae');
  }
  
  // Очищення виразу від службових позначень (qqn, qqch, + taille, дужок) зі збереженням керування прийменниками (à, de, pour)
  function getTestableFr(frText) {
    let s = String(frText || '').trim();
    if (s.includes('≠')) s = s.split('≠')[0].trim();
    s = s.replace(/\s*\([^)]*\)/g, '').trim();
    s = s.replace(/\s*\+\s*[a-zàâäéèêëîïôöùûüÿçœæ.\s/]+$/i, '').trim();
    s = s.replace(/\b(qqch|qqn|qch|qn)\b/gi, '').replace(/\s+/g, ' ').trim();
    s = s.replace(/\.\.\.\s*\??$/, '').trim();
    return s || String(frText || '').trim();
  }

  function getCleanPosForWrite(posStr) {
    if (!posStr) return '';
    return String(posStr).replace(/\s*\([^)]*\)/g, '').trim();
  }
  
  function getContextOptionText(fr) {
    let s = getTestableFr(fr);
    return s.replace(/^(le |la |les |un |une |des |l'|d'|se |s')/i, '').trim();
  }

  function getPromptText(word) {
    return state.settings.langMode === 'FR_FR' ? (word.def || word.uk || '—') : (word.uk || word.def || '—');
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function formatDueDate(word) {
    if (!word.r || word.r === 0) return '';
    const diff = word.due - Date.now();
    if (diff <= 0) return 'Сьогодні';
    const hours = Math.ceil(diff / (3600 * 1000));
    if (hours < 24) return `Через ${hours} год`;
    return `Через ${Math.ceil(diff / 86400000)} дн`;
  }
  
  function showToast(msg) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
  }

  const DAY_MS = 86400000; const MIN_MS = 60000;
  function getActiveWordsPool() {
    return (!state.settings.focusTopic || state.settings.focusTopic === 'all')
      ? state.words
      : state.words.filter(w => w.src === state.settings.focusTopic);
  }
  function getWordStatus(word) {
    if (!word.r || word.r === 0) return 'new';
    if (word.iv < 7) return 'learn';
    if (word.iv < 30) return 'know';
    return 'master';
  }
  function getStatusLabel(st) {
    return { 'new':'Нове', 'learn':'Вчу', 'know':'Знаю', 'master':'Засвоєно' }[st] || 'Нове';
  }
  
  function previewNextInterval(word, grade) {
    const isInitial = (word.r === 0 || word.iv < 1);
    let ivDays = 0;
    if (grade === 'again') return { iv: 0, ms: 10 * MIN_MS, label: '10 хв' };
    if (isInitial) {
      if (grade === 'hard') return { iv: 0.5, ms: 12 * 60 * MIN_MS, label: '12 год' };
      if (grade === 'good') return { iv: 1, ms: DAY_MS, label: '1 дн' };
      if (grade === 'easy') return { iv: 3, ms: 3 * DAY_MS, label: '3 дн' };
    } else {
      const ef = word.ef || 2.5;
      if (grade === 'hard') ivDays = Math.min(365, word.iv * 1.2);
      if (grade === 'good') ivDays = Math.min(365, word.iv * ef);
      if (grade === 'easy') ivDays = Math.min(365, word.iv * ef * 1.3);
      return { iv: Math.max(1, Math.round(ivDays * 10) / 10), label: `${Math.round(Math.max(1, ivDays))} дн` };
    }
  }

  function applySM2Grade(word, grade) {
    const now = Date.now();
    const wasNew = (word.r === 0);
    const isInitial = (word.r === 0 || word.iv < 1);
    let ef = word.ef || 2.5;
    let iv = word.iv || 0;
    if (grade === 'again') {
      iv = 0; ef = Math.max(1.3, ef - 0.2); word.l = (word.l || 0) + 1; word.due = now + 10 * MIN_MS;
    } else if (isInitial) {
      if (grade === 'hard') { iv = 0.5; word.due = now + 12 * 60 * MIN_MS; }
      else if (grade === 'good') { iv = 1; word.due = now + DAY_MS; }
      else if (grade === 'easy') { iv = 3; ef = Math.min(3.2, ef + 0.15); word.due = now + 3 * DAY_MS; }
    } else {
      if (grade === 'hard') { iv = Math.min(365, iv * 1.2); ef = Math.max(1.3, ef - 0.15); }
      else if (grade === 'good') { iv = Math.min(365, iv * ef); }
      else if (grade === 'easy') { iv = Math.min(365, iv * ef * 1.3); ef = Math.min(3.2, ef + 0.15); }
      iv = Math.round(iv * 100) / 100;
      word.due = now + iv * DAY_MS;
    }
    word.iv = iv; word.ef = Math.round(ef * 100) / 100; word.r = (word.r || 0) + 1; word.t = now;
    recordDailyActivity(wasNew);
    syncWordProgress(word);
  }

  function handleMiniGameResult(word, isCorrect) {
    const now = Date.now();
    if (!isCorrect) applySM2Grade(word, 'again');
    else if (word.r === 0 || word.due <= now) applySM2Grade(word, 'good');
    else { recordDailyActivity(false); saveLocalStats(); }
  }
  function pickStudyWords(count = 10, filterFn = null) {
    const pool = filterFn ? getActiveWordsPool().filter(filterFn) : getActiveWordsPool().slice();
    const now = Date.now();
    return [...shuffle(pool.filter(w => w.r > 0 && w.due <= now)), ...pool.filter(w => w.r === 0), ...shuffle(pool.filter(w => w.r > 0 && w.due > now))].slice(0, count);
  }
  function getDueAndNewQueues() {
    checkDailyRollover();
    const pool = getActiveWordsPool();
    const now = Date.now();
    const dueReview = pool.filter(w => w.r > 0 && w.due <= now).sort((a, b) => a.due - b.due);
    const newPool = pool.filter(w => w.r === 0);
    const newToday = newPool.slice(0, Math.max(0, state.settings.newLimit - state.stats.newLearnedToday));
    return { dueReview, newToday, combined: [...dueReview, ...newToday] };
  }

  // 5. ОЗВУЧЕННЯ БЕЗ ДУБЛЮВАННЯ ГОЛОСІВ
  const speechSupported = ('speechSynthesis' in window);
  let frenchVoices = [];
  let activeUtterances = [];

  function refreshVoices() {
    if (!speechSupported) return;
    const allVoices = window.speechSynthesis.getVoices();
    const rawFr = allVoices.filter(v => /^fr(-|_|$)/i.test(v.lang));
    
    // Жорстка дедуплікація за парою ім'я + мова
    const uniqueMap = new Map();
    rawFr.forEach(v => {
      const cleanName = String(v.name || '').trim().toLowerCase();
      const cleanLang = String(v.lang || '').trim().toLowerCase();
      const key = `${cleanName}__${cleanLang}`;
      if (!uniqueMap.has(key)) {
        uniqueMap.set(key, v);
      }
    });
    frenchVoices = Array.from(uniqueMap.values());

    const sel = document.getElementById('selVoice');
    if (sel) {
      const currentVal = state.settings.voiceURI || '';
      sel.innerHTML = '';
      const defOpt = document.createElement('option');
      defOpt.value = '';
      defOpt.textContent = 'Автоматичний вибір (найкращий доступний fr)';
      sel.appendChild(defOpt);

      frenchVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        if (currentVal === v.voiceURI) opt.selected = true;
        sel.appendChild(opt);
      });
    }
  }
  if (speechSupported) {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }

  // Швидкість «повільно» для диктанту. Нижче 0.4 мова розсипається на склади і вчить неправильної вимови.
  const SLOW_RATE = 0.45;
  const ENHANCED_VOICE_RE = /siri|premium|enhanced|neural|natural/i;

  // iOS/Safari ігнорує rate на «покращених» (Siri) голосах: повільне озвучення звучало так само швидко.
  // Якщо учень сам не обрав голос у налаштуваннях, для сповільненого темпу беремо звичайний голос.
  function pickVoiceForRate(voices, preferredURI, rate) {
    const list = Array.isArray(voices) ? voices : [];
    if (preferredURI) {
      const exact = list.find(v => v.voiceURI === preferredURI);
      if (exact) return exact;
    }
    if (list.length === 0) return null;
    const slow = rate < 0.9;
    if (slow) {
      const plain = list.filter(v => !ENHANCED_VOICE_RE.test(v.name || ''));
      if (plain.length > 0) {
        return plain.find(v => /thomas|audrey|aurelie|amélie|amelie|marie/i.test(v.name || '')) || plain[0];
      }
    }
    return list.find(v => /premium|enhanced|natural|thomas|audrey|aurelie|amélie|amelie|marie/i.test(v.name || '')) || list[0];
  }

  // На повільному темпі додаємо паузи між словами виразу (кома читається як пауза в усіх рушіях).
  function prepareSpeechText(text, rate) {
    let cleanText = String(text || '').replace(/\[|\]/g, '').trim();
    cleanText = cleanText.replace(/\s*\([^)]*\)/g, '').trim();
    cleanText = cleanText
      .replace(/\bqqch\b/gi, 'quelque chose')
      .replace(/\bqch\b/gi, 'quelque chose')
      .replace(/\bqqn\b/gi, "quelqu'un")
      .replace(/\bqn\b/gi, "quelqu'un");
    if (rate < 0.9) {
      const parts = cleanText.split(/\s+/).filter(Boolean);
      if (parts.length > 1) cleanText = parts.join(', ');
    }
    return cleanText;
  }

  function speakFrench(text, rate = 1.0) {
    if (!speechSupported) return;
    const safeRate = Math.min(2, Math.max(0.1, Number(rate) || 1));
    const cleanText = prepareSpeechText(text, safeRate);
    if (!cleanText) return;
    if (frenchVoices.length === 0) refreshVoices();
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = 'fr-FR';
      u.rate = safeRate;
      const chosenVoice = pickVoiceForRate(frenchVoices, state.settings.voiceURI, safeRate);
      if (chosenVoice) u.voice = chosenVoice;
      activeUtterances.push(u);
      u.onend = () => { const i = activeUtterances.indexOf(u); if (i > -1) activeUtterances.splice(i, 1); };
      u.onerror = () => { const i = activeUtterances.indexOf(u); if (i > -1) activeUtterances.splice(i, 1); };
      window.speechSynthesis.speak(u);
    }, 85);
  }

  function runCardsMode(container, restored = null) {
    const q = getDueAndNewQueues();
    let deck = [];
    let completed = 0;
    let totalInitial = 0;
    let revealed = false;
    const sum = new Map();

    if (restored && Array.isArray(restored.wordIds)) {
      deck = restored.wordIds.map(id => state.words.find(w => w.id === id)).filter(Boolean);
      completed = restored.completed || 0;
      totalInitial = restored.totalInitial || (deck.length + completed);
      revealed = Boolean(restored.revealed);
      if (Array.isArray(restored.results)) {
        restored.results.forEach(r => {
          const w = state.words.find(x => x.id === r.id);
          if (w) sum.set(w.id, { word: w, ok: r.ok });
        });
      }
    } else {
      deck = q.combined.length > 0 ? q.combined.slice() : shuffle(getActiveWordsPool()).slice(0, 10);
      totalInitial = deck.length;
    }

    if (deck.length === 0) { exitToDashboard(); return; }

    function syncSession() {
      activeRoundState = {
        mode: 'cards',
        wordIds: deck.map(w => w.id),
        completed,
        totalInitial,
        revealed,
        results: Array.from(sum.values()).map(r => ({ id: r.word.id, ok: r.ok }))
      };

    }

      container.innerHTML = `

              <button type="button" class="grade-btn grade-hard" data-g="hard"><span class="g-name">2 · Важко</span><span class="g-time">${previewNextInterval(w, 'hard').label}</span></button>

              <button type="button" class="grade-btn grade-easy" data-g="easy"><span class="g-name">4 · Легко</span><span class="g-time">${previewNextInterval(w, 'easy').label}</span></button>

      if (hasC) {

        switchTense('present');

      container.querySelector('#btnExit').addEventListener('click', exitToDashboard);
      if (!revealed) {
        container.querySelector('#btnRev').addEventListener('click', () => { revealed = true; renderCard(); });
      } else {
        container.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => grade(b.dataset.g)));
      }
    }

    function grade(g) {
      const w = deck.shift();
      applySM2Grade(w, g);
      if (!sum.has(w.id)) sum.set(w.id, { word: w, ok: g !== 'again' });
      if (g === 'again') deck.push(w);
      else completed++;
      revealed = false;
      renderCard();
    }

    function onKey(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (!revealed && e.key === 'Enter') { e.preventDefault(); revealed = true; renderCard(); }
      else if (revealed) {
        if (e.key === '1') grade('again');
        else if (e.key === '2') grade('hard');
        else if (e.key === '3' || e.key === 'Enter') grade('good');
        else if (e.key === '4') grade('easy');
      }
    }
    window.addEventListener('keydown', onKey);
    activeSessionCleanup = () => window.removeEventListener('keydown', onKey);
    renderCard();
  }

  /* =========================================================
   * 2. РЕЖИМ ВИБІР
   * ========================================================= */
  function runChoiceMode(container, restored = null) {
    let qs = [];
    let idx = 0;
    let ansd = false;
    const res = [];
    let opts = [];

    // Напрямок кожного питання запам'ятовується, щоб перемальовування не перевертало вже показане питання.
    let revs = [];

    if (restored && Array.isArray(restored.wordIds)) {
      qs = restored.wordIds.map(id => state.words.find(w => w.id === id)).filter(Boolean);
      idx = restored.idx || 0;
      if (Array.isArray(restored.revs)) revs = restored.revs.slice();
      if (Array.isArray(restored.results)) {
        restored.results.forEach(r => {
          const w = state.words.find(x => x.id === r.id);
          if (w) res.push({ word: w, ok: r.ok });
        });
      }
    } else {
      qs = pickStudyWords(10);
    }
    if (qs.length === 0 || idx >= qs.length) { exitToDashboard(); return; }

    function directionForIndex(i) {
      if (typeof revs[i] === 'boolean') return revs[i];
      const dir = state.settings.choiceDir || 'random';
      let rev;
      if (dir === 'uk_fr') rev = true;          // дано значення → обрати французьке слово
      else if (dir === 'fr_uk') rev = false;    // дано французьке слово → обрати значення
      else rev = Math.random() < 0.5;           // мікс
      revs[i] = rev;
      return rev;
    }

    function syncSession() {
      activeRoundState = {
        mode: 'choice',
        wordIds: qs.map(w => w.id),
        idx,
        revs: revs.slice(),
        results: res.map(r => ({ id: r.word.id, ok: r.ok }))
      };
      saveActiveSessionProgress();
    }

    function setup() {
      syncSession();
      const w = qs[idx];
      const dis = shuffle(getActiveWordsPool().filter(x => x.id !== w.id)).slice(0, 3);
      opts = shuffle([w, ...dis]);
      ansd = false;
      render(w);
    }

    function render(w, chId = null) {
      const rev = directionForIndex(idx);
      const isPromptFrench = !rev || state.settings.langMode === 'FR_FR';
      const areOptionsFrench = rev || state.settings.langMode === 'FR_FR';
      const meaningLabel = state.settings.langMode === 'FR_FR' ? 'DÉF' : 'УКР';
      const curDir = state.settings.choiceDir || 'random';
      const dirBtn = (id, label, title) =>
        `<button type="button" data-dir="${id}" class="${curDir === id ? 'active' : ''}" title="${escapeHtml(title)}">${escapeHtml(label)}</button>`;
      container.innerHTML = `
      <div class="session-header">
        <button class="btn btn-sm" id="btnEx">← До режимів</button>
        <span class="session-progress">Вибір · ${idx+1} / ${qs.length}</span>
      </div>
      <div class="dir-switch-row">
        <span class="dir-switch-label">Напрямок:</span>
        <div class="lang-switch dir-switch">
          ${dirBtn('uk_fr', `${meaningLabel} → ФР`, 'Дано значення — обрати французьке слово')}
          ${dirBtn('fr_uk', `ФР → ${meaningLabel}`, 'Дано французьке слово — обрати значення')}
          ${dirBtn('random', 'Мікс', 'Випадковий напрямок у кожному питанні')}
        </div>
      </div>
      <section class="study-card">
        <div class="instruction-text">${rev ? 'Оберіть французьке слово за значенням:' : 'Оберіть правильне значення слова:'}</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
          <div class="study-prompt">${escapeHtml(rev ? getPromptText(w) : w.fr)}</div>
          ${!rev ? speakerBtnHtml(w.fr) : ''}
        </div>
        <div class="options-grid">
          ${opts.map((o,i) => {
            const st = !ansd ? '' : (o.id === w.id ? 'correct' : (o.id === chId ? 'wrong' : ''));
            return optionHtml(i, rev ? o.fr : getPromptText(o), st, `data-opt="${o.id}"`, ansd);
          }).join('')}
        </div>
        ${ansd ? `<div style="margin-top:16px;display:flex;justify-content:center;">${speakerBtnHtml(w.fr)}</div><button type="button" class="btn btn-primary btn-next" id="bNx">Далі ${icon('arrowRight')}</button>` : ''}
      </section>`;
      container.querySelector('#btnEx').addEventListener('click', exitToDashboard);
      container.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => setDirection(b.dataset.dir)));
      container.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => choose(b.dataset.opt)));
      speakerCancelsAutoNext(container);
      if (ansd) container.querySelector('#bNx').addEventListener('click', next);
    }

    function setDirection(dir) {
      if (!['uk_fr', 'fr_uk', 'random'].includes(dir)) return;
      if (state.settings.choiceDir === dir) return;
      state.settings.choiceDir = dir;
      saveLocalStats();
      // На вже відповідане питання не впливаємо: новий напрямок діє з поточного (якщо не відповіли) або з наступного.
      if (!ansd) revs[idx] = undefined;
      syncSession();
      render(qs[idx]);
    }

    function choose(id) {
      if (ansd) return;
      ansd = true;
      const w = qs[idx];
      const ok = (id === w.id);
      handleMiniGameResult(w, ok);
      res.push({ word: w, ok });
      render(w, id);
      if (ok) scheduleAutoNext(next);
    }
    function next() {
      cancelAutoNext();
      idx++;
      if (idx >= qs.length) renderRoundSummary(container, 'choice', res);
      else setup();
    }
    function onK(e) {
      if (!ansd && ['1','2','3','4'].includes(e.key)) {
        const o = opts[Number(e.key) - 1];
        if (o) choose(o.id);
      } else if (ansd && e.key === 'Enter') {
        e.preventDefault();
        next();
      }
    }
    window.addEventListener('keydown', onK);
    activeSessionCleanup = () => window.removeEventListener('keydown', onK);
    setup();
  }

  /* =========================================================
   * 3. РЕЖИМ НАПИШИ
   * ========================================================= */
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }

  function evaluateWrittenAnswer(inputRaw, targetRaw) {
    const inp = stripDiacritics(String(inputRaw || '').trim().toLowerCase().replace(/[’‘]/g, "'"));
    const cleanTarget = getTestableFr(targetRaw);
    const tgtClean = stripDiacritics(cleanTarget.toLowerCase().replace(/[’‘]/g, "'"));
    const tgtFull = stripDiacritics(String(targetRaw || '').trim().toLowerCase().replace(/[’‘]/g, "'"));

    let validTargets = [tgtClean, tgtFull];

    if (cleanTarget.includes('/')) {
      const match = cleanTarget.match(/^(.*?)\b(\S+)\s*\/\s*(\S+)$/);
      if (match) {
        validTargets.push(stripDiacritics(`${match[1]}${match[3]} / ${match[2]}`.toLowerCase().trim()));
        validTargets.push(stripDiacritics(`${match[1]}${match[3]}/${match[2]}`.toLowerCase().trim()));
      }
      const parts = cleanTarget.split('/');
      if (parts.length === 2) {
        validTargets.push(stripDiacritics(`${parts[1].trim()} / ${parts[0].trim()}`.toLowerCase()));
      }
    }

    if (!inp) return 'err';

    if (validTargets.includes(inp)) {
      const rawLower = String(inputRaw || '').trim().toLowerCase().replace(/[’‘]/g, "'");
      const exactTargets = [
        cleanTarget.toLowerCase().replace(/[’‘]/g, "'"),
        String(targetRaw || '').trim().toLowerCase().replace(/[’‘]/g, "'")
      ];
      if (cleanTarget.includes('/')) {
        const m = cleanTarget.match(/^(.*?)\b(\S+)\s*\/\s*(\S+)$/);
        if (m) exactTargets.push(`${m[1]}${m[3]} / ${m[2]}`.trim().toLowerCase());
      }
      if (exactTargets.includes(rawLower)) return 'ok';
      return 'accent';
    }

    for (const t of validTargets) {
      if (t.length >= 4 && levenshtein(inp, t) <= 1) return 'typo';
    }
    return 'err';
  }

  // Зараховується ЛИШЕ точне написання: пропущений акцент — орфографічна помилка
  // і на DELF, і в будь-якому диктанті. Вердикт розрізняє причину, щоб учень бачив,
  // що саме не так, але на інтервальне повторення і 'accent', і 'typo' впливають як помилка.
  function isWrittenAnswerCorrect(verdict) {
    return verdict === 'ok';
  }

  function writtenVerdictMeta(verdict) {
    if (verdict === 'ok') return { cls: 'ok', title: 'Бездоганно!' };
    if (verdict === 'accent') return { cls: 'err', title: 'Літери правильні, але діакритика — це теж орфографія:' };
    if (verdict === 'typo') return { cls: 'err', title: 'Одруківка. Правильне написання:' };
    return { cls: 'err', title: 'Правильна відповідь:' };
  }

  // Підсвічує саме ті літери, де загубився акцент, щоб помилка запам'яталась візуально.
  function markAccentDiff(inputRaw, targetText) {
    const target = String(targetText || '');
    const input = String(inputRaw || '').trim();
    const norm = s => stripDiacritics(s).toLowerCase().replace(/[’‘]/g, "'");
    if (!input || norm(input) !== norm(target)) return escapeHtml(target);
    const inChars = Array.from(input);
    const tChars = Array.from(target);
    if (inChars.length !== tChars.length) return escapeHtml(target);
    return tChars.map((ch, i) => (
      ch.toLowerCase() === inChars[i].toLowerCase()
        ? escapeHtml(ch)
        : `<mark class="accent-miss">${escapeHtml(ch)}</mark>`
    )).join('');
  }

  function buildMaskTemplate(fr, revealedCount = 0) {
    let seenLetters = 0;
    const words = String(fr || '').trim().split(/\s+/).filter(Boolean);
    return words.map(word => {
      const charsHtml = Array.from(word).map(c => {
        if (c === '-' || c === "'" || c === '’' || c === '?' || c === '!' || c === '/' || c === '+') {
          return `<span class="template-char-revealed" style="color:var(--text-main); border:none;">${escapeHtml(c)}</span>`;
        }
        seenLetters++;
        if (seenLetters <= revealedCount) {
          return `<span class="template-char-revealed">${escapeHtml(c)}</span>`;
        }
        return `<span class="template-char-hidden">_</span>`;
      }).join('');
      return `<span class="template-word">${charsHtml}</span>`;
    }).join('');
  }

  /* =========================================================
   * 5. РЕЖИМ У КОНТЕКСТІ
   * ========================================================= */
  function runContextMode(container, restored = null) {
    let qs = [];
    let idx = 0;
    let ansd = false;
    let opts = [];
    const res = [];

    if (restored && Array.isArray(restored.wordIds)) {
      qs = restored.wordIds.map(id => state.words.find(w => w.id === id)).filter(Boolean);
      idx = restored.idx || 0;
      if (Array.isArray(restored.results)) {
        restored.results.forEach(r => {
          const w = state.words.find(x => x.id === r.id);
          if (w) res.push({ word: w, ok: r.ok });
        });
      }
    } else {
      qs = pickStudyWords(10, w => Boolean(w.ex));
    }
    if (qs.length < 1) {
      showToast('Мало слів із прикладами (ex)');
      exitToDashboard();
      return;
    }

    function syncSession() {
      activeRoundState = {
        mode: 'context',
        wordIds: qs.map(w => w.id),
        idx,
        results: res.map(r => ({ id: r.word.id, ok: r.ok }))
      };
      saveActiveSessionProgress();
    }

    function setup() {
      syncSession();
      const w = qs[idx];
      if (w.context_quiz && w.context_quiz.correct && Array.isArray(w.context_quiz.distractors) && w.context_quiz.distractors.length > 0) {
        const cText = String(w.context_quiz.correct).trim();
        const dList = w.context_quiz.distractors.slice(0, 3).map(d => ({ text: String(d).trim(), isCorrect: false }));
        opts = shuffle([{ text: cText, isCorrect: true }, ...dList]);
      } else {
        const bracketMatch = String(w.ex || '').match(/\[(.+?)\]/);
        const correctForm = bracketMatch ? bracketMatch[1].trim() : getContextOptionText(w.fr);
        const otherWords = shuffle(getActiveWordsPool().filter(x => x.id !== w.id)).slice(0, 3);
        const dList = otherWords.map(o => {
          const m = String(o.ex || '').match(/\[(.+?)\]/);
          return { text: m ? m[1].trim() : getContextOptionText(o.fr), isCorrect: false };
        });
        opts = shuffle([{ text: correctForm, isCorrect: true }, ...dList]);
      }
      ansd = false;
      render(w);
    }

    function render(w, chosenIndex = null) {
      container.innerHTML = `
      <div class="session-header">
        <button class="btn btn-sm" id="bEx">← До режимів</button>
        <span class="session-progress">У контексті · ${idx+1} / ${qs.length}</span>
      </div>
      <section class="study-card">
        <div class="instruction-text">Доповніть речення відповідним словом (${escapeHtml(getPromptText(w))}):</div>
        <div class="study-example">
          <div>
            <div>${ansd ? highlightBracketExample(w.ex) : escapeHtml(w.ex).replace(/\[.+?\]/g, '<span class="hl-word">[ … ]</span>')}</div>
            ${ansd && w.context_translation ? `<div style="font-family:var(--font-fr); font-size:0.85rem; color:var(--text-muted); margin-top:4px;">${escapeHtml(w.context_translation)}</div>` : ''}
          </div>
          ${ansd ? speakerBtnHtml(w.ex, 'Озвучити речення') : ''}
        </div>
        <div class="options-grid">
          ${opts.map((o, i) => {
            const st = !ansd ? '' : (o.isCorrect ? 'correct' : (i === chosenIndex ? 'wrong' : ''));
            return optionHtml(i, o.text, st, `data-idx="${i}"`, ansd);
          }).join('')}
        </div>
        ${ansd ? `<div class="next-row"><button type="button" class="btn btn-primary" id="bNx">Далі ${icon('arrowRight')}</button></div>` : ''}
      </section>`;
      container.querySelector('#bEx').addEventListener('click', exitToDashboard);
      container.querySelectorAll('[data-idx]').forEach(b => b.addEventListener('click', () => choose(Number(b.dataset.idx))));
      if (ansd) container.querySelector('#bNx').addEventListener('click', next);
    }

    function choose(i) {
      if (ansd) return;
      ansd = true;
      const w = qs[idx];
      const ok = Boolean(opts[i] && opts[i].isCorrect);
      handleMiniGameResult(w, ok);
      res.push({ word: w, ok });
      render(w, i);
      // Автопереходу тут навмисно немає: після відповіді відкривається озвучення
      // повного речення, і таймер обірвав би його на півслові.
    }
    function next() {
      idx++;
      if (idx >= qs.length) renderRoundSummary(container, 'context', res);
      else setup();
    }
    function onK(e) {
      if (!ansd && ['1','2','3','4'].includes(e.key)) {
        const i = Number(e.key) - 1;
        if (opts[i]) choose(i);
      } else if (ansd && e.key === 'Enter') {
        e.preventDefault();
        next();
      }
    }
    window.addEventListener('keydown', onK);
    activeSessionCleanup = () => window.removeEventListener('keydown', onK);
    setup();
  }

    function syncSession() {

      };

    function render(w, ch = null) {

      <div class="session-header">
