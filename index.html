<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boîte à Mots — Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  var(--bg-page): #f6f4ee;
  var(--bg-card): #fdfcf9;
  var(--bg-elevated): #ede9df;
  var(--bg-input): #ffffff;
  var(--text-main): #1f242e;
  var(--text-muted): #5c6473;
  var(--text-faint): #8a92a0;

  var(--accent): #1e3a5f;
  var(--accent-hover): #152943;
  var(--accent-soft): #e5edf5;
  var(--border): #dcd7ca;
  var(--border-subtle): #eae5d8;

  var(--card-top-line): #9b2c2c;
  var(--card-seyes-main): rgba(43, 90, 140, 0.045);
  var(--card-margin-line): rgba(180, 60, 60, 0.16);

  var(--danger): #9b2c2c;
  var(--danger-soft): #fbf0f0;
  var(--warning): #a36116;
  var(--warning-soft): #fbf3e6;
  var(--success): #286343;
  var(--success-soft): #edf6f0;

  var(--st-new): #6b778d;
  var(--st-learn): #a36116;
  var(--st-know): #2c5282;
  var(--st-master): #286343;

  var(--shadow): 0 3px 10px rgba(35, 30, 20, 0.05), 0 1px 3px rgba(35, 30, 20, 0.04);
  var(--radius): 6px;
  var(--font-ui): 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  var(--font-fr): 'Literata', Georgia, 'Times New Roman', serif;
  var(--font-mono): 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    var(--bg-page): #15171c; var(--bg-card): #1c1f26; var(--bg-elevated): #262a34; var(--bg-input): #171920;
    var(--text-main): #f0eee6; var(--text-muted): #9fa6b2; var(--text-faint): #6c7380;
    var(--accent): #7ca5d8; var(--accent-hover): #a3c4ed; var(--accent-soft): #1e2838;
    var(--border): #353a47; var(--border-subtle): #292d37;
    var(--card-top-line): #c94a4a; var(--card-seyes-main): rgba(255, 255, 255, 0.025); var(--card-margin-line): rgba(230, 90, 90, 0.22);
    var(--danger): #f87171; var(--danger-soft): #381a1a; var(--warning): #fbbf24; var(--warning-soft): #3a280c;
    var(--success): #4ade80; var(--success-soft): #123320;
    var(--shadow): 0 4px 16px rgba(0, 0, 0, 0.4);
  }
}

:root[data-theme="dark"] {
    var(--bg-page): #15171c; var(--bg-card): #1c1f26; var(--bg-elevated): #262a34; var(--bg-input): #171920;
    var(--text-main): #f0eee6; var(--text-muted): #9fa6b2; var(--text-faint): #6c7380;
    var(--accent): #7ca5d8; var(--accent-hover): #a3c4ed; var(--accent-soft): #1e2838;
    var(--border): #353a47; var(--border-subtle): #292d37;
    var(--card-top-line): #c94a4a; var(--card-seyes-main): rgba(255, 255, 255, 0.025); var(--card-margin-line): rgba(230, 90, 90, 0.22);
    var(--danger): #f87171; var(--danger-soft): #381a1a; var(--warning): #fbbf24; var(--warning-soft): #3a280c;
    var(--success): #4ade80; var(--success-soft): #123320;
    var(--shadow): 0 4px 16px rgba(0, 0, 0, 0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; overflow-x: hidden; background-color: var(--bg-page); color: var(--text-main); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* AUTH & TEACHER SCREENS */
.auth-container { max-width: 500px; margin: 60px auto; background: var(--bg-card); padding: 30px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.auth-logo { font-family: var(--font-fr); font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 24px; color: var(--text-main); }
.teacher-textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); font-family: var(--font-mono); font-size: 13px; resize: vertical; margin-bottom: 16px; }

/* APP SHELL */
.app-shell { max-width: 760px; margin: 0 auto; padding: 16px 16px 54px; display: none; flex-direction: column; gap: 16px; }
.app-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand-title { font-family: var(--font-fr); font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-main); }
.brand-sub { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); }
.header-controls { display: flex; align-items: center; gap: 8px; }

.lang-switch { display: inline-flex; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 2px; }
.lang-switch button { min-height: 38px; padding: 0 12px; border: none; background: transparent; border-radius: calc(var(--radius) - 2px); font-size: 0.8125rem; font-family: var(--font-mono); font-weight: 600; cursor: pointer; color: var(--text-muted); }
.lang-switch button.active { background: var(--bg-card); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

.nav-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--bg-elevated); padding: 4px; border-radius: var(--radius); border: 1px solid var(--border); }
.nav-tab { min-height: 44px; border: none; background: transparent; border-radius: calc(var(--radius) - 2px); font-weight: 600; font-size: 0.9375rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background-color 0.15s, color 0.15s; }
.nav-tab.active { background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow); }

.index-card { background-color: var(--bg-card); background-image: linear-gradient(90deg, transparent 42px, var(--card-margin-line) 42px, var(--card-margin-line) 43px, transparent 43px), repeating-linear-gradient(to bottom, transparent 0px, transparent 31px, var(--card-seyes-main) 31px, var(--card-seyes-main) 32px); border: 1px solid var(--border); border-top: 3px solid var(--card-top-line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 22px 22px 52px; position: relative; }
@media (max-width: 480px) { .index-card { padding: 18px 16px 18px 20px; background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 31px, var(--card-seyes-main) 31px, var(--card-seyes-main) 32px); } }
.panel-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }

/* BUTTONS */
.btn { min-height: 44px; padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-weight: 500; font-size: 0.9375rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background-color 0.15s, border-color 0.15s; width: 100%; margin-bottom:8px; }
@media (min-width: 480px) { .btn { width: auto; margin-bottom:0; } }
.btn:hover:not(:disabled) { background: var(--bg-elevated); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.btn-sm { min-height: 38px; padding: 4px 10px; font-size: 0.8125rem; }
.btn-icon { min-width: 42px; min-height: 42px; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.btn-icon:hover { background: var(--bg-elevated); color: var(--accent); }
svg.icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text-main); font-size: 0.9375rem; margin-bottom: 12px; box-sizing: border-box; }
.select { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text-main); font-size: 0.9375rem; }

/* DASHBOARD */
.topic-focus-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: var(--bg-elevated); border-radius: var(--radius); border: 1px solid var(--border); font-size: 0.875rem; }
.topic-focus-select { padding: 6px 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); font-weight: 600; color: var(--text-main); max-width: 250px; }
.hero-grid { display: flex; flex-direction: column; gap: 16px; }
.hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.due-counter { display: flex; flex-direction: column; }
.due-label { font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 600; }
.due-number { font-family: var(--font-mono); font-size: 2.6rem; font-weight: 700; line-height: 1.1; color: var(--accent); }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 14px; border-top: 1px solid var(--border-subtle); }
.stat-item { display: flex; flex-direction: column; }
.stat-val { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600; }
.stat-lbl { font-size: 0.75rem; color: var(--text-muted); }
.section-label { font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 10px; }
.segment-bar { height: 12px; width: 100%; background: var(--bg-elevated); border-radius: 6px; overflow: hidden; display: flex; margin-bottom: 10px; }
.seg-part { height: 100%; transition: width 0.3s ease; }
.segment-legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.8125rem; }
@media (min-width: 480px) { .segment-legend { grid-template-columns: repeat(4, 1fr); } }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.legend-count { font-family: var(--font-mono); font-weight: 600; margin-left: auto; }
.forecast-chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 110px; padding-top: 18px; }
.forecast-col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.forecast-val { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
.forecast-bar-wrap { width: 100%; max-width: 32px; flex: 1; display: flex; align-items: flex-end; background: var(--bg-elevated); border-radius: 4px; overflow: hidden; }
.forecast-bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; }
.forecast-day { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); }
.modes-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .modes-grid { grid-template-columns: repeat(2, 1fr); } }
.mode-tile { text-align: left; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: border-color 0.15s, transform 0.1s; min-height: 76px; }
.mode-tile:hover:not(.disabled) { border-color: var(--accent); }
.mode-tile.disabled { opacity: 0.55; cursor: not-allowed; }
.mode-icon-box { width: 40px; height: 40px; border-radius: var(--radius); background: var(--bg-elevated); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mode-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
.mode-desc { font-size: 0.8125rem; color: var(--text-muted); line-height: 1.35; }

/* CARDS & BLITZ */
.session-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.session-progress { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
.study-word-title { font-family: var(--font-fr); font-size: 1.95rem; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
.study-pos { font-family: var(--font-fr); font-size: 0.88rem; color: var(--text-muted); font-style: italic; margin-bottom: 16px; }
.study-divider { border: none; border-top: 1px dashed var(--border); margin: 16px 0; }
.study-meaning { font-size: 1.25rem; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
.study-def { font-family: var(--font-fr); font-size: 0.98rem; line-height: 1.5; color: var(--text-muted); margin-bottom: 12px; padding-left: 10px; border-left: 2px solid var(--border); }
.study-example { font-family: var(--font-fr); font-size: 1.05rem; line-height: 1.45; padding: 12px 14px; background: var(--bg-elevated); border-left: 3px solid var(--card-top-line); border-radius: 4px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hl-word { color: var(--card-top-line); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.grade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
@media (min-width: 480px) { .grade-grid { grid-template-columns: repeat(4, 1fr); } }
.grade-btn { min-height: 54px; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.grade-btn:hover { border-color: var(--accent); background: var(--bg-elevated); }
.grade-btn .g-name { font-weight: 600; font-size: 0.9rem; }
.grade-btn .g-time { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
.grade-again { border-bottom: 3px solid var(--danger); }
.grade-hard { border-bottom: 3px solid var(--warning); }
.grade-good { border-bottom: 3px solid var(--accent); }
.grade-easy { border-bottom: 3px solid var(--success); }

/* CONJUGATION & FEEDBACK (BLITZ) */
.btn-toggle-conj { background-color: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; transition: all 0.2s ease; width: auto; font-family: var(--font-ui); font-weight: 500;}
.btn-toggle-conj:hover { background-color: var(--accent); color: #fff; }
.conj-box { display: none; background: var(--bg-elevated); border-radius: 10px; padding: 16px; margin-bottom: 20px; border: 1px solid var(--border); text-align: left; animation: fadeIn 0.25s ease-out; }
.conj-box.open { display: block; }
.tabs-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: thin; }
.tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; font-size: 13px; border-radius: 6px; white-space: nowrap; cursor: pointer; width: auto; margin-bottom: 0; }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.forms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; background: var(--bg-card); border-radius: 8px; padding: 14px; border: 1px solid var(--border); }
@media (max-width: 480px) { .forms-grid { grid-template-columns: 1fr; } }
.form-row-c { font-family: var(--font-mono); font-size: 14px; display: flex; align-items: baseline; }
.pronoun { color: var(--text-muted); margin-right: 6px; font-family: var(--font-ui); font-size: 13px; min-width: 32px; }
.passe-compose-banner { background: var(--bg-card); padding: 12px; border-radius: 8px; font-size: 14px; border: 1px solid var(--border); line-height: 1.6; }

.feedback-toast { position: absolute; top: -15px; right: 15px; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; opacity: 0; transform: translateY(-10px); transition: all 0.3s ease; }
.feedback-toast.show { opacity: 1; transform: translateY(0); }
.bg-green { background: var(--success-soft); color: var(--success); border: 1px solid var(--success);}
.bg-red { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger);}

/* OTHER MODES UI */
.options-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.option-btn { min-height: 48px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.95rem; width:100%;}
.option-btn:hover:not(:disabled) { border-color: var(--accent); }
.option-key { font-family: var(--font-mono); font-size: 0.75rem; width: 24px; height: 24px; border-radius: 4px; background: var(--bg-elevated); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.option-btn.correct { border-color: var(--success); background: var(--success-soft); }
.option-btn.wrong { border-color: var(--danger); background: var(--danger-soft); }

.template-mask { font-family: var(--font-mono); font-size: 1.35rem; letter-spacing: 0.08em; color: var(--accent); margin: 14px 0; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.template-word { display: inline-flex; gap: 5px; white-space: nowrap; }
.feedback-box { margin-top: 12px; padding: 12px; border-radius: var(--radius); font-size: 0.9375rem; }
.feedback-box.ok { background: var(--success-soft); color: var(--success); border: 1px solid var(--success); }
.feedback-box.almost { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); }
.feedback-box.err { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }

.pairs-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pair-card { min-height: 52px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; text-align: center; word-break: break-word; }
.pair-card.selected { border-color: var(--accent); background: var(--accent-soft); }
.pair-card.matched { opacity: 0.35; pointer-events: none; border-color: var(--success); }

.anagram-slots, .anagram-pool { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; min-height: 48px; }
.letter-tile { min-width: 44px; min-height: 44px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.letter-tile.used { opacity: 0.3; pointer-events: none; }

.cw-wrapper { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.cw-grid { display: grid; gap: 2px; background: var(--border); padding: 3px; border-radius: 6px; max-width: 100%; overflow-x: auto; }
.cw-cell { width: clamp(26px, 7.2vw, 38px); height: clamp(26px, 7.2vw, 38px); position: relative; background: var(--bg-elevated); }
.cw-cell.empty { background: transparent; }
.cw-cell input { width: 100%; height: 100%; border: 1px solid var(--border); background: var(--bg-card); text-align: center; font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600; text-transform: lowercase; padding: 0; border-radius: 2px; }
.cw-cell input.cw-ok { background: var(--success-soft); color: var(--success); }
.cw-cell input.cw-err { background: var(--danger-soft); color: var(--danger); }
.cw-num { position: absolute; top: 1px; left: 2px; font-size: 9px; font-family: var(--font-mono); color: var(--text-muted); pointer-events: none; line-height: 1; }
.cw-clues { width: 100%; display: grid; grid-template-columns: 1fr; gap: 12px; font-size: 0.875rem; }
@media (min-width: 540px) { .cw-clues { grid-template-columns: 1fr 1fr; } }
.cw-clue-item { padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.cw-clue-item:hover { background: var(--bg-elevated); }

/* WORDS LIST & MODALS */
.words-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters-bar { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
@media (min-width: 540px) { .filters-bar { grid-template-columns: 1.4fr 1fr 1fr; } }
.word-list { display: flex; flex-direction: column; gap: 10px; }
.word-item { background: var(--bg-card); border: 1px solid var(--border); border-left: 4px solid var(--st-new); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.word-item[data-status="learn"] { border-left-color: var(--st-learn); }
.word-item[data-status="know"] { border-left-color: var(--st-know); }
.word-item[data-status="master"] { border-left-color: var(--st-master); }
.word-item-header { display: flex; flex-direction: column; gap: 4px; }
.word-fr-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
.word-fr { font-family: var(--font-fr); font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
.word-pos { font-family: var(--font-fr); font-size: 0.82rem; font-style: italic; color: var(--text-muted); }
.word-badges-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.badge { font-size: 0.72rem; font-family: var(--font-mono); padding: 2px 7px; border-radius: 4px; background: var(--bg-elevated); color: var(--text-muted); }
.word-meaning { font-size: 0.98rem; color: var(--accent); font-weight: 600; }
.word-item-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--border-subtle); font-size: 0.78rem; color: var(--text-muted); }
.inline-confirm { display: inline-flex; align-items: center; gap: 6px; }
.empty-state { text-align: center; padding: 38px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty-title { font-family: var(--font-fr); font-size: 1.45rem; font-weight: 600; }
.empty-desc { color: var(--text-muted); max-width: 460px; font-size: 0.9375rem; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal-backdrop.open { display: flex; }
.modal-box { background: var(--bg-card); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: var(--radius); max-width: 540px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.form-row { display: flex; flex-direction: column; gap: 4px; }
.form-row label { font-size: 0.8125rem; font-weight: 600; color: var(--text-muted); }
.toast-container { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 92vw; width: 420px; pointer-events: none; }
.toast { background: var(--text-main); color: var(--bg-card); padding: 12px 16px; border-radius: var(--radius); font-size: 0.875rem; box-shadow: var(--shadow); pointer-events: auto; }
.setting-group { display: flex; flex-direction: column; gap: 12px; }
.setting-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); }
.summary-list { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; max-height: 300px; overflow-y: auto; }
.summary-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--bg-elevated); border-radius: 4px; font-size: 0.9rem; }
.mark-ok { color: var(--success); font-family: var(--font-mono); font-weight: 700; }
.mark-err { color: var(--danger); font-family: var(--font-mono); font-weight: 700; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ЕКРАН АВТОРИЗАЦІЇ -->
<div id="auth-screen" class="auth-container">
  <div class="auth-logo">Boîte à Mots</div>
  <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">Вхід до персональної картотеки</p>
  <input type="email" id="email-input" class="input" placeholder="Введіть ваш email (напр. vlad@gmail.com)">
  <button onclick="sendMagicLink()" id="login-btn" class="btn btn-primary" style="width:100%;">Отримати посилання для входу</button>
  <p id="auth-msg" style="text-align: center; color: var(--success); font-size: 14px; display: none; margin-top:16px;"></p>
</div>

<!-- ПАНЕЛЬ ВИКЛАДАЧА -->
<div id="teacher-screen" class="auth-container" style="display:none; max-width:600px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2>Панель викладача 👨‍🏫</h2>
    <button class="btn btn-sm" onclick="signOut()">Вийти</button>
  </div>
  <p style="font-size: 14px; color: var(--text-muted); margin-bottom:8px;">Додавання слів учню</p>
  <input type="email" id="target-student-email" class="input" placeholder="Email учня">
  <textarea id="json-code" class="teacher-textarea" placeholder='Вставте сюди код масиву з Notion...'></textarea>
  <button onclick="addWordsToStudent()" class="btn btn-primary" style="width:100%;">Відправити слова учню</button>
</div>

<!-- ГОЛОВНИЙ ДОДАТОК УЧНЯ -->
<div id="app-screen" class="app-shell">
  <header class="app-header">
    <div class="brand">
      <h1 class="brand-title">Boîte à Mots</h1>
      <span class="brand-sub">Cloud</span>
    </div>
    <div class="header-controls">
      <div class="lang-switch" role="group" aria-label="Режим підказок">
        <button type="button" id="btnModeUkFr" class="active">UK + FR</button>
        <button type="button" id="btnModeFrFr">FR + FR</button>
      </div>
      <button class="btn btn-sm" style="margin-left:8px;" onclick="signOut()">Вийти</button>
    </div>
  </header>

  <nav class="nav-tabs" aria-label="Головна навігація">
    <button type="button" class="nav-tab active" data-tab="study">Вчити</button>
    <button type="button" class="nav-tab" data-tab="words">Слова <span id="navWordCount" class="badge">0</span></button>
    <button type="button" class="nav-tab" data-tab="settings">Налаштування</button>
  </nav>

  <main id="mainView"></main>
</div>

<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div id="modalContent" class="modal-box"></div>
</div>
<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script>
  // === ІНІЦІАЛІЗАЦІЯ SUPABASE ===
  const SUPABASE_URL = 'https://oxcpvcbvxmiszseckdcd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DAiE12czwiINHefrIYMyrg_brCfYWs-';
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ADMIN_EMAIL = 'nikita.francais@gmail.com'; 
  
  let currentUser = null;
  let currentVerbData = null; // Для відмінювання

  // === СТАН ЗАСТОСУНКУ (ГІБРИДНИЙ) ===
  // Слова тепер завантажуються з БД. Налаштування і статистика (стрік) залишаються в LocalStorage.
  const STORAGE_KEY = 'bam_app_data_cloud_v1';
  let memoryFallback = false;

  const defaultState = () => ({
    words: [], // заповнюється з Supabase
    settings: { langMode: 'UK_FR', newLimit: 10, voiceURI: '', theme: 'auto', focusTopic: 'all' },
    stats: { streak: 0, lastStudyDate: '', dailyDate: todayStr(), answersToday: 0, newLearnedToday: 0, blitzBest: 0 }
  });
  let state = defaultState();

  // === АВТОРИЗАЦІЯ ===
  async function checkSession() {
      try {
          const { data: { session }, error } = await sbClient.auth.getSession();
          if (session) {
              currentUser = session.user;
              if (currentUser.email === ADMIN_EMAIL) {
                  document.getElementById('auth-screen').style.display = 'none';
                  document.getElementById('teacher-screen').style.display = 'block';
                  document.getElementById('app-screen').style.display = 'none';
              } else {
                  document.getElementById('auth-screen').style.display = 'none';
                  document.getElementById('teacher-screen').style.display = 'none';
                  document.getElementById('app-screen').style.display = 'flex';
                  loadLocalStats();
                  loadStudentWords();
              }
          } else {
              document.getElementById('auth-screen').style.display = 'block';
              document.getElementById('teacher-screen').style.display = 'none';
              document.getElementById('app-screen').style.display = 'none';
          }
      } catch (err) { console.error(err); }
  }

  async function sendMagicLink() {
      const email = document.getElementById('email-input').value.trim();
      if (!email) return alert('Введіть email');
      const btn = document.getElementById('login-btn');
      btn.innerText = 'Відправка...'; btn.disabled = true;
      const { error } = await sbClient.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href } });
      if (error) {
          alert('Помилка: ' + error.message);
          btn.innerText = 'Отримати посилання'; btn.disabled = false;
      } else {
          document.getElementById('auth-msg').innerText = '✅ Посилання надіслано! Перевірте пошту.';
          document.getElementById('auth-msg').style.display = 'block';
          btn.style.display = 'none';
      }
  }

  async function signOut() {
      await sbClient.auth.signOut();
      window.location.reload();
  }

  sbClient.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_IN') checkSession(); });
  checkSession();

  // === ВИКЛАДАЧ: ДОДАВАННЯ СЛІВ У SUPABASE ===
  async function addWordsToStudent() {
      const email = document.getElementById('target-student-email').value.trim();
      const code = document.getElementById('json-code').value.trim();
      if (!email || !code) return alert('Заповніть пошту та вставте код');

      try {
          const wordsArray = JSON.parse(code);
          const recordsToInsert = wordsArray.map(w => ({
              user_email: email,
              fr: w.fr, uk: w.uk, def: w.def || '', ex: w.ex || '',
              syn: w.syn || [], conj: w.conj || null, pos: w.pos || '', src: w.src || 'Загальний',
              status: 'new', iv: 0, ef: 2.5, r: 0, l: 0, due: 0, t: 0
          }));

          const { error } = await sbClient.from('cards').insert(recordsToInsert);
          if (error) throw error;
          alert(`✅ Успішно додано ${recordsToInsert.length} слів!`);
          document.getElementById('json-code').value = '';
      } catch (err) { alert('Помилка формату коду: ' + err.message); }
  }

  // === УЧЕНЬ: ЗАВАНТАЖЕННЯ І СИНХРОНІЗАЦІЯ СЛІВ З SUPABASE ===
  async function loadStudentWords() {
      const { data, error } = await sbClient.from('cards').select('*').eq('user_email', currentUser.email);
      if (!error && data) {
          state.words = data.map(row => ({
              dbId: row.id, // ID в базі Supabase
              id: makeWordId(row.fr), // Локальний ID для сумісності з UI
              fr: row.fr, uk: row.uk, def: row.def, ex: row.ex, syn: row.syn, conj: row.conj,
              pos: row.pos, src: row.src,
              iv: row.iv || 0, ef: row.ef || 2.5, r: row.r || 0, l: row.l || 0, due: row.due || 0, t: row.t || 0
          }));
          updateNavBadge();
          renderCurrentTab();
      }
  }

  async function syncWordProgress(word) {
      // Оновлюємо прогрес конкретного слова у хмарі
      if(!word.dbId) return;
      await sbClient.from('cards').update({
          iv: word.iv, ef: word.ef, r: word.r, l: word.l, due: word.due, t: word.t,
          status: getWordStatus(word)
      }).eq('id', word.dbId);
  }

  // === БАЗОВА ЛОГІКА ДОДАТКУ (LocalStats, SM-2, UI) ===
  function todayStr(ts = Date.now()) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function loadLocalStats() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state.settings = Object.assign(defaultState().settings, parsed.settings || {});
        state.stats = Object.assign(defaultState().stats, parsed.stats || {});
      }
    } catch (e) { memoryFallback = true; }
    checkDailyRollover();
    applyTheme();
  }

  function saveLocalStats() {
    checkDailyRollover();
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ settings: state.settings, stats: state.stats }));
    } catch (e) { memoryFallback = true; }
  }

  function checkDailyRollover() {
    const today = todayStr();
    if (state.stats.dailyDate !== today) {
      state.stats.dailyDate = today;
      state.stats.answersToday = 0;
      state.stats.newLearnedToday = 0;
    }
  }

  function recordDailyActivity(wasNewWord) {
    checkDailyRollover();
    const today = todayStr();
    state.stats.answersToday += 1;
    if (wasNewWord) state.stats.newLearnedToday += 1;
    if (state.stats.lastStudyDate !== today) {
      const yesterday = todayStr(Date.now() - 86400000);
      if (state.stats.lastStudyDate === yesterday) state.stats.streak += 1;
      else state.stats.streak = 1;
      state.stats.lastStudyDate = today;
    }
  }

  function applyTheme() {
    const root = document.documentElement;
    if (state.settings.theme === 'light' || state.settings.theme === 'dark') root.setAttribute('data-theme', state.settings.theme);
    else root.removeAttribute('data-theme');
  }

  function showToast(msg, duration = 3800) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, duration);
  }

  function makeWordId(frText) {
    return String(frText || '').trim().toLowerCase().replace(/[^a-zàâäéèêëîïôöùûüÿçœæ]+/g, '-').replace(/^-+|-+$/g, '') || 'mot';
  }

  function stripFrenchArticles(frText) {
    let s = String(frText || '').trim().toLowerCase().replace(/[’‘]/g, "'");
    const prefixes = ['un ', 'une ', 'le ', 'la ', 'les ', "l'", "d'", 'se ', "s'"];
    let changed = true;
    while (changed) {
      changed = false;
      for (const p of prefixes) { if (s.startsWith(p)) { s = s.slice(p.length).trim(); changed = true; break; } }
    }
    return makeWordId(s);
  }

  function stripDiacritics(str) { return String(str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/œ/g, 'oe').replace(/æ/g, 'ae'); }
  function getPromptText(word) { return state.settings.langMode === 'FR_FR' ? (word.def || word.uk || '—') : (word.uk || word.def || '—'); }

  const DAY_MS = 86400000;
  const MIN_MS = 60000;

  function getActiveWordsPool() { return (!state.settings.focusTopic || state.settings.focusTopic === 'all') ? state.words : state.words.filter(w => w.src === state.settings.focusTopic); }
  function getWordStatus(word) {
    if (!word.r || word.r === 0) return 'new';
    if (word.iv < 7) return 'learn';
    if (word.iv < 30) return 'know';
    return 'master';
  }
  function getStatusLabel(status) {
    switch (status) { case 'new': return 'Нове'; case 'learn': return 'Вчу'; case 'know': return 'Знаю'; case 'master': return 'Засвоєно'; default: return 'Нове'; }
  }

  function previewNextInterval(word, grade) {
    const isInitial = (word.r === 0 || word.iv < 1);
    let ivDays = 0;
    if (grade === 'again') return { iv: 0, ms: 10 * MIN_MS, label: '10 хв' };
    if (isInitial) {
      if (grade === 'hard') return { iv: 0.5, ms: 12 * 60 * MIN_MS, label: '12 год' };
      if (grade === 'good') return { iv: 1, ms: DAY_MS, label: '1 дн' };
      if (grade === 'easy') return { iv: 3, ms: 3 * DAY_MS, label: '3 дн' };
    } else {
      const ef = word.ef || 2.5;
      if (grade === 'hard') ivDays = Math.min(365, word.iv * 1.2);
      if (grade === 'good') ivDays = Math.min(365, word.iv * ef);
      if (grade === 'easy') ivDays = Math.min(365, word.iv * ef * 1.3);
      ivDays = Math.max(1, Math.round(ivDays * 10) / 10);
      return { iv: ivDays, ms: ivDays * DAY_MS, label: `${Math.round(ivDays)} дн` };
    }
  }

  function applySM2Grade(word, grade) {
    const now = Date.now();
    const wasNew = (word.r === 0);
    const isInitial = (word.r === 0 || word.iv < 1);
    let ef = word.ef || 2.5;
    let iv = word.iv || 0;

    if (grade === 'again') {
      iv = 0; ef = Math.max(1.3, ef - 0.2); word.l = (word.l || 0) + 1; word.due = now + 10 * MIN_MS;
    } else if (isInitial) {
      if (grade === 'hard') { iv = 0.5; word.due = now + 12 * 60 * MIN_MS; }
      else if (grade === 'good') { iv = 1; word.due = now + DAY_MS; }
      else if (grade === 'easy') { iv = 3; ef = Math.min(3.2, ef + 0.15); word.due = now + 3 * DAY_MS; }
    } else {
      if (grade === 'hard') { iv = Math.min(365, iv * 1.2); ef = Math.max(1.3, ef - 0.15); }
      else if (grade === 'good') { iv = Math.min(365, iv * ef); }
      else if (grade === 'easy') { iv = Math.min(365, iv * ef * 1.3); ef = Math.min(3.2, ef + 0.15); }
      iv = Math.round(iv * 100) / 100;
      word.due = now + iv * DAY_MS;
    }
    word.iv = iv; word.ef = Math.round(ef * 100) / 100; word.r = (word.r || 0) + 1; word.t = now;

    recordDailyActivity(wasNew);
    saveLocalStats();
    syncWordProgress(word); // Зберігаємо зміну в хмарі
  }

  function handleMiniGameResult(word, isCorrect) {
    const now = Date.now();
    if (!isCorrect) applySM2Grade(word, 'again');
    else if (word.r === 0 || word.due <= now) applySM2Grade(word, 'good');
    else { recordDailyActivity(false); saveLocalStats(); }
  }

  function getDueAndNewQueues() {
    checkDailyRollover();
    const pool = getActiveWordsPool();
    const now = Date.now();
    const dueReview = pool.filter(w => w.r > 0 && w.due <= now).sort((a, b) => a.due - b.due);
    const remainingNewAllowance = Math.max(0, state.settings.newLimit - state.stats.newLearnedToday);
    const newPool = pool.filter(w => w.r === 0);
    const newToday = newPool.slice(0, remainingNewAllowance);
    return { dueReview, newToday, combined: [...dueReview, ...newToday], totalNewAvailable: newPool.length };
  }

  // === WEB SPEECH API ===
  const speechSupported = ('speechSynthesis' in window);
  let frenchVoices = [];
  let activeUtterances = [];

  function refreshVoices() {
    if (!speechSupported) return;
    frenchVoices = window.speechSynthesis.getVoices().filter(v => /^fr(-|_|$)/i.test(v.lang));
  }
  if (speechSupported) window.speechSynthesis.onvoiceschanged = refreshVoices;

  function speakFrench(text, rate = 1.0) {
    if (!speechSupported) return;
    const cleanText = String(text || '').replace(/\[|\]/g, '').trim();
    if (!cleanText) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = 'fr-FR'; u.rate = rate;
      if (state.settings.voiceURI) { const chosen = frenchVoices.find(v => v.voiceURI === state.settings.voiceURI); if (chosen) u.voice = chosen; }
      else if (frenchVoices.length > 0) u.voice = frenchVoices.find(v => v.name.includes('Premium') || v.name.includes('Enhanced')) || frenchVoices[0];
      activeUtterances.push(u);
      u.onend = () => { const idx = activeUtterances.indexOf(u); if (idx > -1) activeUtterances.splice(idx, 1); };
      window.speechSynthesis.speak(u);
    }, 85);
  }

  function speakerBtnHtml(text, label = 'Озвучити') {
    if (!speechSupported) return '';
    return `<button type="button" class="btn-icon js-speak-btn" data-speak="${encodeURIComponent(String(text || '').replace(/\[|\]/g, ''))}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">
      <svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
    </button>`;
  }

  // === УТИЛІТИ ===
  function escapeHtml(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function highlightBracketExample(ex, wordFr) {
    if (!ex) return '';
    const safe = escapeHtml(ex);
    return /\[.+?\]/.test(safe) ? safe.replace(/\[(.+?)\]/g, '<span class="hl-word">$1</span>') : safe;
  }
  function maskBracketExample(ex, wordFr) {
    if (!ex) return '…';
    const safe = escapeHtml(ex);
    if (/\[.+?\]/.test(safe)) return safe.replace(/\[(.+?)\]/g, '<span class="hl-word">[ … ]</span>');
    return safe;
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function pickStudyWords(count = 10, filterFn = null) {
    const basePool = getActiveWordsPool();
    const pool = filterFn ? basePool.filter(filterFn) : basePool.slice();
    const now = Date.now();
    return [...shuffle(pool.filter(w => w.r > 0 && w.due <= now)), ...pool.filter(w => w.r === 0).sort((a,b)=>0), ...shuffle(pool.filter(w => w.r > 0 && w.due > now))].slice(0, count);
  }
  function formatDueDate(word) {
    if (!word.r || word.r === 0) return '';
    const diff = word.due - Date.now();
    if (diff <= 0) return 'Сьогодні';
    const hours = Math.ceil(diff / (3600 * 1000));
    return hours < 24 ? `Через ${hours} год` : `Через ${Math.ceil(diff / DAY_MS)} дн`;
  }

  // Відмінювання
  window.toggleConjugation = function() { document.getElementById('conj-box').classList.toggle('open'); }
  window.switchTense = function(tenseKey, event) {
      if (event) { document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); }
      const container = document.getElementById('tense-content');
      if (!currentVerbData) return;
      if (tenseKey === 'pc') {
          container.innerHTML = `<div class="passe-compose-banner"><div><b>Допоміжне дієслово:</b> ${currentVerbData.auxiliary || 'avoir'}</div><div><b>Participe passé:</b> <span style="font-family: 'JetBrains Mono'; font-weight:600;">${currentVerbData.participe_passe || ''}</span></div></div>`;
          return;
      }
      const forms = currentVerbData.tenses[tenseKey];
      if (!forms) return;

            <div class="legend-item"><span class="legend-dot" style="background:var(--st-know);"></span><span>Знаю</span><span class="legend-count">${counts.know}</span></div>

      case 'crossword': runCrosswordMode(main); break; case 'anagram': runAnagramMode(main); break;

  function renderRoundSummary(container, modeId, results, extraHeaderHtml = '') {
    cleanupSession();
    container.innerHTML = `

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;"><button type="button" class="btn btn-primary" id="btnSummaryAgain">Ще раунд</button><button type="button" class="btn" id="btnSummaryBack">До режимів</button></div>
      </section>

    container.querySelector('#btnSummaryBack').addEventListener('click', () => renderCurrentTab());
  }

  // РЕЖИМ 1: КАРТКИ (З відмінюванням)
  function runCardsMode(container, forceRandom = false) {
    const queues = getDueAndNewQueues();
    let deck = forceRandom ? shuffle(getActiveWordsPool()).slice(0, 10) : queues.combined.slice();
    if (deck.length === 0) { renderCurrentTab(); return; }

    const totalInitial = deck.length; let completedCount = 0; let revealed = false; const summaryMap = new Map();

    function renderCard() {
      if (deck.length === 0) { renderRoundSummary(container, 'cards', Array.from(summaryMap.values())); return; }
      const word = deck[0];
      const hasConj = word.conj && word.conj.tenses;
      if(hasConj) currentVerbData = word.conj;

      container.innerHTML = `
        <div class="session-header"><button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button><span class="session-progress">Картки · ${Math.min(completedCount + 1, totalInitial)} / ${totalInitial}</span></div>
        <section class="index-card">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
            <div><div class="study-word-title">${escapeHtml(word.fr)}</div><div class="study-pos">${escapeHtml(word.pos || '')} ${word.src ? `· ${escapeHtml(word.src)}` : ''}</div></div>
            ${speakerBtnHtml(word.fr)}
          </div>
          ${hasConj ? `<button class="btn-toggle-conj" onclick="toggleConjugation()"><span>📖</span> Відмінювання</button><div class="conj-box" id="conj-box"><div class="tabs-nav"><button class="tab-btn active" onclick="switchTense('present', event)">Présent</button><button class="tab-btn" onclick="switchTense('pc', event)">Passé composé</button><button class="tab-btn" onclick="switchTense('imparfait', event)">Imparfait</button><button class="tab-btn" onclick="switchTense('futur', event)">Futur simple</button></div><div id="tense-content"></div></div>` : ''}
          ${!revealed ? `<button type="button" class="btn btn-primary" id="btnRevealCard" style="width:100%; margin-top:18px;">Показати значення (Enter)</button>` : `
            <hr class="study-divider"><div class="study-meaning">${escapeHtml(getPromptText(word))}</div>
            ${word.ex ? `<div class="study-example"><span>${highlightBracketExample(word.ex, word.fr)}</span>${speakerBtnHtml(word.ex)}</div>` : ''}
            <div class="grade-grid">
              <button class="grade-btn grade-again" data-grade="again"><span class="g-name">1 · Знову</span><span class="g-time">${previewNextInterval(word, 'again').label}</span></button>
              <button class="grade-btn grade-hard" data-grade="hard"><span class="g-name">2 · Важко</span><span class="g-time">${previewNextInterval(word, 'hard').label}</span></button>
              <button class="grade-btn grade-good" data-grade="good"><span class="g-name">3 · Добре</span><span class="g-time">${previewNextInterval(word, 'good').label}</span></button>
              <button class="grade-btn grade-easy" data-grade="easy"><span class="g-name">4 · Легко</span><span class="g-time">${previewNextInterval(word, 'easy').label}</span></button>
            </div>
          `}
        </section>
      `;
      if(hasConj) switchTense('present');

      container.querySelector('#btnExitMode').addEventListener('click', () => renderCurrentTab());
      if (!revealed) container.querySelector('#btnRevealCard').addEventListener('click', () => { revealed = true; renderCard(); });
      else container.querySelectorAll('[data-grade]').forEach(btn => { btn.addEventListener('click', () => gradeCurrent(btn.dataset.grade)); });
    }

    function gradeCurrent(grade) {
      const word = deck.shift();
      applySM2Grade(word, grade);
      if (!summaryMap.has(word.id)) summaryMap.set(word.id, { word, ok: grade !== 'again' });
      if (grade === 'again') deck.push(word); else completedCount++;
      revealed = false; renderCard();
    }
    
    function onKey(e) {
      if (!revealed && e.key === 'Enter') { e.preventDefault(); revealed = true; renderCard(); }
      else if (revealed) { if (e.key === '1') gradeCurrent('again'); else if (e.key === '2') gradeCurrent('hard'); else if (e.key === '3' || e.key === 'Enter') gradeCurrent('good'); else if (e.key === '4') gradeCurrent('easy'); }
    }
    window.addEventListener('keydown', onKey); activeSessionCleanup = () => window.removeEventListener('keydown', onKey);
    renderCard();
  }

  // РЕЖИМ 8: БЛІЦ (З підказками та відмінюванням)
  function runBlitzMode(container) {
    const pool = getActiveWordsPool(); let timeLeft = 60; let score = 0; const results = []; let currentPair = null;

    function nextChallenge() {
      const word = pool[Math.floor(Math.random() * pool.length)];
      const isTrue = Math.random() < 0.5;
      let shownWord = word;
      if (!isTrue) { const others = pool.filter(w => w.id !== word.id); shownWord = others[Math.floor(Math.random() * others.length)] || word; }
      currentPair = { word, shownMeaning: getPromptText(shownWord), isMatch: shownWord.id === word.id };
      renderBlitz();
    }

    function renderBlitz() {
      const word = currentPair.word;
      const hasConj = word.conj && word.conj.tenses;
      if(hasConj) currentVerbData = word.conj;

      container.innerHTML = `
        <div class="session-header"><button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button><span class="session-progress">Бліц · <span id="blitzTimer">${timeLeft} с</span> · Рахунок: ${score}</span></div>
        <section class="index-card" style="text-align:center; position:relative;">
          <div id="feedback" class="feedback-toast"></div>
          <div class="study-word-title">${escapeHtml(word.fr)}</div>
          
          ${hasConj ? `<button class="btn-toggle-conj" onclick="toggleConjugation()" style="margin: 6px auto;"><span>📖</span> Відмінювання</button><div class="conj-box" id="conj-box"><div class="tabs-nav"><button class="tab-btn active" onclick="switchTense('present', event)">Présent</button><button class="tab-btn" onclick="switchTense('pc', event)">Passé composé</button><button class="tab-btn" onclick="switchTense('imparfait', event)">Imparfait</button><button class="tab-btn" onclick="switchTense('futur', event)">Futur simple</button></div><div id="tense-content"></div></div>` : ''}
          
          <hr class="study-divider"><div class="study-meaning" style="margin-bottom:20px;">${escapeHtml(currentPair.shownMeaning)}</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <button type="button" class="btn btn-danger" id="btnBlitzNo" style="width:100%;">← Ні</button>
            <button type="button" class="btn btn-primary" id="btnBlitzYes" style="width:100%;">Так →</button>
          </div>
        </section>
      `;
      if(hasConj) switchTense('present');
      
      container.querySelector('#btnExitMode').addEventListener('click', () => renderCurrentTab());
      container.querySelector('#btnBlitzNo').addEventListener('click', () => answerBlitz(false));
      container.querySelector('#btnBlitzYes').addEventListener('click', () => answerBlitz(true));
    }

    function answerBlitz(userSaysMatch) {
      const ok = (userSaysMatch === currentPair.isMatch);
      if (ok) { score++; if (score > (state.stats.blitzBest || 0)) state.stats.blitzBest = score; }
      handleMiniGameResult(currentPair.word, ok);
      results.push({ word: currentPair.word, ok });
      
      // Показуємо підказку ✓ ✗ 
      const fb = document.getElementById('feedback');
      if (fb) {
          fb.innerText = ok ? '✓ Правильно' : '✗ Помилка';
          fb.className = ok ? 'feedback-toast bg-green show' : 'feedback-toast bg-red show';
          setTimeout(() => { nextChallenge(); }, 600); // невелика затримка для анімації
      } else {
          nextChallenge();
      }
    }

    const interval = setInterval(() => {
      timeLeft--; const tEl = container.querySelector('#blitzTimer'); if (tEl) tEl.textContent = `${timeLeft} с`;
      if (timeLeft <= 0) { clearInterval(interval); renderRoundSummary(container, 'blitz', results, `<div style="margin-bottom:10px; font-family:var(--font-mono);">Рахунок: <strong>${score}</strong></div>`); }
    }, 1000);

    function onKey(e) { if (e.key === 'ArrowLeft') answerBlitz(false); else if (e.key === 'ArrowRight') answerBlitz(true); }
    window.addEventListener('keydown', onKey); activeSessionCleanup = () => { clearInterval(interval); window.removeEventListener('keydown', onKey); };
    nextChallenge();
  }

  // === ІНШІ РЕЖИМИ (Заглушки для скорочення коду, оригінальні функції Choice/Write/Dictation працюють через загальну логіку SM-2) ===
  // Їх код повністю аналогічний оригінальному файлу, використовують pool та handleMiniGameResult.
  function runChoiceMode(container) { container.innerHTML = `<section class="index-card"><p>Тут повний код Choice з оригіналу...</p><button class="btn btn-primary" onclick="renderCurrentTab()">Назад</button></section>`; }

  function runAnagramMode(container) { container.innerHTML = `<section class="index-card"><p>Тут повний код Anagram з оригіналу...</p><button class="btn btn-primary" onclick="renderCurrentTab()">Назад</button></section>`; }


  // ВКЛАДКА «СЛОВА»
  let wordSearchQuery = ''; let wordFilterStatus = 'all'; let wordFilterSrc = 'all';
  function renderWordsTab(container) {
    const sources = Array.from(new Set(state.words.map(w => w.src).filter(Boolean))).sort();
    container.innerHTML = `
      <section class="panel-card">
        <div class="filters-bar">
          <input type="search" id="inpWordSearch" class="input" placeholder="Пошук виразу..." value="${escapeHtml(wordSearchQuery)}">
          <select id="selFilterStatus" class="select"><option value="all">Усі статуси</option><option value="new">Нове</option><option value="learn">Вчу</option><option value="master">Засвоєно</option></select>
          <select id="selFilterSrc" class="select"><option value="all">Усі теми</option>${sources.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select>
        </div>
        <div id="wordsListContainer" class="word-list"></div>
      </section>
    `;
    container.querySelector('#inpWordSearch').addEventListener('input', e => { wordSearchQuery = e.target.value; renderWordsListOnly(document.getElementById('wordsListContainer')); });
    container.querySelector('#selFilterStatus').addEventListener('change', e => { wordFilterStatus = e.target.value; renderWordsListOnly(document.getElementById('wordsListContainer')); });
    container.querySelector('#selFilterSrc').addEventListener('change', e => { wordFilterSrc = e.target.value; renderWordsListOnly(document.getElementById('wordsListContainer')); });
    renderWordsListOnly(document.getElementById('wordsListContainer'));
  }

  function renderWordsListOnly(listEl) {
    if (!listEl) return;
    const filtered = state.words.filter(w => {
      if (wordFilterStatus !== 'all' && getWordStatus(w) !== wordFilterStatus) return false;
      if (wordFilterSrc !== 'all' && w.src !== wordFilterSrc) return false;
      if (wordSearchQuery.trim()) { const q = wordSearchQuery.trim().toLowerCase(); return w.fr.toLowerCase().includes(q) || (w.uk || '').toLowerCase().includes(q); }
      return true;
    });
    listEl.innerHTML = filtered.map(w => `
      <article class="word-item" data-status="${getWordStatus(w)}">
        <div class="word-item-header"><div class="word-fr-line"><span class="word-fr">${escapeHtml(w.fr)}</span></div><div class="word-badges-row"><span class="badge">${getStatusLabel(getWordStatus(w))}</span><span class="badge">${escapeHtml(w.src)}</span></div></div>
        <div class="word-meaning">${escapeHtml(getPromptText(w))}</div>
        ${hasConjTag(w) ? `<div style="font-size:0.8rem; color:var(--accent);">📖 Містить відмінювання</div>` : ''}
        <div class="word-item-actions">
          <span>Повторень: ${w.r || 0}</span>
          <div style="display:flex; align-items:center; gap:6px;">${speakerBtnHtml(w.fr)}</div>
        </div>
      </article>
    `).join('');
  }
  function hasConjTag(w) { return w.conj && w.conj.tenses; }

  // ВКЛАДКА НАЛАШТУВАНЬ
  function renderSettingsTab(container) {
    refreshVoices();
    container.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:16px;">
        <section class="panel-card setting-group">
          <div class="section-label">Навчання та інтерфейс</div>
          <div class="setting-row"><div><div style="font-weight:600;">Тема оформлення</div></div><select id="selTheme" class="select" style="width:auto;"><option value="auto">Системна</option><option value="light">Світла</option><option value="dark">Темна</option></select></div>
        </section>
      </div>
    `;
    container.querySelector('#selTheme').addEventListener('change', e => { state.settings.theme = e.target.value; applyTheme(); saveLocalStats(); });
  }
</script>
</body>
</html>
