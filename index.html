<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boîte à Mots — Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-page:#f6f4ee;--bg-card:#fdfcf9;--bg-elevated:#ede9df;--bg-input:#ffffff;--text-main:#1f242e;--text-muted:#5c6473;--text-faint:#8a92a0;--accent:#1e3a5f;--accent-hover:#152943;--accent-soft:#e5edf5;--border:#dcd7ca;--border-subtle:#eae5d8;--card-top-line:#9b2c2c;--card-seyes-main:rgba(43,90,140,0.045);--card-margin-line:rgba(180,60,60,0.16);--danger:#9b2c2c;--danger-soft:#fbf0f0;--warning:#a36116;--warning-soft:#fbf3e6;--success:#286343;--success-soft:#edf6f0;--st-new:#6b778d;--st-learn:#a36116;--st-know:#2c5282;--st-master:#286343;--shadow:0 3px 10px rgba(35,30,20,0.05),0 1px 3px rgba(35,30,20,0.04);--radius:6px;--font-ui:'Golos Text',sans-serif;--font-fr:'Literata',serif;--font-mono:'JetBrains Mono',monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg-page:#15171c;--bg-card:#1c1f26;--bg-elevated:#262a34;--bg-input:#171920;--text-main:#f0eee6;--text-muted:#9fa6b2;--text-faint:#6c7380;--accent:#7ca5d8;--accent-hover:#a3c4ed;--accent-soft:#1e2838;--border:#353a47;--border-subtle:#292d37;--card-top-line:#c94a4a;--card-seyes-main:rgba(255,255,255,0.025);--card-margin-line:rgba(230,90,90,0.22);--danger:#f87171;--danger-soft:#381a1a;--warning:#fbbf24;--warning-soft:#3a280c;--success:#4ade80;--success-soft:#123320}}
:root[data-theme="dark"]{--bg-page:#15171c;--bg-card:#1c1f26;--bg-elevated:#262a34;--bg-input:#171920;--text-main:#f0eee6;--text-muted:#9fa6b2;--accent:#7ca5d8;--accent-hover:#a3c4ed;--accent-soft:#1e2838;--border:#353a47;--border-subtle:#292d37;--card-top-line:#c94a4a;--card-seyes-main:rgba(255,255,255,0.025);--card-margin-line:rgba(230,90,90,0.22);--danger:#f87171;--danger-soft:#381a1a;--warning:#fbbf24;--warning-soft:#3a280c;--success:#4ade80;--success-soft:#123320}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0} html,body{width:100%;min-height:100vh;background:var(--bg-page);color:var(--text-main);font-family:var(--font-ui);font-size:16px;line-height:1.5} button,input,select,textarea{font:inherit;color:inherit} :focus-visible{outline:2px solid var(--accent)}
.auth-wrapper{display:flex;justify-content:center;align-items:center;min-height:80vh;padding:20px} .auth-container{width:100%;max-width:440px;background:var(--bg-card);padding:32px 28px;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);border-top:4px solid var(--accent)} .auth-logo{font-family:var(--font-fr);font-size:30px;font-weight:700;text-align:center;margin-bottom:8px} .teacher-textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);font-family:var(--font-mono);font-size:13px;resize:vertical;margin-bottom:16px}
.app-shell{max-width:760px;margin:0 auto;padding:16px 16px 54px;display:none;flex-direction:column;gap:16px} .app-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border)} .brand{display:flex;align-items:baseline;gap:8px} .brand-title{font-family:var(--font-fr);font-size:1.45rem;font-weight:700} .brand-sub{font-size:0.75rem;font-family:var(--font-mono);color:var(--text-muted)} .header-controls{display:flex;align-items:center;gap:8px}
.nav-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg-elevated);padding:4px;border-radius:var(--radius);border:1px solid var(--border)} .nav-tab{min-height:44px;border:none;background:transparent;border-radius:calc(var(--radius) - 2px);font-weight:600;font-size:0.9375rem;color:var(--text-muted);cursor:pointer} .nav-tab.active{background:var(--bg-card);color:var(--text-main);box-shadow:var(--shadow)}
.index-card{background-color:var(--bg-card);background-image:linear-gradient(90deg,transparent 42px,var(--card-margin-line) 42px,var(--card-margin-line) 43px,transparent 43px),repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--card-seyes-main) 31px,var(--card-seyes-main) 32px);border:1px solid var(--border);border-top:3px solid var(--card-top-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 22px 52px;position:relative} @media(max-width:480px){.index-card{padding:18px 16px 18px 20px;background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--card-seyes-main) 31px,var(--card-seyes-main) 32px)}} .panel-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.btn{min-height:44px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:0.15s} .btn:hover:not(:disabled){background:var(--bg-elevated)} .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600} .btn-primary:hover:not(:disabled){background:var(--accent-hover)} .btn-danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)} .btn-sm{min-height:38px;padding:4px 10px;font-size:0.8125rem} .btn-icon{min-width:42px;min-height:42px;padding:8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center} .btn-icon:hover{background:var(--bg-elevated);color:var(--accent)} svg.icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round} .input,.select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);margin-bottom:12px}
.hero-grid{display:flex;flex-direction:column;gap:16px} .hero-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px} .due-counter{display:flex;flex-direction:column} .due-label{font-size:0.8125rem;text-transform:uppercase;color:var(--text-muted);font-weight:600} .due-number{font-family:var(--font-mono);font-size:2.6rem;font-weight:700;line-height:1.1;color:var(--accent)} .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--border-subtle)} .stat-item{display:flex;flex-direction:column} .stat-val{font-family:var(--font-mono);font-size:1.15rem;font-weight:600} .stat-lbl{font-size:0.75rem;color:var(--text-muted)} .section-label{font-size:0.8125rem;font-weight:600;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px} .segment-bar{height:12px;width:100%;background:var(--bg-elevated);border-radius:6px;display:flex;margin-bottom:10px;overflow:hidden} .seg-part{height:100%} .modes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px} .mode-tile{text-align:left;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;min-height:76px} .mode-tile:hover{border-color:var(--accent)} .mode-icon-box{width:40px;height:40px;border-radius:var(--radius);background:var(--bg-elevated);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0} .mode-title{font-weight:600;font-size:0.95rem;margin-bottom:2px} .mode-desc{font-size:0.8125rem;color:var(--text-muted);line-height:1.35}
.session-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px} .session-progress{font-family:var(--font-mono);font-size:0.9rem;font-weight:600;color:var(--text-muted)} .study-word-title{font-family:var(--font-fr);font-size:1.95rem;font-weight:700;margin-bottom:4px} .study-pos{font-family:var(--font-fr);font-size:0.88rem;color:var(--text-muted);font-style:italic;margin-bottom:16px} .study-divider{border:none;border-top:1px dashed var(--border);margin:16px 0} .study-meaning{font-size:1.25rem;font-weight:600;color:var(--accent);margin-bottom:8px} .study-example{font-family:var(--font-fr);font-size:1.05rem;padding:12px 14px;background:var(--bg-elevated);border-left:3px solid var(--card-top-line);border-radius:4px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center} .hl-word{color:var(--card-top-line);font-weight:700;text-decoration:underline} .grade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:16px} .grade-btn{min-height:54px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center} .grade-btn:hover{background:var(--bg-elevated)} .grade-again{border-bottom:3px solid var(--danger)} .grade-hard{border-bottom:3px solid var(--warning)} .grade-good{border-bottom:3px solid var(--accent)} .grade-easy{border-bottom:3px solid var(--success)}
.btn-toggle-conj{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin:10px 0 16px;font-weight:500} .btn-toggle-conj:hover{background:var(--accent);color:#fff} .conj-box{display:none;background:var(--bg-elevated);border-radius:10px;padding:16px;margin-bottom:20px;border:1px solid var(--border)} .conj-box.open{display:block} .tabs-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px} .tab-btn{background:transparent;border:1px solid var(--border);padding:6px 12px;font-size:13px;border-radius:6px;cursor:pointer} .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)} .forms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;background:var(--bg-card);border-radius:8px;padding:14px;border:1px solid var(--border)} .form-row-c{font-family:var(--font-mono);font-size:14px;display:flex;align-items:baseline} .pronoun{color:var(--text-muted);margin-right:6px;font-family:var(--font-ui);font-size:13px} .passe-compose-banner{background:var(--bg-card);padding:12px;border-radius:8px;font-size:14px;border:1px solid var(--border)}
.feedback-toast{position:absolute;top:12px;right:16px;padding:6px 12px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;transition:all 0.3s ease;pointer-events:none} .feedback-toast.show{opacity:1;transform:translateY(0)} .bg-green{background:var(--success-soft);color:var(--success);border:1px solid var(--success)} .bg-red{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.options-grid{display:flex;flex-direction:column;gap:8px;margin-top:14px} .option-btn{min-height:48px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px} .option-key{font-family:var(--font-mono);font-size:0.75rem;width:24px;height:24px;border-radius:4px;background:var(--bg-elevated);display:inline-flex;align-items:center;justify-content:center} .option-btn.correct{border-color:var(--success);background:var(--success-soft)} .option-btn.wrong{border-color:var(--danger);background:var(--danger-soft)}
.template-mask{font-family:var(--font-mono);font-size:1.35rem;letter-spacing:0.08em;color:var(--accent);margin:14px 0;display:flex;flex-wrap:wrap;gap:12px 24px} .template-word{display:inline-flex;gap:5px} .feedback-box{margin-top:12px;padding:12px;border-radius:var(--radius);font-size:0.9375rem} .feedback-box.ok{background:var(--success-soft);color:var(--success);border:1px solid var(--success)} .feedback-box.err{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)} .feedback-box.almost{background:var(--warning-soft);color:var(--warning);border:1px solid var(--warning)}
.pairs-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px} .pair-card{min-height:52px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;text-align:center} .pair-card.selected{border-color:var(--accent);background:var(--accent-soft)} .pair-card.matched{opacity:0.35;pointer-events:none;border-color:var(--success)}
.anagram-slots,.anagram-pool{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;min-height:48px} .letter-tile{min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-family:var(--font-mono);font-size:1.1rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center} .letter-tile.used{opacity:0.3;pointer-events:none}
.cw-grid{display:grid;gap:2px;background:var(--border);padding:3px;border-radius:6px;overflow-x:auto} .cw-cell{width:clamp(26px,7.2vw,38px);height:clamp(26px,7.2vw,38px);position:relative;background:var(--bg-elevated)} .cw-cell.empty{background:transparent} .cw-cell input{width:100%;height:100%;border:1px solid var(--border);background:var(--bg-card);text-align:center;font-family:var(--font-mono);font-size:0.95rem;font-weight:600;text-transform:lowercase;border-radius:2px;padding:0} .cw-cell input.cw-ok{background:var(--success-soft);color:var(--success)} .cw-cell input.cw-err{background:var(--danger-soft);color:var(--danger)} .cw-num{position:absolute;top:1px;left:2px;font-size:9px;font-family:var(--font-mono);color:var(--text-muted);pointer-events:none} .cw-clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:0.875rem;margin-top:16px}
.word-list{display:flex;flex-direction:column;gap:10px} .word-item{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--st-new);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px} .word-item[data-status="learn"]{border-left-color:var(--st-learn)} .word-item[data-status="know"]{border-left-color:var(--st-know)} .word-item[data-status="master"]{border-left-color:var(--st-master)} .word-fr{font-family:var(--font-fr);font-size:1.25rem;font-weight:700} .word-meaning{font-size:0.98rem;color:var(--accent);font-weight:600} .word-item-actions{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px dashed var(--border-subtle);font-size:0.78rem;color:var(--text-muted)}
.summary-list{display:flex;flex-direction:column;gap:6px;margin:14px 0;max-height:300px;overflow-y:auto} .summary-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg-elevated);border-radius:4px;font-size:0.9rem} .mark-ok{color:var(--success);font-family:var(--font-mono);font-weight:700} .mark-err{color:var(--danger);font-family:var(--font-mono);font-weight:700}
</style>
</head>
<body>

<!-- Екран авторизації (Прихований за замовчуванням, щоб не блимав) -->
<div id="auth-screen" class="auth-wrapper" style="display:none;">
  <div class="auth-container">
    <div class="auth-logo">Boîte à Mots</div>
    <p style="text-align:center; color:var(--text-muted); margin-bottom:20px;">Вхід до картотеки</p>
    <input type="email" id="email-input" class="input" placeholder="Email">
    <input type="password" id="password-input" class="input" placeholder="Пароль">
    <button type="button" onclick="signInWithPassword()" id="login-btn" class="btn btn-primary" style="width:100%;">Увійти</button>
    <p id="auth-err" style="text-align:center; color:var(--danger); font-size:14px; display:none; margin-top:14px;"></p>
  </div>
</div>

<div id="teacher-screen" class="auth-wrapper" style="display:none;">
  <div class="auth-container" style="max-width:600px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><h2 style="font-family:var(--font-fr);">Панель викладача 👨‍🏫</h2><button class="btn btn-sm" onclick="signOut()">Вийти</button></div>
    <input type="email" id="target-student-email" class="input" placeholder="Email учня">
    <textarea id="json-code" class="teacher-textarea" placeholder="JSON код..."></textarea>
    <button onclick="addWordsToStudent()" class="btn btn-primary" style="width:100%;">Відправити слова</button>
  </div>
</div>

<div id="app-screen" class="app-shell">
  <header class="app-header">
    <div class="brand"><h1 class="brand-title">Boîte à Mots</h1><span class="brand-sub">Cloud</span></div>
    <div class="header-controls">
      <div class="lang-switch"><button type="button" id="btnModeUkFr" class="active">UK + FR</button><button type="button" id="btnModeFrFr">FR + FR</button></div>
      <button class="btn btn-sm" style="margin-left:8px;" onclick="signOut()">Вийти</button>
    </div>
  </header>
  <nav class="nav-tabs">
    <button type="button" class="nav-tab active" data-tab="study">Вчити</button>
    <button type="button" class="nav-tab" data-tab="words">Слова <span id="navWordCount" style="font-size:11px;background:var(--bg-elevated);padding:2px 6px;border-radius:4px;margin-left:4px;">0</span></button>
    <button type="button" class="nav-tab" data-tab="settings">Налаштування</button>
  </nav>
  <main id="mainView"></main>
</div>
<div id="toastContainer" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;"></div>

<script>
  const SUPABASE_URL = 'https://oxcpvcbvxmiszseckdcd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DAiE12czwiINHefrIYMyrg_brCfYWs-';
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ADMIN_EMAIL = 'nikita.francais@gmail.com';
  
  let currentUser = null; let currentVerbData = null;
  const STORAGE_KEY = 'bam_app_data_cloud_v1';
  const defaultState = () => ({ words: [], settings: { langMode: 'UK_FR', newLimit: 10, voiceURI: '', theme: 'auto', focusTopic: 'all' }, stats: { streak: 0, dailyDate: todayStr(), answersToday: 0, newLearnedToday: 0, blitzBest: 0 } });
  let state = defaultState();

  async function checkSession() {
      try {
          const { data: { session }, error } = await sbClient.auth.getSession();
          if (session) {
              currentUser = session.user;
              if (currentUser.email === ADMIN_EMAIL) {
                  document.getElementById('teacher-screen').style.display = 'flex';
              } else {
                  document.getElementById('app-screen').style.display = 'flex';
                  loadLocalStats(); loadStudentWords();
              }
          } else {
              document.getElementById('auth-screen').style.display = 'flex';
          }
      } catch (err) { console.error(err); document.getElementById('auth-screen').style.display = 'flex'; }
  }

  async function signInWithPassword() {
      const email = document.getElementById('email-input').value.trim(); const password = document.getElementById('password-input').value;
      const errEl = document.getElementById('auth-err');
      if (!email || !password) { errEl.innerText = 'Введіть email та пароль'; errEl.style.display = 'block'; return; }
      const btn = document.getElementById('login-btn'); btn.innerText = 'Вхід...'; btn.disabled = true; errEl.style.display = 'none';
      const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
      if (error) { errEl.innerText = 'Помилка входу: перевірте пошту або пароль'; errEl.style.display = 'block'; btn.innerText = 'Увійти'; btn.disabled = false; } 
      else { window.location.reload(); }
  }

  async function signOut() { await sbClient.auth.signOut(); window.location.reload(); }
  sbClient.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_IN') { document.getElementById('auth-screen').style.display = 'none'; checkSession(); } });
  checkSession();

  async function addWordsToStudent() {
      const email = document.getElementById('target-student-email').value.trim(); const code = document.getElementById('json-code').value.trim();
      if (!email || !code) return alert('Заповніть пошту та вставте код');
      try {
          const wordsArray = JSON.parse(code);
          const recordsToInsert = wordsArray.map(w => ({ user_email: email, fr: w.fr, uk: w.uk, def: w.def || '', ex: w.ex || '', syn: w.syn || [], conj: w.conj || null, pos: w.pos || '', src: w.src || 'Загальний', status: 'new', iv: 0, ef: 2.5, r: 0, l: 0, due: 0, t: 0 }));
          const { error } = await sbClient.from('cards').insert(recordsToInsert);
          if (error) throw error; alert(`✅ Успішно додано ${recordsToInsert.length} слів учню ${email}!`); document.getElementById('json-code').value = '';
      } catch (err) { alert('Помилка: ' + err.message); }
  }

  async function loadStudentWords() {
      const { data, error } = await sbClient.from('cards').select('*').eq('user_email', currentUser.email);
      if (!error && data) {
          state.words = data.map(row => ({ dbId: row.id, id: makeWordId(row.fr), fr: row.fr, uk: row.uk, def: row.def, ex: row.ex, syn: row.syn, conj: row.conj, pos: row.pos, src: row.src, iv: Number(row.iv)||0, ef: Number(row.ef)||2.5, r: Number(row.r)||0, l: Number(row.l)||0, due: Number(row.due)||0, t: Number(row.t)||0 }));
          updateNavBadge(); renderCurrentTab();
      }
  }

  async function syncWordProgress(word) {
      if(!word.dbId) return;

  function todayStr(ts = Date.now()) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

  function stripFrenchArticles(frText) { let s=String(frText||'').trim().toLowerCase().replace(/[’‘]/g,"'"); const prefixes=['un ','une ','le ','la ','les ',"l'","d'",'se ',"s'"]; let changed=true; while(changed){changed=false; for(const p of prefixes){if(s.startsWith(p)){s=s.slice(p.length).trim();changed=true;break;}}} return makeWordId(s); }

  const DAY_MS = 86400000; const MIN_MS = 60000;

  function previewNextInterval(word, grade) {

  function applySM2Grade(word, grade) {

  function pickStudyWords(count=10, filterFn=null){ const pool = filterFn ? getActiveWordsPool().filter(filterFn) : getActiveWordsPool().slice(); const now = Date.now(); return [...shuffle(pool.filter(w=>w.r>0 && w.due<=now)), ...pool.filter(w=>w.r===0), ...shuffle(pool.filter(w=>w.r>0 && w.due>now))].slice(0,count); }

  /* --- 3. ВИБІР --- */

      container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="btnEx">← Назад</button><span class="session-progress">Вибір · ${idx+1} / ${qs.length}</span></div>
      <section class="index-card"><div style="display:flex;justify-content:space-between;"><div><div class="${rev?'study-meaning':'study-word-title'}">${escapeHtml(rev?getPromptText(w):w.fr)}</div></div>${!rev?speakerBtnHtml(w.fr):''}</div>
      <div class="options-grid">${opts.map((o,i)=>{ let cls=''; if(ansd){if(o.id===w.id)cls='correct';else if(o.id===chId)cls='wrong';} return `<button class="option-btn ${cls}" data-opt="${o.id}" ${ansd?'disabled':''}><span class="option-key">${i+1}</span><span style="${rev?'font-family:var(--font-fr);font-weight:600;':''}">${escapeHtml(rev?o.fr:getPromptText(o))}</span></button>`;}).join('')}</div>
      ${ansd?`<div style="margin-top:14px;display:flex;justify-content:space-between;">${speakerBtnHtml(w.fr)}<button class="btn btn-primary" id="bNx">Далі</button></div>`:''}</section>`;
      container.querySelector('#btnEx').addEventListener('click',renderCurrentTab); container.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.opt))); if(ansd)container.querySelector('#bNx').addEventListener('click',next);
    }
    function choose(id){if(ansd)return; ansd=true; const w=qs[idx]; const ok=(id===w.id); handleMiniGameResult(w,ok); res.push({word:w,ok}); render(w,id);}
    function next(){idx++; if(idx>=qs.length)renderRoundSummary(container,'choice',res); else setup();}
    function onK(e){if(!ansd&&['1','2','3','4'].includes(e.key)){const o=opts[Number(e.key)-1]; if(o)choose(o.id);} else if(ansd&&e.key==='Enter')next();}
    window.addEventListener('keydown',onK); activeSessionCleanup=()=>window.removeEventListener('keydown',onK); setup();
  }

  /* --- 4. НАПИШИ --- */
  function evalWrite(i,t){const a=stripDiacritics(i.trim().toLowerCase()); const b=stripDiacritics(t.trim().toLowerCase()); if(a===b)return 'ok'; if(a.length>=3&&a.slice(0,3)===b.slice(0,3))return 'almost'; return 'err';}
  function runWriteMode(container){
    const qs=pickStudyWords(10); let idx=0; let chk=null; let last=''; const res=[];
    function render(){
      const w=qs[idx];
      container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="bEx">← Назад</button><span class="session-progress">Напиши · ${idx+1} / ${qs.length}</span></div>
      <section class="index-card"><div class="study-meaning">${escapeHtml(getPromptText(w))}</div><div class="template-mask">${Array.from(w.fr).map(c=>(c===' '||c==='-')?c:'_').join(' ')}</div>
      <input type="text" id="inpW" class="input" value="${escapeHtml(last)}" autocomplete="off" spellcheck="false" ${chk?'disabled':''}>
      ${!chk?`<button class="btn btn-primary" id="bCh">Перевірити (Enter)</button>`:`<div class="feedback-box ${chk}"><div style="display:flex;justify-content:space-between;"><div><div style="font-family:var(--font-fr);font-weight:700;font-size:1.2rem;">${escapeHtml(w.fr)}</div></div>${speakerBtnHtml(w.fr)}</div></div><button class="btn btn-primary" id="bNx" style="margin-top:12px;float:right;">Далі</button>`}</section>`;
      container.querySelector('#bEx').addEventListener('click',renderCurrentTab); const inp=container.querySelector('#inpW'); if(inp&&!chk){inp.focus(); inp.addEventListener('keydown',e=>{if(e.key==='Enter')check(inp.value);});}
      if(!chk)container.querySelector('#bCh').addEventListener('click',()=>check(inp.value)); else container.querySelector('#bNx').addEventListener('click',next);
    }
    function check(v){if(chk)return; last=v; const w=qs[idx]; chk=evalWrite(v,w.fr); const ok=(chk==='ok'||chk==='almost'); handleMiniGameResult(w,ok); res.push({word:w,ok}); render();}
    function next(){idx++; chk=null; last=''; if(idx>=qs.length)renderRoundSummary(container,'write',res); else render();}
    function onK(e){if(chk&&e.key==='Enter')next();} window.addEventListener('keydown',onK); activeSessionCleanup=()=>window.removeEventListener('keydown',onK); render();
  }

  /* --- 5. ДИКТАНТ --- */
  function runDictationMode(container){
    const qs=pickStudyWords(10); let idx=0; let chk=null; let last=''; const res=[];
    function render(play=false){
      const w=qs[idx]; if(play)speakFrench(w.fr);
      container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="bEx">← Назад</button><span class="session-progress">Диктант · ${idx+1} / ${qs.length}</span></div>
      <section class="index-card"><div style="display:flex;gap:10px;margin-bottom:14px;"><button class="btn btn-primary" id="bL">Слухати</button><button class="btn" id="bS">Повільно</button></div>
      <input type="text" id="inpD" class="input" value="${escapeHtml(last)}" ${chk?'disabled':''}>
      ${!chk?`<button class="btn btn-primary" id="bCh">Перевірити</button>`:`<div class="feedback-box ${chk}"><div style="font-family:var(--font-fr);font-weight:700;">${escapeHtml(w.fr)} — <span style="font-weight:400;font-size:1rem;font-family:var(--font-ui);">${escapeHtml(getPromptText(w))}</span></div></div><button class="btn btn-primary" id="bNx" style="margin-top:12px;float:right;">Далі</button>`}</section>`;
      container.querySelector('#bEx').addEventListener('click',renderCurrentTab); container.querySelector('#bL').addEventListener('click',()=>speakFrench(w.fr)); container.querySelector('#bS').addEventListener('click',()=>speakFrench(w.fr,0.6));
      const inp=container.querySelector('#inpD'); if(inp&&!chk){inp.focus(); inp.addEventListener('keydown',e=>{if(e.key==='Enter')check(inp.value);});}
      if(!chk)container.querySelector('#bCh').addEventListener('click',()=>check(inp.value)); else container.querySelector('#bNx').addEventListener('click',next);
    }
    function check(v){if(chk)return; last=v; const w=qs[idx]; chk=evalWrite(v,w.fr); const ok=(chk==='ok'||chk==='almost'); handleMiniGameResult(w,ok); res.push({word:w,ok}); render(false);}
    function next(){idx++; chk=null; last=''; if(idx>=qs.length)renderRoundSummary(container,'dictation',res); else render(true);}
    function onK(e){if(chk&&e.key==='Enter')next();} window.addEventListener('keydown',onK); activeSessionCleanup=()=>window.removeEventListener('keydown',onK); render(true);
  }

  /* --- 6. У КОНТЕКСТІ --- */
  function runContextMode(container){
    const qs=pickStudyWords(10, w=>Boolean(w.ex)); if(qs.length<4){alert('Мало слів із прикладами (ex)'); renderCurrentTab(); return;}
    let idx=0; let ansd=false; let opts=[]; const res=[];
    function setup(){ const w=qs[idx]; opts=shuffle([w, ...shuffle(getActiveWordsPool().filter(x=>x.id!==w.id)).slice(0,3)]); ansd=false; render(w); }
    function render(w,chId=null){
      container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="bEx">← Назад</button><span class="session-progress">У контексті · ${idx+1}/${qs.length}</span></div>
      <section class="index-card"><div class="study-example"><span>${ansd?highlightBracketExample(w.ex,w.fr):maskBracketExample(w.ex)}</span>${ansd?speakerBtnHtml(w.ex):''}</div>
      <div class="options-grid">${opts.map((o,i)=>{ let cls=''; if(ansd){if(o.id===w.id)cls='correct';else if(o.id===chId)cls='wrong';} return `<button class="option-btn ${cls}" data-opt="${o.id}" ${ansd?'disabled':''}><span class="option-key">${i+1}</span><span style="font-family:var(--font-fr);font-weight:600;">${escapeHtml(o.fr)}</span></button>`;}).join('')}</div>
      ${ansd?`<button class="btn btn-primary" id="bNx" style="margin-top:14px;float:right;">Далі</button>`:''}</section>`;
      container.querySelector('#bEx').addEventListener('click',renderCurrentTab); container.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.opt))); if(ansd)container.querySelector('#bNx').addEventListener('click',next);
    }
    function choose(id){if(ansd)return; ansd=true; const w=qs[idx]; const ok=(id===w.id); handleMiniGameResult(w,ok); res.push({word:w,ok}); render(w,id); if(speechSupported)speakFrench(w.ex);}
    function next(){idx++; if(idx>=qs.length)renderRoundSummary(container,'context',res); else setup();}
    function maskBracketExample(ex){return escapeHtml(ex).replace(/\[.+?\]/g,'<span class="hl-word">[ … ]</span>');}
    function onK(e){if(!ansd&&['1','2','3','4'].includes(e.key)){const o=opts[Number(e.key)-1]; if(o)choose(o.id);} else if(ansd&&e.key==='Enter')next();} window.addEventListener('keydown',onK); activeSessionCleanup=()=>window.removeEventListener('keydown',onK); setup();
  }

  /* --- 7. СИНОНІМИ --- */
  function runSynonymsMode(container){
    const qs=pickStudyWords(10, w=>w.syn&&w.syn.length>0); if(qs.length<1){alert('Немає слів із синонімами'); renderCurrentTab(); return;}
    let idx=0; let ansd=false; let opts=[]; let tSyn=''; const res=[];
    function setup(){ const w=qs[idx]; tSyn=w.syn[0]; const dp=getActiveWordsPool().filter(x=>x.id!==w.id).map(x=>(x.syn&&x.syn[0])?x.syn[0]:x.fr).filter(s=>s.toLowerCase()!==tSyn.toLowerCase()); opts=shuffle([tSyn, ...shuffle(Array.from(new Set(dp))).slice(0,3)]); ansd=false; render(w); }
    function render(w,ch=null){
      container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="bEx">← Назад</button><span class="session-progress">Синоніми · ${idx+1}/${qs.length}</span></div>
      <section class="index-card"><div style="display:flex;justify-content:space-between;"><div><div class="study-word-title">${escapeHtml(w.fr)}</div><div style="color:var(--text-muted);">${escapeHtml(getPromptText(w))}</div></div>${speakerBtnHtml(w.fr)}</div>
      <div class="options-grid">${opts.map((o,i)=>{ let cls=''; if(ansd){if(o===tSyn)cls='correct';else if(o===ch)cls='wrong';} return `<button class="option-btn ${cls}" data-s="${escapeHtml(o)}" ${ansd?'disabled':''}><span class="option-key">${i+1}</span><span style="font-family:var(--font-fr);font-weight:600;">${escapeHtml(o)}</span></button>`;}).join('')}</div>
      ${ansd?`<button class="btn btn-primary" id="bNx" style="margin-top:14px;float:right;">Далі</button>`:''}</section>`;
      container.querySelector('#bEx').addEventListener('click',renderCurrentTab); container.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.s))); if(ansd)container.querySelector('#bNx').addEventListener('click',next);
    }
    function choose(v){if(ansd)return; ansd=true; const w=qs[idx]; const ok=(v===tSyn); handleMiniGameResult(w,ok); res.push({word:w,ok}); render(w,v);}
    function next(){idx++; if(idx>=qs.length)renderRoundSummary(container,'synonyms',res); else setup();}
    function onK(e){if(!ansd&&['1','2','3','4'].includes(e.key)){const o=opts[Number(e.key)-1]; if(o)choose(o);} else if(ansd&&e.key==='Enter')next();} window.addEventListener('keydown',onK); activeSessionCleanup=()=>window.removeEventListener('keydown',onK); setup();
  }

  /* --- 8. ПАРИ --- */
  function runPairsMode(container){
    const pool=pickStudyWords(10); if(pool.length<5){alert('Потрібно мінімум 5 слів'); renderCurrentTab(); return;}
    const rounds=[pool.slice(0,5)]; if(pool.length>=10)rounds.push(pool.slice(5,10));
    let rIdx=0; let t=0; const res=[]; let L=[], R=[], mat=new Set(), sL=null, sR=null;
    const iv=setInterval(()=>{t++; const el=document.getElementById('pT'); if(el)el.innerText=t;},1000); activeSessionCleanup=()=>clearInterval(iv);
    function setup(){ const b=rounds[rIdx]; L=shuffle(b.slice()); R=shuffle(b.slice()); mat=new Set(); sL=null; sR=null; render(); }
    function render(){
      container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="bEx">← Назад</button><span class="session-progress">Раунд ${rIdx+1}/${rounds.length} · <span id="pT">${t}</span>с</span></div>
      <section class="index-card"><div class="pairs-columns"><div style="display:flex;flex-direction:column;gap:8px;">${L.map(w=>`<button class="pair-card ${mat.has(w.id)?'matched':''} ${sL===w.id?'selected':''}" data-l="${w.id}"><span style="font-family:var(--font-fr);font-weight:600;">${escapeHtml(w.fr)}</span></button>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${R.map(w=>`<button class="pair-card ${mat.has(w.id)?'matched':''} ${sR===w.id?'selected':''}" data-r="${w.id}"><span>${escapeHtml(getPromptText(w))}</span></button>`).join('')}</div></div></section>`;
      container.querySelector('#bEx').addEventListener('click',renderCurrentTab); container.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{sL=b.dataset.l;chk();})); container.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{sR=b.dataset.r;chk();}));
    }
    function chk(){
      if(!sL||!sR){render();return;}
      if(sL===sR){mat.add(sL); const w=rounds[rIdx].find(x=>x.id===sL); if(w){handleMiniGameResult(w,true); res.push({word:w,ok:true}); if(speechSupported)speakFrench(w.fr);} sL=null; sR=null; if(mat.size===rounds[rIdx].length){rIdx++; if(rIdx>=rounds.length){clearInterval(iv); renderRoundSummary(container,'pairs',res);} else setup();} else render(); }
      else {sL=null; sR=null; showToast('Не збігається'); render();}
    }
    setup();
  }

  /* --- 9. КРОСВОРД (Спрощений генератор для екрану) --- */
  function runCrosswordMode(container){
    const pool=pickStudyWords(10); if(pool.length<4){alert('Мало слів'); renderCurrentTab(); return;}
    let grid=Array(10).fill(0).map(()=>Array(10).fill(null)); let placed=[];
    for(let w of pool){ const c=stripDiacritics(w.fr.toLowerCase().replace(/[^a-z]/g,'')); if(c.length>2&&c.length<=10){ placed.push({w,c,r:0,col:0,d:'H'}); if(placed.length>=5)break; } }
    if(placed.length===0){alert('Немає відповідних слів');renderCurrentTab();return;}
    // Найпростіший макет (просто список для екрану)
    placed.forEach((p,i)=>{p.r=i*2; p.col=0; p.num=i+1; for(let j=0;j<p.c.length;j++)grid[p.r][j]=p.c[j];});
    container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="bEx">← Назад</button><span class="session-progress">Кросворд</span></div>
    <section class="index-card"><div class="cw-grid" style="grid-template-columns:repeat(10,1fr);">${grid.map((row,r)=>row.map((cell,c)=>cell===null?`<div class="cw-cell empty"></div>`:`<div class="cw-cell"><input type="text" maxlength="1" data-ans="${cell}"></div>`).join('')).join('')}</div>
    <button class="btn btn-primary" id="bRev" style="margin-top:12px;width:100%;">Показати відповіді</button>
    <div class="cw-clues" style="grid-template-columns:1fr;">${placed.map(p=>`<div><strong>${p.num}.</strong> ${escapeHtml(getPromptText(p.w))}</div>`).join('')}</div></section>`;
    container.querySelector('#bEx').addEventListener('click',renderCurrentTab);
    container.querySelector('#bRev').addEventListener('click',()=>{container.querySelectorAll('input').forEach(i=>{i.value=i.dataset.ans;i.classList.add('cw-ok');});});
  }

  /* --- 10. АНАГРАМА --- */
  function runAnagramMode(container){
    const qs=pickStudyWords(10); let idx=0; let p=[], sel=[]; const res=[];
    function setup(){ const w=qs[idx]; p=shuffle(Array.from(w.fr).map((c,i)=>({c,i}))); sel=[]; render(); }
    function render(){
      const w=qs[idx]; const done=(sel.length===p.length && sel.map(i=>p[i].c).join('')===w.fr);
      if(done && !res.find(r=>r.word.id===w.id)){handleMiniGameResult(w,true); res.push({word:w,ok:true}); if(speechSupported)speakFrench(w.fr);}
      container.innerHTML=`<div class="session-header"><button class="btn btn-sm" id="bEx">← Назад</button><span class="session-progress">Анаграма · ${idx+1}/${qs.length}</span></div>
      <section class="index-card"><div class="study-meaning">${escapeHtml(getPromptText(w))}</div><div class="anagram-slots">${sel.map((pi,pos)=>`<button class="letter-tile" data-u="${pos}">${escapeHtml(p[pi].c)}</button>`).join('')}</div>
      <div class="anagram-pool">${p.map((x,pi)=>`<button class="letter-tile ${sel.includes(pi)?'used':''}" data-p="${pi}">${escapeHtml(x.c)}</button>`).join('')}</div>
      ${done?`<button class="btn btn-primary" id="bNx" style="margin-top:12px;float:right;">Далі</button>`:`<button class="btn" id="bRs" style="margin-top:12px;">Скинути</button>`}</section>`;
      container.querySelector('#bEx').addEventListener('click',renderCurrentTab); container.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>pick(Number(b.dataset.p)))); container.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>unpick(Number(b.dataset.u))));
      if(done)container.querySelector('#bNx').addEventListener('click',next); else container.querySelector('#bRs').addEventListener('click',()=>{sel=[];render();});
    }
    function pick(i){if(!sel.includes(i))sel.push(i); render();} function unpick(pos){sel.splice(pos,1); render();}
    function next(){idx++; if(idx>=qs.length)renderRoundSummary(container,'anagram',res); else setup();}
    setup();
  }

  // === СЛОВА ===
  function renderWordsTab(container) {
    container.innerHTML = `
      <section class="panel-card"><h3 style="font-family:var(--font-fr); margin-bottom:12px;">Мої слова (${state.words.length})</h3>
        <div class="word-list">${state.words.map(w => `<article class="word-item" data-status="${getWordStatus(w)}"><div class="word-item-header"><div class="word-fr-line"><span class="word-fr">${escapeHtml(w.fr)}</span></div></div><div class="word-meaning">${escapeHtml(getPromptText(w))}</div><div class="word-item-actions"><span>Повторень: ${w.r || 0}</span><div>${speakerBtnHtml(w.fr)}</div></div></article>`).join('')}</div>
      </section>`;
  }

  // === НАЛАШТУВАННЯ ===
  function renderSettingsTab(container) {
    refreshVoices();
    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:16px;"><section class="panel-card"><div class="section-label">Тема оформлення</div><select id="selTheme" class="select"><option value="auto" ${state.settings.theme==='auto'?'selected':''}>Системна</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Світла</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Темна</option></select></section></div>`;
    container.querySelector('#selTheme').addEventListener('change', e => { state.settings.theme = e.target.value; applyTheme(); saveLocalStats(); });
  }

  document.addEventListener('click', e => { const sb = e.target.closest('.js-speak-btn'); if (sb) { e.preventDefault(); e.stopPropagation(); speakFrench(decodeURIComponent(sb.dataset.speak||'')); } });
  document.querySelectorAll('.nav-tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
  document.getElementById('btnModeUkFr').addEventListener('click', () => { state.settings.langMode = 'UK_FR'; saveLocalStats(); renderCurrentTab(); });
  document.getElementById('btnModeFrFr').addEventListener('click', () => { state.settings.langMode = 'FR_FR'; saveLocalStats(); renderCurrentTab(); });
</script>
</body>
</html>
