  /* =========================================================
   * 7. РЕЖИМ ПАРИ
   * ========================================================= */
  function runPairsMode(container) {
    const pool = pickStudyWords(10);
    if (pool.length < 5) {
      showToast('Потрібно мінімум 5 слів');
      exitToDashboard();
      return;
    }
    const rounds = [pool.slice(0, 5)];
    if (pool.length >= 10) rounds.push(pool.slice(5, 10));
    let rIdx = 0; let t = 0; const res = []; let L = [], R = [], mat = new Set(), sL = null, sR = null;
    const iv = setInterval(() => { t++; const el = document.getElementById('pT'); if (el) el.innerText = t; }, 1000);
    activeSessionCleanup = () => clearInterval(iv);

    function setup() {
      const b = rounds[rIdx];
      L = shuffle(b.slice()); R = shuffle(b.slice()); mat = new Set(); sL = null; sR = null;
      render();
    }
    function render() {
      container.innerHTML = `
      <div class="session-header">
        <button class="btn btn-sm" id="bEx">← До режимів</button>
        <span class="session-progress">Пари · Раунд ${rIdx+1} / ${rounds.length} · <span id="pT">${t}</span> с</span>
      </div>
      <section class="study-card">
        <div class="instruction-text">З'єднайте французький вираз та його значення:</div>
        <div class="pairs-columns">
          <div style="display:flex;flex-direction:column;gap:8px;">${L.map(w=>`<button type="button" class="pair-btn pair-left ${mat.has(w.id)?'matched':''} ${sL===w.id?'selected':''}" data-l="${w.id}">${escapeHtml(w.fr)}</button>`).join('')}</div>
          <div style="display:flex;flex-direction:column;gap:8px;">${R.map(w=>`<button type="button" class="pair-btn pair-right ${mat.has(w.id)?'matched':''} ${sR===w.id?'selected':''}" data-r="${w.id}">${escapeHtml(getPromptText(w))}</button>`).join('')}</div>
        </div>
      </section>`;
      container.querySelector('#bEx').addEventListener('click', exitToDashboard);
      container.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => { sL = b.dataset.l; chk(); }));
      container.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { sR = b.dataset.r; chk(); }));
    }
    function chk() {
      if (!sL || !sR) { render(); return; }
      if (sL === sR) {
        mat.add(sL);
        const w = rounds[rIdx].find(x => x.id === sL);
        if (w) { handleMiniGameResult(w, true); res.push({ word: w, ok: true }); }
        sL = null; sR = null;
        if (mat.size === rounds[rIdx].length) {
          rIdx++;
          if (rIdx >= rounds.length) { clearInterval(iv); renderRoundSummary(container, 'pairs', res); }
          else setup();
        } else render();
      } else {
        sL = null; sR = null;
        showToast('Не збігається');
        render();
      }
    }
    setup();
  }

  /* =========================================================
   * 8. РЕЖИМ БЛІЦ
   * ========================================================= */
  function runBlitzMode(container) {
    const pool = getActiveWordsPool();
    if (pool.length < 2) { showToast('Недостатньо слів для Бліцу'); exitToDashboard(); return; }
    let time = 60; let score = 0; const results = []; let cur = null;
    function next() {
      const w = pool[Math.floor(Math.random() * pool.length)];
      const isT = Math.random() < 0.5;
      let showW = w;
      if (!isT) {
        const ot = pool.filter(x => x.id !== w.id);
        showW = ot[Math.floor(Math.random() * ot.length)] || w;
      }
      cur = { word: w, mean: getPromptText(showW), isM: showW.id === w.id };
      render();
    }
    function render() {
      const w = cur.word;
      container.innerHTML = `
      <div class="session-header">
        <button class="btn btn-sm" id="btnExit">← До режимів</button>
        <span class="session-progress">Бліц · ${time} с · Рахунок: ${score}</span>
      </div>
      <section class="study-card" style="text-align:center;position:relative;">
        <div id="fb" class="feedback-toast"></div>
        <div class="study-word-title" style="margin-top:16px;">${escapeHtml(w.fr)}</div>
        <hr class="study-divider">
        <div class="study-meaning" style="margin-bottom:24px;">${escapeHtml(cur.mean)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <button type="button" class="btn btn-danger" id="bNo" style="min-height:54px;">← Ні (Неправильно)</button>
          <button type="button" class="btn btn-primary" id="bYes" style="min-height:54px;">Так (Правильно) →</button>
        </div>
      </section>`;
      container.querySelector('#btnExit').addEventListener('click', exitToDashboard);
      container.querySelector('#bNo').addEventListener('click', () => ans(false));
      container.querySelector('#bYes').addEventListener('click', () => ans(true));
    }
    function ans(yes) {
      const ok = (yes === cur.isM);
      if (ok) score++;
      handleMiniGameResult(cur.word, ok);
      results.push({ word: cur.word, ok });
      const fb = document.getElementById('fb');
      if (fb) {
        fb.innerText = ok ? '✓ Правильно' : '✗ Помилка';
        fb.className = ok ? 'feedback-toast bg-green show' : 'feedback-toast bg-red show';
        setTimeout(next, 450);
      } else next();
    }
    const iv = setInterval(() => {
      time--;
      const t = document.querySelector('.session-progress');
      if (t) t.innerHTML = `Бліц · ${time} с · Рахунок: ${score}`;
      if (time <= 0) { clearInterval(iv); renderRoundSummary(container, 'blitz', results); }
    }, 1000);
    function onKey(e) { if (e.key === 'ArrowLeft') ans(false); else if (e.key === 'ArrowRight') ans(true); }
    window.addEventListener('keydown', onKey);
    activeSessionCleanup = () => { clearInterval(iv); window.removeEventListener('keydown', onKey); };
    next();
  }

  /* =========================================================
   * 9. РЕЖИМ КРОСВОРД
   * ========================================================= */
  const CW_STOPWORDS = new Set(['qqn', 'qqch', 'qch', 'qn', 'taille', 'pointure', 'adjectif', 'nom', 'un', 'une', 'le', 'la', 'les', 'des', 'dans', 'pour', 'avec']);
  function extractCrosswordEntry(w) {
    const rawFr = getTestableFr(w.fr);
    const fullClean = rawFr.replace(/^(le |la |les |un |une |l'|se |s')/i, '').replace(/[-'’]/g, '').replace(/[^a-zàâäéèêëîïôöùûüÿçœæ]/gi, '').toLowerCase();
    if (fullClean.length >= 3 && fullClean.length <= 12) return { word: w, clean: fullClean, clueExtra: '' };
    const tokens = rawFr.replace(/[’‘]/g, "'").split(/[\s\-']+/).map(t => ({ orig: t, clean: t.toLowerCase().replace(/[-'’]/g, '').replace(/[^a-zàâäéèêëîïôöùûüÿçœæ]/gi, '') })).filter(t => t.clean.length >= 3 && t.clean.length <= 12 && !CW_STOPWORDS.has(t.clean));
    if (tokens.length > 0) {
      tokens.sort((a, b) => b.clean.length - a.clean.length);
      const chosen = tokens[0];
      const maskedPhrase = rawFr.replace(new RegExp(chosen.orig.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '[…]');
      return { word: w, clean: chosen.clean, clueExtra: maskedPhrase };
    }
    return null;
  }
  function generateCrosswordPuzzle() {
    const GRID_SIZE = 12;
    const candidates = shuffle(getActiveWordsPool()).map(w => extractCrosswordEntry(w)).filter(Boolean);
    const grid = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(null));
    const placed = [];
    function canPlace(str, r, c, dir) {
      const len = str.length;
      if (dir === 'H') {
        if (c < 0 || c + len > GRID_SIZE || r < 0 || r >= GRID_SIZE) return false;
        if (c > 0 && grid[r][c - 1] !== null) return false;
        if (c + len < GRID_SIZE && grid[r][c + len] !== null) return false;
        let inter = 0;
        for (let i = 0; i < len; i++) {
          const cur = grid[r][c + i];
          if (cur !== null) { if (cur !== str[i]) return false; inter++; }
          else { if (r > 0 && grid[r - 1][c + i] !== null) return false; if (r + 1 < GRID_SIZE && grid[r + 1][c + i] !== null) return false; }
        }
        return inter;
      } else {
        if (r < 0 || r + len > GRID_SIZE || c < 0 || c >= GRID_SIZE) return false;
        if (r > 0 && grid[r - 1][c] !== null) return false;
        if (r + len < GRID_SIZE && grid[r + len][c] !== null) return false;
        let inter = 0;
        for (let i = 0; i < len; i++) {
          const cur = grid[r + i][c];
          if (cur !== null) { if (cur !== str[i]) return false; inter++; }
          else { if (c > 0 && grid[r + i][c - 1] !== null) return false; if (c + 1 < GRID_SIZE && grid[r + i][c + 1] !== null) return false; }
        }
        return inter;
      }
    }
    function putWord(item, r, c, dir) {
      const str = item.clean;
      for (let i = 0; i < str.length; i++) { if (dir === 'H') grid[r][c + i] = str[i]; else grid[r + i][c] = str[i]; }
      placed.push({ ...item, r, c, dir });
    }
    if (candidates.length > 0) { const first = candidates.shift(); putWord(first, Math.floor(GRID_SIZE / 2), Math.max(0, Math.floor((GRID_SIZE - first.clean.length) / 2)), 'H'); }
    for (const cand of candidates) {
      if (placed.length >= 9) break;
      let isPlaced = false;
      for (let i = 0; i < cand.clean.length && !isPlaced; i++) {
        const ch = cand.clean[i];
        for (const p of placed) {
          const nextDir = p.dir === 'H' ? 'V' : 'H';
          for (let j = 0; j < p.clean.length; j++) {
            if (p.clean[j] === ch) {
              const r = p.dir === 'H' ? p.r - i : p.r + j; const c = p.dir === 'H' ? p.c + j : p.c - i;
              const res = canPlace(cand.clean, r, c, nextDir);
              if (res !== false && res >= 1) { putWord(cand, r, c, nextDir); isPlaced = true; break; }
            }
          }
          if (isPlaced) break;
        }
      }
    }
    for (const cand of candidates) {
      if (placed.length >= 6) break;
      if (placed.some(p => p.word.id === cand.word.id)) continue;
      let done = false;
      for (let r = 0; r < GRID_SIZE && !done; r++) {
        for (let c = 0; c <= GRID_SIZE - cand.clean.length && !done; c++) {
          if (canPlace(cand.clean, r, c, 'H') !== false) { putWord(cand, r, c, 'H'); done = true; }
        }
      }
    }
    placed.forEach((p, idx) => { p.num = idx + 1; });
    return { grid, placed, size: GRID_SIZE };
  }

  function runCrosswordMode(container) {
    const puzzle = generateCrosswordPuzzle();
    if (puzzle.placed.length === 0) { showToast('Мало слів для генерації кросворду'); exitToDashboard(); return; }
    let activeDir = 'H'; let lastFocused = null; const numMap = {};
    puzzle.placed.forEach(p => { const key = `${p.r},${p.c}`; numMap[key] = numMap[key] ? `${numMap[key]}/${p.num}` : String(p.num); });
    const across = puzzle.placed.filter(p => p.dir === 'H'); const down = puzzle.placed.filter(p => p.dir === 'V');

    container.innerHTML = `
      <div class="session-header">
        <button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button>
        <span class="session-progress">Кросворд · Слів: ${puzzle.placed.length}</span>
      </div>
      <section class="study-card cw-wrapper">
        <div class="cw-grid" style="grid-template-columns: repeat(${puzzle.size}, 1fr);">
          ${puzzle.grid.map((row, r) => row.map((cell, c) => {
            if (cell === null) return `<div class="cw-cell empty"></div>`;
            const n = numMap[`${r},${c}`] || '';
            return `<div class="cw-cell">${n ? `<span class="cw-num">${n}</span>` : ''}<input type="text" maxlength="1" data-r="${r}" data-c="${c}" data-ans="${cell}"></div>`;
          }).join('')).join('')}
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:8px;">
          <button type="button" class="btn btn-primary" id="btnCwCheck">Перевірити</button>
          <button type="button" class="btn" id="btnCwHint">Підказати літеру</button>
          <button type="button" class="btn" id="btnCwReveal">Відповіді</button>
          <button type="button" class="btn" id="btnCwFinish">Завершити раунд</button>
        </div>
        <div class="cw-clues">
          <div>
            <div class="section-label">ПО ГОРИЗОНТАЛІ</div>
            ${across.length ? across.map(p => `<div class="cw-clue-item" data-focus="${p.r},${p.c},H"><strong>${p.num}.</strong> ${escapeHtml(getPromptText(p.word))} <span class="badge">${p.clean.length} літ.</span> ${p.clueExtra ? `<br><span style="font-family:var(--font-fr); color:var(--text-muted); font-style:italic;">(${escapeHtml(p.clueExtra)})</span>` : ''}</div>`).join('') : '<div style="color:var(--text-muted);">—</div>'}
          </div>
          <div>
            <div class="section-label">ПО ВЕРТИКАЛІ</div>
            ${down.length ? down.map(p => `<div class="cw-clue-item" data-focus="${p.r},${p.c},V"><strong>${p.num}.</strong> ${escapeHtml(getPromptText(p.word))} <span class="badge">${p.clean.length} літ.</span> ${p.clueExtra ? `<br><span style="font-family:var(--font-fr); color:var(--text-muted); font-style:italic;">(${escapeHtml(p.clueExtra)})</span>` : ''}</div>`).join('') : '<div style="color:var(--text-muted);">—</div>'}
          </div>
        </div>
      </section>
    `;
    container.querySelector('#btnExitMode').addEventListener('click', exitToDashboard);
    const getInput = (r, c) => container.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
    container.querySelectorAll('.cw-clue-item').forEach(el => { el.addEventListener('click', () => { const [r, c, dir] = el.dataset.focus.split(','); activeDir = dir; const inp = getInput(Number(r), Number(c)); if (inp) inp.focus(); }); });
    container.querySelectorAll('.cw-cell input').forEach(inp => {
      inp.addEventListener('focus', () => { lastFocused = inp; });
      inp.addEventListener('input', () => { inp.classList.remove('cw-ok', 'cw-err'); if (inp.value) { const r = Number(inp.dataset.r); const c = Number(inp.dataset.c); const next = activeDir === 'H' ? getInput(r, c + 1) : getInput(r + 1, c); if (next) next.focus(); } });
      inp.addEventListener('keydown', e => {
        const r = Number(inp.dataset.r); const c = Number(inp.dataset.c);
        if (e.key === 'Backspace' && !inp.value) { const prev = activeDir === 'H' ? getInput(r, c - 1) : getInput(r - 1, c); if (prev) prev.focus(); }
        else if (e.key === 'ArrowRight') { activeDir = 'H'; const n = getInput(r, c + 1); if (n) n.focus(); }
        else if (e.key === 'ArrowLeft') { activeDir = 'H'; const n = getInput(r, c - 1); if (n) n.focus(); }
        else if (e.key === 'ArrowDown') { activeDir = 'V'; const n = getInput(r + 1, c); if (n) n.focus(); }
        else if (e.key === 'ArrowUp') { activeDir = 'V'; const n = getInput(r - 1, c); if (n) n.focus(); }
        else if (e.key === 'Enter') { e.preventDefault(); container.querySelector('#btnCwCheck').click(); }
      });
    });
    container.querySelector('#btnCwCheck').addEventListener('click', () => { container.querySelectorAll('.cw-cell input').forEach(inp => { const val = stripDiacritics(inp.value.trim().toLowerCase()); const ans = stripDiacritics(inp.dataset.ans.toLowerCase()); if (!val) return; if (val === ans) { inp.classList.add('cw-ok'); inp.classList.remove('cw-err'); } else { inp.classList.add('cw-err'); inp.classList.remove('cw-ok'); } }); });
    container.querySelector('#btnCwHint').addEventListener('click', () => { const target = (lastFocused && !lastFocused.value) ? lastFocused : Array.from(container.querySelectorAll('.cw-cell input')).find(i => i.value.toLowerCase() !== i.dataset.ans); if (target) { target.value = target.dataset.ans; target.classList.add('cw-ok'); target.focus(); } });
    container.querySelector('#btnCwReveal').addEventListener('click', () => { container.querySelectorAll('.cw-cell input').forEach(inp => { inp.value = inp.dataset.ans; inp.classList.add('cw-ok'); inp.classList.remove('cw-err'); }); });
    container.querySelector('#btnCwFinish').addEventListener('click', () => { const summary = puzzle.placed.map(p => { let wordOk = true; for (let i = 0; i < p.clean.length; i++) { const r = p.dir === 'H' ? p.r : p.r + i; const c = p.dir === 'H' ? p.c + i : p.c; const inp = getInput(r, c); const v = stripDiacritics((inp ? inp.value : '').toLowerCase()); const a = stripDiacritics(p.clean[i].toLowerCase()); if (v !== a) wordOk = false; } handleMiniGameResult(p.word, wordOk); return { word: p.word, ok: wordOk }; }); renderRoundSummary(container, 'crossword', summary); });
  }

  /* =========================================================
   * 10. РЕЖИМ АНАГРАМА
   * ========================================================= */
  function runAnagramMode(container, restored = null) {
    let questions = [];
    let idx = 0;
    let pool = [];
    let pickedIndices = [];
    let finishedWord = false;
    const results = [];

    if (restored && Array.isArray(restored.wordIds)) {
      questions = restored.wordIds.map(id => state.words.find(w => w.id === id)).filter(Boolean);
      idx = restored.idx || 0;
      if (Array.isArray(restored.results)) {
        restored.results.forEach(r => {
          const w = state.words.find(x => x.id === r.id);
          if (w) results.push({ word: w, ok: r.ok });
        });
      }
    } else {
      questions = pickStudyWords(10);
    }
    if (questions.length === 0 || idx >= questions.length) { exitToDashboard(); return; }

    function syncSession() {
      activeRoundState = {
        mode: 'anagram',
        wordIds: questions.map(w => w.id),
        idx,
        results: results.map(r => ({ id: r.word.id, ok: r.ok }))
      };
      saveActiveSessionProgress();
    }

    function setupAnagram() {
      syncSession();
      const w = questions[idx];
      const targetStr = getTestableFr(w.fr);
      pool = shuffle(Array.from(targetStr).map((c, i) => ({ c, i })).filter(item => item.c !== ' '));
      pickedIndices = [];
      finishedWord = false;
      renderAnagram();
    }
    function renderAnagram() {
      const w = questions[idx];
      const targetStr = getTestableFr(w.fr);
      let slotsHtml = ''; let poolIdx = 0;
      for (let char of Array.from(targetStr)) {
        if (char === ' ') {
          slotsHtml += `<div class="letter-tile space-slot"></div>`;
        } else {
          if (poolIdx < pickedIndices.length) {
            const pi = pickedIndices[poolIdx];
            slotsHtml += `<button type="button" class="letter-tile" data-unpick="${poolIdx}">${escapeHtml(pool[pi].c)}</button>`;
          } else {
            slotsHtml += `<div class="letter-tile" style="background:var(--bg-elevated); border-color:transparent;"></div>`;
          }
          poolIdx++;
        }
      }

      container.innerHTML = `
        <div class="session-header">
          <button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button>
          <span class="session-progress">Анаграма · ${idx + 1} / ${questions.length}</span>
        </div>
        <section class="study-card">
          <div class="study-meaning">${escapeHtml(getPromptText(w))}</div>
          <div class="instruction-text">Складіть французький вираз із літер:</div>
          <div class="anagram-slots">${slotsHtml}</div>
          <div class="anagram-pool">${pool.map((item, pi) => `<button type="button" class="letter-tile ${pickedIndices.includes(pi) ? 'used' : ''}" data-pick="${pi}">${escapeHtml(item.c)}</button>`).join('')}</div>
          ${!finishedWord ? `
            <div style="display:flex; justify-content:flex-start; gap:8px; margin-top:12px;"><button type="button" class="btn" id="btnAnaReset">Скинути</button></div>
          ` : `
            <div class="feedback-box ok" style="display:flex; align-items:center; justify-content:space-between;">
              <div>Складено: <strong style="font-family:var(--font-fr); font-size:1.15rem;">${escapeHtml(targetStr)}</strong></div>
              ${speakerBtnHtml(w.fr)}
            </div>
            <div style="margin-top:12px; display:flex; justify-content:flex-end;">
              <button type="button" class="btn btn-primary btn-next" id="btnNextAna">Далі ${icon('arrowRight')}</button>
            </div>
          `}
        </section>
      `;
      container.querySelector('#btnExitMode').addEventListener('click', exitToDashboard);
      container.querySelectorAll('[data-pick]').forEach(btn => btn.addEventListener('click', () => pickTile(Number(btn.dataset.pick))));
      container.querySelectorAll('[data-unpick]').forEach(btn => btn.addEventListener('click', () => { if (!finishedWord) { pickedIndices.splice(Number(btn.dataset.unpick), 1); renderAnagram(); } }));
      if (container.querySelector('#btnAnaReset')) container.querySelector('#btnAnaReset').addEventListener('click', () => { pickedIndices = []; renderAnagram(); });
      if (container.querySelector('#btnNextAna')) container.querySelector('#btnNextAna').addEventListener('click', nextWord);
    }
    function pickTile(pi) {
      if (finishedWord || pickedIndices.includes(pi)) return;
      pickedIndices.push(pi);
      const w = questions[idx];
      const targetStr = getTestableFr(w.fr);
      if (pickedIndices.length === pool.length) {
        let attempt = ''; let pIdx = 0;
        for (let char of Array.from(targetStr)) { if (char === ' ') attempt += ' '; else { attempt += pool[pickedIndices[pIdx]].c; pIdx++; } }
        if (attempt.toLowerCase() === targetStr.toLowerCase()) {
          finishedWord = true;
          handleMiniGameResult(w, true);
          results.push({ word: w, ok: true });
        } else {
          showToast('Неправильно, спробуйте ще раз.');
          pickedIndices = [];
        }
      }
      renderAnagram();
    }
    function nextWord() { if (!finishedWord) return; idx++; if (idx >= questions.length) renderRoundSummary(container, 'anagram', results); else setupAnagram(); }
    function onKey(e) {
      if (finishedWord && e.key === 'Enter') { e.preventDefault(); nextWord(); return; }
      if (!finishedWord) {
        if (e.key === 'Backspace') { pickedIndices.pop(); renderAnagram(); }
        else if (e.key.length === 1) {
          const ch = stripDiacritics(e.key.toLowerCase());
          const found = pool.findIndex((item, pi) => !pickedIndices.includes(pi) && stripDiacritics(item.c.toLowerCase()) === ch);
          if (found !== -1) pickTile(found);
        }
      }
    }
    window.addEventListener('keydown', onKey);
    activeSessionCleanup = () => window.removeEventListener('keydown', onKey);
    setupAnagram();
  }

  /* =========================================================
   * СЛОВА, РЕДАГУВАННЯ, ІМПОРТ ТА НАДІЙНЕ ВИДАЛЕННЯ В SUPABASE
   * ========================================================= */
  // Частини мови: у картках pos — вільний текст ("nom masculin", "verbe pronominal"), тож зводимо до груп.
  // Порядок важливий: "adverbe" перевіряємо до "verbe", "locution" до решти.
  const POS_GROUPS = [
    { id: 'expression', label: 'Вирази', re: /expression|locution/i },
    { id: 'adverbe', label: 'Прислівники', re: /adverbe/i },
    { id: 'verbe', label: 'Дієслова', re: /\bverbe\b/i },
    { id: 'adjectif', label: 'Прикметники', re: /adjectif/i },
    { id: 'nom', label: 'Іменники', re: /\bnoms?\b|substantif/i }
  ];
  function posGroupId(pos) {
    const s = String(pos || '').trim();
    if (!s) return 'autre';
    const hit = POS_GROUPS.find(g => g.re.test(s));
    return hit ? hit.id : 'autre';
  }
  function posGroupLabel(id) {
    const hit = POS_GROUPS.find(g => g.id === id);
    return hit ? hit.label : 'Інше';
  }

  // ОДИН предикат і для списку, і для лічильників у випадайках.
  // Доки вони були різні, лічильники частин мови показували весь словник,
  // ігноруючи обрану тему. `except` дозволяє порахувати варіанти самого фільтра
  // (скільки буде дієслів, якщо зараз вибрано «Іменники»).
  function wordPassesFilters(w, f, except) {
    if (except !== 'status' && f.status && f.status !== 'all' && getWordStatus(w) !== f.status) return false;
    if (except !== 'pos' && f.pos && f.pos !== 'all' && posGroupId(w.pos) !== f.pos) return false;
    if (except !== 'src' && f.src && f.src !== 'all' && w.src !== f.src) return false;
    const q = String(f.query || '').trim().toLowerCase();
    if (q) {
      const hay = [w.fr, w.uk, w.def].map(x => String(x || '').toLowerCase());
      if (!hay.some(x => x.includes(q))) return false;
    }
    return true;
  }
  function tallyWords(words, f, except, keyFn) {
    const m = new Map();
    for (const w of words) if (wordPassesFilters(w, f, except)) {
      const k = keyFn(w);
      m.set(k, (m.get(k) || 0) + 1);
    }
    return m;
  }

  let wordSearchQuery = '';
  let wordFilterStatus = 'all';
  let wordFilterPos = 'all';
  let wordFilterSrc = 'all';
  let confirmingDeleteWordId = null;
  let confirmingTopicDelete = false;

  function renderWordsTab(container) {
    const sources = Array.from(new Set(state.words.map(w => w.src).filter(Boolean))).sort();
    if (wordFilterSrc !== 'all' && !sources.includes(wordFilterSrc)) {
      wordFilterSrc = 'all';
      confirmingTopicDelete = false;
    }
    const posOrder = POS_GROUPS.map(g => g.id).concat('autre');
    // Скидаємо вибір лише тоді, коли такої частини мови не лишилось у СЛОВНИКУ взагалі
    // (наприклад, слова видалили). Через зміну теми вибір не губимо: буде видно «(0)».
    const posEverywhere = new Set(state.words.map(w => posGroupId(w.pos)));
    if (wordFilterPos !== 'all' && !posEverywhere.has(wordFilterPos)) wordFilterPos = 'all';
    const currentFilters = () => ({ status: wordFilterStatus, pos: wordFilterPos, src: wordFilterSrc, query: wordSearchQuery });

    function srcOptionsHtml() {
      const f = currentFilters();
      const tally = tallyWords(state.words, f, 'src', w => w.src || '');
      const total = [...tally.values()].reduce((a, b) => a + b, 0);
      return `<option value="all" ${wordFilterSrc === 'all' ? 'selected' : ''}>🌟 Усі теми (${total})</option>`
        + sources.map(src => `<option value="${escapeHtml(src)}" ${wordFilterSrc === src ? 'selected' : ''}>${escapeHtml(src)} (${tally.get(src) || 0})</option>`).join('');
    }
    function posOptionsHtml() {
      const f = currentFilters();
      const tally = tallyWords(state.words, f, 'pos', w => posGroupId(w.pos));
      // Показуємо наявні в цій вибірці + обрану (хай навіть «0»), щоб вибір не зникав з-під пальця
      const ids = posOrder.filter(id => tally.has(id) || id === wordFilterPos);
      const total = [...tally.values()].reduce((a, b) => a + b, 0);
      return `<option value="all" ${wordFilterPos === 'all' ? 'selected' : ''}>Усі частини мови (${total})</option>`
        + ids.map(id => `<option value="${escapeHtml(id)}" ${wordFilterPos === id ? 'selected' : ''}>${escapeHtml(posGroupLabel(id))} (${tally.get(id) || 0})</option>`).join('');
    }
    function statusOptionsHtml() {
      const f = currentFilters();
      const tally = tallyWords(state.words, f, 'status', w => getWordStatus(w));
      const total = [...tally.values()].reduce((a, b) => a + b, 0);
      const labels = [['new', 'Нове'], ['learn', 'Вчу'], ['know', 'Знаю'], ['master', 'Засвоєно']];
      return `<option value="all" ${wordFilterStatus === 'all' ? 'selected' : ''}>Усі статуси (${total})</option>`
        + labels.map(([id, label]) => `<option value="${id}" ${wordFilterStatus === id ? 'selected' : ''}>${label} (${tally.get(id) || 0})</option>`).join('');
    }

    const canBulkDeleteTopic = (wordFilterSrc !== 'all');
    const topicWordCount = canBulkDeleteTopic ? state.words.filter(w => w.src === wordFilterSrc).length : 0;

    container.innerHTML = `
      <section class="panel-card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
          <h3 style="font-family:var(--font-fr);">Мої слова (${state.words.length})</h3>
        </div>
        <div class="words-toolbar">
          <button type="button" class="btn btn-primary" id="btnAddCode">Додати з коду</button>
          <button type="button" class="btn" id="btnAddSingle">+ Слово</button>
          ${canBulkDeleteTopic ? `
            ${!confirmingTopicDelete ? `
              <button type="button" class="btn btn-danger btn-sm" id="btnAskDeleteTopic" style="margin-left:auto;">
                🗑 Видалити тему «${escapeHtml(wordFilterSrc)}» (${topicWordCount})
              </button>
            ` : `
              <span class="inline-confirm" style="margin-left:auto;">
                <button type="button" class="btn btn-sm btn-danger" id="btnConfirmDeleteTopic">Точно видалити всі ${topicWordCount} сл.?</button>
                <button type="button" class="btn btn-sm" id="btnCancelDeleteTopic">Скасувати</button>
              </span>
            `}
          ` : ''}
        </div>
        <div class="filters-bar">
          <input type="search" id="inpWordSearch" class="input f-search" style="margin-bottom:0;" placeholder="Пошук виразу або перекладу…" value="${escapeHtml(wordSearchQuery)}">
          <select id="selFilterSrc" class="select">${srcOptionsHtml()}</select>
          <select id="selFilterPos" class="select">${posOptionsHtml()}</select>
          <select id="selFilterStatus" class="select">${statusOptionsHtml()}</select>
        </div>
        <div id="wordsListContainer" class="word-list"></div>
      </section>`;
      
    container.querySelector('#btnAddCode').addEventListener('click', openAddCodeModal);
    container.querySelector('#btnAddSingle').addEventListener('click', () => openWordFormModal());

    const askTopicBtn = container.querySelector('#btnAskDeleteTopic');
    if (askTopicBtn) {
      askTopicBtn.addEventListener('click', () => {
        confirmingTopicDelete = true;
        renderWordsTab(container);
      });
    }
    const cancelTopicBtn = container.querySelector('#btnCancelDeleteTopic');
    if (cancelTopicBtn) {
      cancelTopicBtn.addEventListener('click', () => {
        confirmingTopicDelete = false;
        renderWordsTab(container);
      });
    }
    const confirmTopicBtn = container.querySelector('#btnConfirmDeleteTopic');
    if (confirmTopicBtn) {
      confirmTopicBtn.addEventListener('click', async () => {
        const deletedTopic = wordFilterSrc;
        const toDelete = state.words.filter(w => w.src === deletedTopic);
        const dbIds = toDelete.map(w => w.dbId).filter(Boolean);

        const res = await deleteCardsByIds(dbIds);
        if (res.failedIds.length > 0) {
          // Не все видалилось (немає дозволу або зв'язку). Прибираємо з екрана лише те, що справді зникло з бази,
          // інакше після перезавантаження слова «воскреснуть».
          const gone = new Set(res.deletedIds);
          state.words = state.words.filter(w => !(w.src === deletedTopic && (!w.dbId || gone.has(w.dbId))));
          res.deletedIds.forEach(id => pendingProgress.delete(id));
          savePendingProgress();
          confirmingTopicDelete = false;
          saveLocalStats();
          updateNavBadge();
          showToast(`Видалено ${res.deletedIds.length} із ${dbIds.length}. Решту видалити не вдалося, спробуйте ще раз.`);
          renderWordsTab(container);
          return;
        }
        if (currentUser && currentUser.email) {
          // Дочищаємо слова цієї теми, яких немає на цьому пристрої (наприклад, додані з іншого)
          const extra = await sbClient.from('cards').delete().eq('user_email', String(currentUser.email).toLowerCase()).eq('src', deletedTopic);
          if (extra.error) console.error('Помилка дочищення теми:', extra.error);
        }
        dbIds.forEach(id => pendingProgress.delete(id));
        savePendingProgress();

        state.words = state.words.filter(w => w.src !== deletedTopic);
        if (state.settings.focusTopic === deletedTopic) {
          state.settings.focusTopic = 'all';
        }
        wordFilterSrc = 'all';
        confirmingTopicDelete = false;
        saveLocalStats();
        updateNavBadge();
        showToast(`Усі слова з теми «${deletedTopic}» успішно видалено`);
        renderWordsTab(container);
      });
    }

    const listEl = container.querySelector('#wordsListContainer');
    function refreshFilterCounts() {
      const srcSel = container.querySelector('#selFilterSrc');
      const posSel = container.querySelector('#selFilterPos');
      const stSel = container.querySelector('#selFilterStatus');
      if (srcSel) srcSel.innerHTML = srcOptionsHtml();
      if (posSel) posSel.innerHTML = posOptionsHtml();
      if (stSel) stSel.innerHTML = statusOptionsHtml();
    }
    function renderList() {
      refreshFilterCounts();
      const f = currentFilters();
      const filtered = state.words.filter(w => wordPassesFilters(w, f));
      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Слів не знайдено.</div>`;
        return;
      }
      listEl.innerHTML = filtered.map(w => {
        const st = getWordStatus(w);
        const d = formatDueDate(w);
        const hasC = Boolean(w.conj && w.conj.tenses);
        const isConfirming = (confirmingDeleteWordId === w.id);
        return `<article class="word-item" data-status="${st}">
          <div class="word-item-header">
            <div class="word-fr-line"><span class="word-fr">${escapeHtml(w.fr)}</span> ${w.pos ? `<span class="word-pos">(${escapeHtml(w.pos)})</span>` : ''}</div>
            <div class="word-badges-row"><span class="badge">${getStatusLabel(st)}</span> ${w.src ? `<span class="badge">${escapeHtml(w.src)}</span>` : ''} ${d ? `<span class="badge">${d}</span>` : ''}</div>
          </div>
          <div class="word-meaning">${escapeHtml(getPromptText(w))}</div>
          ${w.ex ? `<div style="font-family:var(--font-fr); font-size:0.95rem; background:var(--bg-elevated); padding:8px; border-radius:4px;">${highlightBracketExample(w.ex)}</div>` : ''}
          ${hasC ? `
            <button type="button" class="btn-toggle-conj" style="width:fit-content; margin-top:6px; margin-bottom:0;" onclick="toggleConjugation(this); switchTense('present', null, 'tense-${w.id}');">📖 Відмінювання</button>
            <div class="conj-box" style="margin-top:8px;">
              <div class="tabs-nav">
                <button type="button" class="tab-btn active" onclick="switchTense('present',event)">Présent</button>
                <button type="button" class="tab-btn" onclick="switchTense('passe_compose',event)">Passé composé</button>
                <button type="button" class="tab-btn" onclick="switchTense('imparfait',event)">Imparfait</button>
                <button type="button" class="tab-btn" onclick="switchTense('futur_simple',event)">Futur simple</button>
                <button type="button" class="tab-btn" onclick="switchTense('conditionnel',event)">Conditionnel</button>
                <button type="button" class="tab-btn" onclick="switchTense('subjonctif',event)">Subjonctif</button>
              </div>
              <div id="tense-${w.id}" class="tense-content" data-vid="${w.id}"></div>
            </div>
          ` : ''}
          <div class="word-item-actions">
            <span>Повторень: ${w.r || 0} ${w.added ? `· Додано: ${w.added.split('-').slice(1).reverse().join('.')}` : ''}</span>
            <div style="display:flex;gap:6px;align-items:center;">
              ${speakerBtnHtml(w.fr)}
              <button type="button" class="btn btn-sm" data-edit="${w.id}">Редагувати</button>
              ${!isConfirming ? `
                <button type="button" class="btn btn-sm" data-askdel="${w.id}">Видалити</button>
              ` : `
                <span class="inline-confirm">
                  <button type="button" class="btn btn-sm btn-danger" data-confirmdel="${w.id}">Так, видалити</button>
                  <button type="button" class="btn btn-sm" data-canceldel="${w.id}">Скасувати</button>
                </span>
              `}
            </div>
          </div>
        </article>`;
      }).join('');

      listEl.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const w = state.words.find(item => item.id === btn.dataset.edit);
          if (w) openWordFormModal(w);
        });
      });
      listEl.querySelectorAll('[data-askdel]').forEach(btn => {
        btn.addEventListener('click', () => {
          confirmingDeleteWordId = btn.dataset.askdel;
          renderList();
        });
      });
      listEl.querySelectorAll('[data-canceldel]').forEach(btn => {
        btn.addEventListener('click', () => {
          confirmingDeleteWordId = null;
          renderList();
        });
      });
      listEl.querySelectorAll('[data-confirmdel]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const targetWord = state.words.find(item => item.id === btn.dataset.confirmdel);
          if (!targetWord) return;

          if (targetWord.dbId) {
            const res = await deleteCardsByIds([targetWord.dbId]);
            if (res.deletedIds.length === 0) {
              // Не видалилось у базі: не прибираємо слово з екрана, щоб воно не «воскресло» після перезавантаження
              confirmingDeleteWordId = null;
              showToast('Не вдалося видалити слово. Перевірте зв’язок і спробуйте ще раз.');
              renderList();
              return;
            }
            pendingProgress.delete(targetWord.dbId);
            savePendingProgress();
          }

          state.words = state.words.filter(item => item.id !== targetWord.id);
          confirmingDeleteWordId = null;
          saveLocalStats();
          updateNavBadge();
          showToast('Слово видалено');
          renderWordsTab(container);
        });
      });
    }

    container.querySelector('#inpWordSearch').addEventListener('input', e => {
      wordSearchQuery = e.target.value;
      renderList();
    });
    container.querySelector('#selFilterStatus').addEventListener('change', e => {
      wordFilterStatus = e.target.value;
      renderList();
    });
    container.querySelector('#selFilterPos').addEventListener('change', e => {
      wordFilterPos = e.target.value;
      renderList();
    });
    container.querySelector('#selFilterSrc').addEventListener('change', e => {
      wordFilterSrc = e.target.value;
      confirmingTopicDelete = false;
      renderWordsTab(container);
    });
    renderList();
  }

  function openModal(html) {
    const backdrop = document.getElementById('modalBackdrop');
    const content = document.getElementById('modalContent');
    content.innerHTML = html;
    backdrop.classList.add('open');
  }

  function closeModal() {
    const backdrop = document.getElementById('modalBackdrop');
    backdrop.classList.remove('open');
  }

  function openAddCodeModal() {
    openModal(`
      <h2 id="modalTitle" style="font-family:var(--font-fr); font-size:1.25rem;">Додати слова з коду</h2>
      <p style="font-size:0.85rem; color:var(--text-muted);">
        Вставте згенерований JSON-масив виразів. Підтримуються всі розширені поля: відмінювання (conj), тести контексту (context_quiz), приклади та теми.
      </p>
      <textarea id="inpCodeJson" class="textarea" rows="8" placeholder='[{"fr":"vivre dans la précarité","uk":"жити в скрутних умовах",...}]'></textarea>
      <div id="codeErrorMsg" style="color:var(--danger); font-size:0.85rem; display:none;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-top:6px;">
        <span style="font-size:0.75rem; color:var(--text-muted);">Слова збережуться у вашому акаунті на всіх пристроях</span>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn" id="btnModalCancel">Скасувати</button>
          <button type="button" class="btn btn-primary" id="btnModalSubmit">Імпортувати в мій словник</button>
        </div>
      </div>
    `);
    const ta = document.getElementById('inpCodeJson');
    const errEl = document.getElementById('codeErrorMsg');
    const submitBtn = document.getElementById('btnModalSubmit');
    document.getElementById('btnModalCancel').addEventListener('click', closeModal);

    submitBtn.addEventListener('click', async () => {
      errEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Збереження...';
      try {
        const arr = parseTolerantWordsJson(ta.value);
        if (!currentUser || !currentUser.email) {
          throw new Error('Користувач не авторизований. Будь ласка, увійдіть у свій акаунт.');
        }

        const inserted = await insertWordsBatchForEmail(currentUser.email, arr);

        inserted.forEach(row => {
          const norm = normalizeWordRow(row);
          const existingIdx = state.words.findIndex(w => w.id === norm.id || (w.dbId && w.dbId === norm.dbId));
          if (existingIdx > -1) {
            state.words[existingIdx] = Object.assign({}, norm, {
              iv: state.words[existingIdx].iv,
              ef: state.words[existingIdx].ef,
              r: state.words[existingIdx].r,
              l: state.words[existingIdx].l,
              due: state.words[existingIdx].due,
              t: state.words[existingIdx].t
            });
          } else {
            state.words.push(norm);
          }
        });

        saveLocalStats();
        updateNavBadge();
        closeModal();
        showToast(`✅ Успішно додано ${arr.length} слів до вашого словника!`);
        renderCurrentTab();
      } catch (err) {
        errEl.textContent = err.message || 'Помилка імпорту коду';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Імпортувати в мій словник';
      }
    });
  }
  
  function openWordFormModal(editWord = null, onSaved = null) {
    const isEdit = Boolean(editWord);
    openModal(`
      <h2 id="modalTitle" style="font-family:var(--font-fr); font-size:1.25rem;">${isEdit ? 'Редагувати вираз' : 'Додати вираз'}</h2>
      <div class="form-row"><label for="fFr">Слово або вираз (fr) *</label><input id="fFr" class="input" type="text" value="${escapeHtml(editWord ? editWord.fr : '')}"></div>
      <div class="form-row"><label for="fUk">Переклад українською (uk) *</label><input id="fUk" class="input" type="text" value="${escapeHtml(editWord ? editWord.uk : '')}"></div>
      <div class="form-row"><label for="fDef">Тлумачення французькою (def)</label><input id="fDef" class="input" type="text" value="${escapeHtml(editWord ? editWord.def : '')}"></div>
      <div class="form-row"><label for="fEx">Приклад (ex) — виділіть вираз у [квадратні дужки]</label><input id="fEx" class="input" type="text" value="${escapeHtml(editWord ? editWord.ex : '')}"></div>
      <div class="form-row"><label for="fSyn">Синоніми через кому (syn)</label><input id="fSyn" class="input" type="text" value="${escapeHtml(editWord && editWord.syn ? editWord.syn.join(', ') : '')}"></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"><div class="form-row"><label for="fPos">Частина мови (pos)</label><input id="fPos" class="input" type="text" value="${escapeHtml(editWord ? editWord.pos : '')}"></div><div class="form-row"><label for="fSrc">Тема (src)</label><input id="fSrc" class="input" type="text" value="${escapeHtml(editWord ? editWord.src : '')}"></div></div>
      <div id="wordFormErr" style="color:var(--danger); font-size:0.85rem; display:none;"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;"><button type="button" class="btn" id="btnModalCancel">Скасувати</button><button type="button" class="btn btn-primary" id="btnModalSave">Зберегти</button></div>
    `);
    document.getElementById('btnModalCancel').addEventListener('click', closeModal);
    document.getElementById('btnModalSave').addEventListener('click', async () => {
      const fr = document.getElementById('fFr').value.trim();
      const uk = document.getElementById('fUk').value.trim();
      const def = document.getElementById('fDef').value.trim();
      const ex = document.getElementById('fEx').value.trim();
      const syn = document.getElementById('fSyn').value.split(',').map(s => s.trim()).filter(Boolean);
      const pos = document.getElementById('fPos').value.trim();
      const src = document.getElementById('fSrc').value.trim() || 'Загальний';
      if (!fr || (!uk && !def)) {
        document.getElementById('wordFormErr').textContent = 'Заповніть французький вираз та переклад';
        document.getElementById('wordFormErr').style.display = 'block';
        return;
      }
      if (isEdit) {
        editWord.fr = fr; editWord.id = makeWordId(fr); editWord.uk = uk; editWord.def = def; editWord.ex = ex; editWord.syn = syn; editWord.pos = pos; editWord.src = src;
        const savedToCloud = await updateWordInCloud(editWord);
        closeModal();
        showToast(savedToCloud ? 'Вираз оновлено' : 'Змінено лише на цьому пристрої: не вдалося зберегти в хмарі');
        if (onSaved) onSaved(); else renderCurrentTab();
      } else {
        try {
          if (currentUser && currentUser.email) {
            const inserted = await insertWordsBatchForEmail(currentUser.email, [{ fr, uk, def, ex, syn, pos, src }]);
            inserted.forEach(r => state.words.push(normalizeWordRow(r)));
          } else {
            state.words.push(normalizeWordRow({ fr, uk, def, ex, syn, pos, src }));
          }
          saveLocalStats();
          updateNavBadge();
          closeModal();
          showToast('Вираз додано');
          renderCurrentTab();
        } catch (err) {
          document.getElementById('wordFormErr').textContent = err.message;
          document.getElementById('wordFormErr').style.display = 'block';
        }
      }
    });
  }

        </section>
        <section class="panel-card setting-group">
          <div class="section-label">Озвучення (Web Speech API)</div>
          ${speechSupported ? `
            <div class="setting-row">
              <div>
                <div style="font-weight:600;">Французький голос</div>
                <div style="font-size:0.8125rem; color:var(--text-muted);">Оберіть голос системи (Audrey, Amélie, Thomas тощо)</div>
              </div>
              <select id="selVoice" class="select" style="max-width:280px;"></select>
            </div>
            <div><button type="button" class="btn" id="btnTestSound">🔊 Перевірити обраний голос</button></div>
          ` : `<div style="color:var(--warning); font-size:0.9rem;">Ваш браузер не підтримує синтез мовлення.</div>`}
        </section>
        <p class="legal-note">${LEGAL_NOTE}</p>
      </div>`;
    refreshVoices();
    container.querySelector('#selTheme').addEventListener('change', e => { state.settings.theme = e.target.value; applyTheme(); saveLocalStats(); });
    container.querySelector('#selAutoNext').addEventListener('change', e => { state.settings.autoNext = e.target.value === 'on'; saveLocalStats(); });
    container.querySelectorAll('[data-accent-id]').forEach(btn => btn.addEventListener('click', () => {
      state.settings.accent = btn.dataset.accentId;
      applyAccent();
      saveLocalStats();
      container.querySelectorAll('[data-accent-id]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.accentId === state.settings.accent)));
    }));
    container.querySelector('#selNewLimit').addEventListener('change', e => { state.settings.newLimit = Number(e.target.value); saveLocalStats(); });
    if (speechSupported) {
      container.querySelector('#selVoice').addEventListener('change', e => { state.settings.voiceURI = e.target.value; saveLocalStats(); showToast('Голос озвучення збережено'); });
      container.querySelector('#btnTestSound').addEventListener('click', () => { speakFrench('Bonjour ! Bienvenue dans votre boîte à mots.', 1.0); });
    }
  }

  document.addEventListener('click', e => {
    const speakBtn = e.target.closest('.js-speak-btn');
    if (speakBtn) {
      e.preventDefault();
      e.stopPropagation();
      speakFrench(decodeURIComponent(speakBtn.dataset.speak || ''), 1.0);
    }
    if (e.target.id === 'modalBackdrop') closeModal();
  });

  document.querySelectorAll('.nav-tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
  /* Іконки малюються один раз при старті; бейдж «Слова» потім оновлює updateNavBadge() */
  (function paintStaticIcons() {
    const set = (id, name) => { const el = document.getElementById(id); if (el) el.innerHTML = icon(name); };
    set('navIcoStudy', 'navStudy');
    set('navIcoWords', 'navWords');
    set('navIcoSettings', 'navSettings');
    set('btnSignOut', 'signOut');
    syncThemeButton();
  })();
  document.getElementById('btnSignOut').addEventListener('click', () => signOut());
  document.getElementById('btnThemeToggle').addEventListener('click', cycleTheme);
  document.getElementById('btnModeUkFr').addEventListener('click', () => { state.settings.langMode = 'UK_FR'; saveLocalStats(); renderCurrentTab(); });
  document.getElementById('btnModeFrFr').addEventListener('click', () => { state.settings.langMode = 'FR_FR'; saveLocalStats(); renderCurrentTab(); });
</script>
</body>
</html>
