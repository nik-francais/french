      const lines = document.getElementById('inpListLines').value.split(/\r?\n/);
      const items = [];
      for (const line of lines) {
        const parts = line.split(/\s+[-–—]\s+|\s*[-–—]\s*/);
        if (parts.length >= 2) {
          const fr = parts[0].trim();
          const uk = parts.slice(1).join(' — ').trim();
          if (fr && uk) items.push({ fr, uk, src, added: todayStr() });
        }
      }
      if (items.length === 0) {
        showToast('Не знайдено рядків у форматі «вираз — переклад».');
        return;
      }
      const { addedCount, updatedCount } = upsertWords(items);
      closeModal();
      showToast(`Додано: ${addedCount}, оновлено: ${updatedCount}`);
      renderCurrentTab();
    });
  }

  /* =========================================================
   * 10. РЕЗЕРВНЕ КОПІЮВАННЯ (WB1z: / WB10:)
   * ========================================================= */
  function uint8ToBase64(bytes) {
    let binary = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function base64ToUint8(b64) {
    const binary = atob(b64.trim());
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  async function generateBackupCode() {
    const jsonStr = JSON.stringify(state);
    if (typeof CompressionStream !== 'undefined') {
      try {
        const enc = new TextEncoder().encode(jsonStr);
        const cs = new CompressionStream('gzip');
        const writer = cs.writable.getWriter();
        writer.write(enc);
        writer.close();
        const buf = await new Response(cs.readable).arrayBuffer();
        return 'WB1z:' + uint8ToBase64(new Uint8Array(buf));
      } catch (e) {}
    }
    const enc = new TextEncoder().encode(jsonStr);
    return 'WB10:' + uint8ToBase64(enc);
  }

  async function decodeBackupCode(codeStr) {
    const clean = String(codeStr || '').trim();
    if (clean.startsWith('WB1z:')) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('Ваш браузер не підтримує DecompressionStream.');
      }
      const bytes = base64ToUint8(clean.slice(5));
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const buf = await new Response(ds.readable).arrayBuffer();
      const json = new TextDecoder().decode(buf);
      return JSON.parse(json);
    } else if (clean.startsWith('WB10:')) {
      const bytes = base64ToUint8(clean.slice(5));
      const json = new TextDecoder().decode(bytes);
      return JSON.parse(json);
    } else {
      throw new Error('Код повинен починатися з WB1z: або WB10:.');
    }
  }

  function smartMergeBackup(incoming) {
    if (!incoming || !Array.isArray(incoming.words)) {
      throw new Error('Некоректна структура резервної копії.');
    }
    let added = 0;
    let merged = 0;

    for (const inc of incoming.words) {
      if (!inc || !inc.fr) continue;
      const normKey = stripFrenchArticles(inc.fr);
      const idKey = makeWordId(inc.fr);
      const local = state.words.find(w =>
        makeWordId(w.fr) === idKey || stripFrenchArticles(w.fr) === normKey
      );

      if (!local) {
        state.words.push(createWordRecord(inc));
        added++;
      } else {
        const incT = Number(inc.t || 0);
        const locT = Number(local.t || 0);
        if (incT > locT) {
          Object.assign(local, createWordRecord(inc));
          merged++;
        } else {
          if (!local.uk && inc.uk) local.uk = inc.uk;
          if (!local.def && inc.def) local.def = inc.def;
          if (!local.ex && inc.ex) local.ex = inc.ex;
        }
      }
    }

    if (incoming.stats) {
      state.stats.streak = Math.max(state.stats.streak || 0, incoming.stats.streak || 0);
      state.stats.blitzBest = Math.max(state.stats.blitzBest || 0, incoming.stats.blitzBest || 0);
    }
    if (incoming.settings) {
      state.settings = Object.assign({}, state.settings, incoming.settings);
      applyTheme();
    }

    saveState();
    return { added, merged };
  }

  /* =========================================================
   * 11. ВКЛАДКА «НАЛАШТУВАННЯ»
   * ========================================================= */
  function renderSettingsTab(container) {
    refreshVoices();
    container.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:16px;">
        <section class="panel-card setting-group">
          <div class="section-label">Навчання та інтерфейс</div>

          <div class="setting-row">
            <div>
              <div style="font-weight:600;">Ліміт нових слів на день</div>
              <div style="font-size:0.8125rem; color:var(--text-muted);">Черга формується від останніх уроків до ранніх</div>
            </div>
            <select id="selNewLimit" class="select" style="width:auto; min-width:110px;">
              ${[5, 10, 15, 20].map(n => `<option value="${n}" ${state.settings.newLimit === n ? 'selected' : ''}>${n} слів</option>`).join('')}
            </select>
          </div>

          <div class="setting-row">
            <div>
              <div style="font-weight:600;">Тема оформлення</div>
              <div style="font-size:0.8125rem; color:var(--text-muted);">Французький папір Séyès (світла) або нічний кабінет (темна)</div>
            </div>
            <select id="selTheme" class="select" style="width:auto; min-width:140px;">
              <option value="auto" ${state.settings.theme === 'auto' ? 'selected' : ''}>Системна</option>
              <option value="light" ${state.settings.theme === 'light' ? 'selected' : ''}>Світла</option>
              <option value="dark" ${state.settings.theme === 'dark' ? 'selected' : ''}>Темна</option>
            </select>
          </div>
        </section>

        <section class="panel-card setting-group">
          <div class="section-label">Озвучення (Web Speech API)</div>
          ${speechSupported ? `
            <div class="setting-row">
              <div>
                <div style="font-weight:600;">Французький голос (fr-FR / fr-CA)</div>
                <div style="font-size:0.8125rem; color:var(--text-muted);">Доступні голоси вашої операційної системи</div>
              </div>
              <select id="selVoice" class="select" style="max-width:260px;">
                <option value="">Автоматичний вибір (fr)</option>
                ${frenchVoices.map(v => `<option value="${escapeHtml(v.voiceURI)}" ${state.settings.voiceURI === v.voiceURI ? 'selected' : ''}>${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`).join('')}
              </select>
            </div>
            <div>
              <button type="button" class="btn" id="btnTestSound">Перевірити звук</button>
            </div>
          ` : `
            <div style="color:var(--warning); font-size:0.9rem;">
              Ваш браузер не підтримує Web Speech API.
            </div>
          `}
        </section>

        <section class="panel-card setting-group">
          <div class="section-label">Синхронізація та резервна копія</div>
          <p style="font-size:0.85rem; color:var(--text-muted);">
            Скопіюйте стиснений рядок (<code>WB1z:</code> або <code>WB10:</code>) для легкого перенесення прогресу між телефоном і ноутбуком.
          </p>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn-primary" id="btnGenBackup">Отримати код резервної копії</button>
            <button type="button" class="btn" id="btnCopyBackup">Скопіювати в буфер</button>
          </div>
          <textarea id="taBackupOut" class="textarea" rows="3" readonly placeholder="Натисніть «Отримати код резервної копії»…"></textarea>

          <hr class="study-divider">
          <div style="font-weight:600; font-size:0.95rem;">Відновити з коду (розумне об'єднання)</div>
          <textarea id="taBackupIn" class="textarea" rows="3" placeholder="Вставте код WB1z:... або WB10:..."></textarea>
          <div>
            <button type="button" class="btn btn-primary" id="btnRestoreBackup">Відновити з коду</button>
          </div>
        </section>
      </div>
    `;

    container.querySelector('#selNewLimit').addEventListener('change', e => {
      state.settings.newLimit = Number(e.target.value);
      saveState();
      showToast('Ліміт збережено');
    });

    container.querySelector('#selTheme').addEventListener('change', e => {
      state.settings.theme = e.target.value;
      applyTheme();
      saveState();
    });

    if (speechSupported) {
      const voiceSel = container.querySelector('#selVoice');
      if (voiceSel) {
        voiceSel.addEventListener('change', e => {
          state.settings.voiceURI = e.target.value;
          saveState();
        });
      }
      const testBtn = container.querySelector('#btnTestSound');
      if (testBtn) {
        testBtn.addEventListener('click', () => {
          speakFrench('Bonjour ! Bienvenue dans votre boîte à mots.', 1.0);
        });
      }
    }

    const outTa = container.querySelector('#taBackupOut');
    container.querySelector('#btnGenBackup').addEventListener('click', async () => {
      try {
        outTa.value = await generateBackupCode();
        showToast('Код бекапу згенеровано');
      } catch (e) {
        showToast('Помилка створення бекапу');
      }
    });

    container.querySelector('#btnCopyBackup').addEventListener('click', async () => {
      if (!outTa.value) {
        outTa.value = await generateBackupCode();
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(outTa.value);
          showToast('Код скопійовано в буфер');
        } else {
          outTa.focus();
          outTa.select();
          document.execCommand('copy');
          showToast('Код виділено та скопійовано');
        }
      } catch (e) {
        outTa.focus();
        outTa.select();
        showToast('Натисніть Ctrl+C / Cmd+C для копіювання');
      }
    });

    container.querySelector('#btnRestoreBackup').addEventListener('click', async () => {
      const raw = container.querySelector('#taBackupIn').value;
      try {
        const data = await decodeBackupCode(raw);
        const { added, merged } = smartMergeBackup(data);
        showToast(`Відновлено! Додано нових: ${added}, оновлено: ${merged}`);
        renderSettingsTab(container);
      } catch (err) {
        showToast(err.message || 'Не вдалося відновити дані');
      }
    });
  }

  /* =========================================================
   * 12. ГЛОБАЛЬНІ ПОДІЇ ТА СТАРТ
   * ========================================================= */
  document.addEventListener('click', e => {
    const speakBtn = e.target.closest('.js-speak-btn');
    if (speakBtn) {
      e.preventDefault();
      e.stopPropagation();
      const txt = decodeURIComponent(speakBtn.dataset.speak || '');
      speakFrench(txt, 1.0);
    }
    if (e.target.id === 'modalBackdrop') {
      closeModal();
    }
  });

  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  document.getElementById('btnModeUkFr').addEventListener('click', () => {
    state.settings.langMode = 'UK_FR';
    saveState();
    renderCurrentTab();
  });

  document.getElementById('btnModeFrFr').addEventListener('click', () => {
    state.settings.langMode = 'FR_FR';
    saveState();
    renderCurrentTab();
  });

  loadState();
  renderCurrentTab();
})();
</script>
