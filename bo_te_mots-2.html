<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boîte à Mots — Вивчення французьких слів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Французька палітра: верже, чорнило Waterman, бордо Gallimard та лініювання зошита Séyès */
  --bg-page: #f6f4ee;
  --bg-card: #fdfcf9;
  --bg-elevated: #ede9df;
  --bg-input: #ffffff;
  --text-main: #1f242e;
  --text-muted: #5c6473;
  --text-faint: #8a92a0;

  --accent: #1e3a5f;              /* Bleu d'encre (глибоке чорнило перової ручки) */
  --accent-hover: #152943;
  --accent-soft: #e5edf5;
  --border: #dcd7ca;
  --border-subtle: #eae5d8;

  --card-top-line: #9b2c2c;        /* Rouge Carmin (видавництво Gallimard) */
  --card-seyes-main: rgba(43, 90, 140, 0.045); /* Séyès grands carreaux */
  --card-margin-line: rgba(180, 60, 60, 0.16);  /* Ліве поле французького зошита */

  --danger: #9b2c2c;
  --danger-soft: #fbf0f0;
  --warning: #a36116;
  --warning-soft: #fbf3e6;
  --success: #286343;
  --success-soft: #edf6f0;

  --st-new: #6b778d;
  --st-learn: #a36116;
  --st-know: #2c5282;
  --st-master: #286343;

  --shadow: 0 3px 10px rgba(35, 30, 20, 0.05), 0 1px 3px rgba(35, 30, 20, 0.04);
  --radius: 6px;
  --font-ui: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-fr: 'Literata', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-page: #15171c;
    --bg-card: #1c1f26;
    --bg-elevated: #262a34;
    --bg-input: #171920;
    --text-main: #f0eee6;
    --text-muted: #9fa6b2;
    --text-faint: #6c7380;
    --accent: #7ca5d8;
    --accent-hover: #a3c4ed;
    --accent-soft: #1e2838;
    --border: #353a47;
    --border-subtle: #292d37;
    --card-top-line: #c94a4a;
    --card-seyes-main: rgba(255, 255, 255, 0.025);
    --card-margin-line: rgba(230, 90, 90, 0.22);
    --danger: #f87171;
    --danger-soft: #381a1a;
    --warning: #fbbf24;
    --warning-soft: #3a280c;
    --success: #4ade80;
    --success-soft: #123320;
    --st-new: #94a3b8;
    --st-learn: #fbbf24;
    --st-know: #7ca5d8;
    --st-master: #4ade80;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
}

:root[data-theme="dark"] {
  --bg-page: #15171c;
  --bg-card: #1c1f26;
  --bg-elevated: #262a34;
  --bg-input: #171920;
  --text-main: #f0eee6;
  --text-muted: #9fa6b2;
  --text-faint: #6c7380;
  --accent: #7ca5d8;
  --accent-hover: #a3c4ed;
  --accent-soft: #1e2838;
  --border: #353a47;
  --border-subtle: #292d37;
  --card-top-line: #c94a4a;
  --card-seyes-main: rgba(255, 255, 255, 0.025);
  --card-margin-line: rgba(230, 90, 90, 0.22);
  --danger: #f87171;
  --danger-soft: #381a1a;
  --warning: #fbbf24;
  --warning-soft: #3a280c;
  --success: #4ade80;
  --success-soft: #123320;
  --st-new: #94a3b8;
  --st-learn: #fbbf24;
  --st-know: #7ca5d8;
  --st-master: #4ade80;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

html, body {
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  background-color: var(--bg-page);
  color: var(--text-main);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px 54px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Повідомлення про інкогніто */
.storage-banner {
  background: var(--warning-soft);
  color: var(--warning);
  border: 1px solid var(--warning);
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 0.875rem;
  display: none;
}

/* Шапка */
.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.brand-title {
  font-family: var(--font-fr);
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-main);
}

.brand-sub {
  font-size: 0.75rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lang-switch {
  display: inline-flex;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2px;
}

.lang-switch button {
  min-height: 38px;
  padding: 0 12px;
  border: none;
  background: transparent;
  border-radius: calc(var(--radius) - 2px);
  font-size: 0.8125rem;
  font-family: var(--font-mono);
  font-weight: 600;
  cursor: pointer;
  color: var(--text-muted);
}

.lang-switch button.active {
  background: var(--bg-card);
  color: var(--accent);
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

/* Навігаційні вкладки */
.nav-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: var(--bg-elevated);
  padding: 4px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.nav-tab {
  min-height: 44px;
  border: none;
  background: transparent;
  border-radius: calc(var(--radius) - 2px);
  font-weight: 600;
  font-size: 0.9375rem;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background-color 0.15s, color 0.15s;
}

.nav-tab.active {
  background: var(--bg-card);
  color: var(--text-main);
  box-shadow: var(--shadow);
}

/* Естетика французького зошита Séyès */
.index-card {
  background-color: var(--bg-card);
  background-image:
    linear-gradient(90deg, transparent 42px, var(--card-margin-line) 42px, var(--card-margin-line) 43px, transparent 43px),
    repeating-linear-gradient(to bottom, transparent 0px, transparent 31px, var(--card-seyes-main) 31px, var(--card-seyes-main) 32px);
  border: 1px solid var(--border);
  border-top: 3px solid var(--card-top-line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 22px 22px 52px;
  position: relative;
}

@media (max-width: 480px) {
  .index-card {
    padding: 18px 16px 18px 20px;
    background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 31px, var(--card-seyes-main) 31px, var(--card-seyes-main) 32px);
  }
}

.panel-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
}

/* Кнопки */
.btn {
  min-height: 44px;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-main);
  font-weight: 500;
  font-size: 0.9375rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  transition: background-color 0.15s, border-color 0.15s;
}

.btn:hover:not(:disabled) {
  background: var(--bg-elevated);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  font-weight: 600;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn-danger {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: var(--danger);
}

.btn-sm {
  min-height: 38px;
  padding: 4px 10px;
  font-size: 0.8125rem;
}

.btn-icon {
  min-width: 42px;
  min-height: 42px;
  padding: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-main);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.btn-icon:hover {
  background: var(--bg-elevated);
  color: var(--accent);
}

svg.icon {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* Фокус на темі */
.topic-focus-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-elevated);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  font-size: 0.875rem;
}

.topic-focus-select {
  padding: 6px 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-weight: 600;
  color: var(--text-main);
  max-width: 250px;
}

/* Дашборд героя */
.hero-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.hero-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.due-counter {
  display: flex;
  flex-direction: column;
}

.due-label {
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-weight: 600;
}

.due-number {
  font-family: var(--font-mono);
  font-size: 2.6rem;
  font-weight: 700;
  line-height: 1.1;
  color: var(--accent);
}

.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
}

.stat-item {
  display: flex;
  flex-direction: column;
}

.stat-val {
  font-family: var(--font-mono);
  font-size: 1.15rem;
  font-weight: 600;
}

.stat-lbl {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Сегментний прогрес-бар */
.section-label {
  font-size: 0.8125rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.segment-bar {
  height: 12px;
  width: 100%;
  background: var(--bg-elevated);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}

.seg-part {
  height: 100%;
  transition: width 0.3s ease;
}

.segment-legend {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  font-size: 0.8125rem;
}

@media (min-width: 480px) {
  .segment-legend {
    grid-template-columns: repeat(4, 1fr);
  }
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.legend-count {
  font-family: var(--font-mono);
  font-weight: 600;
  margin-left: auto;
}

/* Графік прогнозу на 7 днів */
.forecast-chart {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  align-items: end;
  height: 110px;
  padding-top: 18px;
}

.forecast-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
  gap: 4px;
}

.forecast-val {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
}

.forecast-bar-wrap {
  width: 100%;
  max-width: 32px;
  flex: 1;
  display: flex;
  align-items: flex-end;
  background: var(--bg-elevated);
  border-radius: 4px;
  overflow: hidden;
}

.forecast-bar {
  width: 100%;
  background: var(--accent);
  border-radius: 4px 4px 0 0;
  min-height: 3px;
}

.forecast-day {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* Плитка режимів */
.modes-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

@media (min-width: 520px) {
  .modes-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.mode-tile {
  text-align: left;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: border-color 0.15s, transform 0.1s;
  min-height: 76px;
}

.mode-tile:hover:not(.disabled) {
  border-color: var(--accent);
}

.mode-tile.disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.mode-icon-box {
  width: 40px;
  height: 40px;
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.mode-title {
  font-weight: 600;
  font-size: 0.95rem;
  margin-bottom: 2px;
}

.mode-desc {
  font-size: 0.8125rem;
  color: var(--text-muted);
  line-height: 1.35;
}

/* Порожній стан */
.empty-state {
  text-align: center;
  padding: 38px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.empty-title {
  font-family: var(--font-fr);
  font-size: 1.45rem;
  font-weight: 600;
}

.empty-desc {
  color: var(--text-muted);
  max-width: 460px;
  font-size: 0.9375rem;
}

/* Вкладка «Слова» */
.words-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.filters-bar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

@media (min-width: 540px) {
  .filters-bar {
    grid-template-columns: 1.4fr 1fr 1fr;
  }
}

.input, .select, .textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-input);
  color: var(--text-main);
  font-size: 0.9375rem;
}

.textarea {
  min-height: 120px;
  resize: vertical;
  font-family: var(--font-mono);
  font-size: 0.85rem;
}

.word-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.word-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--st-new);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.word-item[data-status="learn"] { border-left-color: var(--st-learn); }
.word-item[data-status="know"] { border-left-color: var(--st-know); }
.word-item[data-status="master"] { border-left-color: var(--st-master); }

.word-item-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.word-fr-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 6px;
}

.word-fr {
  font-family: var(--font-fr);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-main);
}

.word-pos {
  font-family: var(--font-fr);
  font-size: 0.82rem;
  font-style: italic;
  color: var(--text-muted);
}

.word-badges-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 2px;
}

.badge {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--bg-elevated);
  color: var(--text-muted);
}

.word-meaning {
  font-size: 0.98rem;
  color: var(--accent);
  font-weight: 600;
}

.word-item-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-subtle);
  font-size: 0.78rem;
  color: var(--text-muted);
}

.inline-confirm {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Навчальні екрани */
.session-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.session-progress {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-muted);
}

.study-word-title {
  font-family: var(--font-fr);
  font-size: 1.95rem;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 4px;
}

.study-pos {
  font-family: var(--font-fr);
  font-size: 0.88rem;
  color: var(--text-muted);
  font-style: italic;
  margin-bottom: 16px;
}

.study-divider {
  border: none;
  border-top: 1px dashed var(--border);
  margin: 16px 0;
}

.study-meaning {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
}

.study-def {
  font-family: var(--font-fr);
  font-size: 0.98rem;
  line-height: 1.5;
  color: var(--text-muted);
  margin-bottom: 12px;
  padding-left: 10px;
  border-left: 2px solid var(--border);
}

.study-example {
  font-family: var(--font-fr);
  font-size: 1.05rem;
  line-height: 1.45;
  padding: 12px 14px;
  background: var(--bg-elevated);
  border-left: 3px solid var(--card-top-line);
  border-radius: 4px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.hl-word {
  color: var(--card-top-line);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.grade-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 16px;
}

@media (min-width: 480px) {
  .grade-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.grade-btn {
  min-height: 54px;
  padding: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.grade-btn:hover {
  border-color: var(--accent);
  background: var(--bg-elevated);
}

.grade-btn .g-name {
  font-weight: 600;
  font-size: 0.9rem;
}

.grade-btn .g-time {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
}

.grade-again { border-bottom: 3px solid var(--danger); }
.grade-hard { border-bottom: 3px solid var(--warning); }
.grade-good { border-bottom: 3px solid var(--accent); }
.grade-easy { border-bottom: 3px solid var(--success); }

/* Опції (Вибір, Контекст, Синоніми) */
.options-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.option-btn {
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid var(--border);

  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.95rem;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--accent);
}

.option-key {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: var(--bg-elevated);

  align-items: center;
  justify-content: center;

.option-btn.correct {
  border-color: var(--success);

}

.option-btn.wrong {
  border-color: var(--danger);

}

/* Напиши: Чіткі пробіли між словами */
.template-mask {

  font-size: 1.35rem;

  color: var(--accent);

  display: flex;
  flex-wrap: wrap;

  align-items: center;
}

.template-word {
  display: inline-flex;
  gap: 5px;
  white-space: nowrap;
}

.feedback-box {
  margin-top: 12px;
  padding: 12px;
  border-radius: var(--radius);
  font-size: 0.9375rem;
}

.feedback-box.ok { background: var(--success-soft); color: var(--success); border: 1px solid var(--success); }
.feedback-box.almost { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); }
.feedback-box.err { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }

/* Пари */
.pairs-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.pair-card {
  min-height: 52px;

  background: var(--bg-card);

  font-size: 0.9rem;

  align-items: center;
  justify-content: center;
  text-align: center;
  word-break: break-word;
}

.pair-card.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.pair-card.matched {
  opacity: 0.35;
  pointer-events: none;
  border-color: var(--success);
}

/* Анаграма */
.anagram-slots, .anagram-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
  min-height: 48px;
}

.letter-tile {
  min-width: 44px;
  min-height: 44px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card);
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.letter-tile.used {
  opacity: 0.3;
  pointer-events: none;
}

/* Кросворд */
.cw-wrapper {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}

.cw-grid {
  display: grid;
  gap: 2px;
  background: var(--border);
  padding: 3px;
  border-radius: 6px;
  max-width: 100%;
  overflow-x: auto;
}

.cw-cell {
  width: clamp(26px, 7.2vw, 38px);
  height: clamp(26px, 7.2vw, 38px);
  position: relative;
  background: var(--bg-elevated);
}

.cw-cell.empty {
  background: transparent;
}

.cw-cell input {
  width: 100%;
  height: 100%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  text-align: center;

  font-size: 0.95rem;

}

.cw-cell input.cw-ok {
  background: var(--success-soft);
  color: var(--success);
}

.cw-cell input.cw-err {

  color: var(--danger);
}

.cw-num {
  position: absolute;
  top: 1px;
  left: 2px;
  font-size: 9px;
  font-family: var(--font-mono);

  pointer-events: none;
  line-height: 1;
}

.cw-clues {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  font-size: 0.875rem;
}

@media (min-width: 540px) {
  .cw-clues {
    grid-template-columns: 1fr 1fr;
  }
}

.cw-clue-item {

.cw-clue-item:hover {

/* Модальне вікно */
.modal-backdrop {

  inset: 0;
  background: rgba(0, 0, 0, 0.55);

.mark-ok { color: var(--success); font-family: var(--font-mono); font-weight: 700; }

<div class="app-shell">
  <div id="storageBanner" class="storage-banner" role="status">
    Локальне сховище браузера недоступне (можливо, суворий режим інкогніто). Застосунок працює в пам'яті сесії. Використовуйте резервний код для збереження.
  </div>

  <header class="app-header">
    <div class="brand">
      <h1 class="brand-title">Boîte à Mots</h1>
      <span class="brand-sub">fait par nik.peredela</span>
    </div>
    <div class="header-controls">
      <div class="lang-switch" role="group" aria-label="Режим підказок">
        <button type="button" id="btnModeUkFr" class="active">UK + FR</button>
        <button type="button" id="btnModeFrFr">FR + FR</button>
      </div>
    </div>
  </header>

  <nav class="nav-tabs" aria-label="Головна навігація">
    <button type="button" class="nav-tab active" data-tab="study">Вчити</button>
    <button type="button" class="nav-tab" data-tab="words">Слова <span id="navWordCount" class="badge">0</span></button>
    <button type="button" class="nav-tab" data-tab="settings">Налаштування</button>
  </nav>

  <main id="mainView"></main>
</div>

<!-- Модальне вікно -->
<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div id="modalContent" class="modal-box"></div>
</div>

<!-- Тости -->
<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script>
(function() {
  'use strict';

  /* =========================================================
   * 1. СХОВИЩЕ ТА СТАН ЗАСТОСУНКУ
   * ========================================================= */
  const STORAGE_KEY = 'bam_app_data_v1';
  let memoryFallback = false;

  const defaultState = () => ({
    words: [],
    settings: {
      langMode: 'UK_FR',     // 'UK_FR' | 'FR_FR'
      newLimit: 10,          // 5 | 10 | 15 | 20
      voiceURI: '',
      theme: 'auto',         // 'auto' | 'light' | 'dark'
      focusTopic: 'all'      // 'all' або конкретна назва теми (src)
    },
    stats: {
      streak: 0,
      lastStudyDate: '',
      dailyDate: todayStr(),
      answersToday: 0,
      newLearnedToday: 0,
      blitzBest: 0
    }
  });

  let state = defaultState();

  function todayStr(ts = Date.now()) {
    const d = new Date(ts);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function loadState() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = {
          words: Array.isArray(parsed.words) ? parsed.words : [],
          settings: Object.assign(defaultState().settings, parsed.settings || {}),
          stats: Object.assign(defaultState().stats, parsed.stats || {})
        };
      }
    } catch (e) {
      memoryFallback = true;
      const banner = document.getElementById('storageBanner');
      if (banner) banner.style.display = 'block';
    }
    checkDailyRollover();
    applyTheme();
  }

  function saveState() {
    checkDailyRollover();
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      memoryFallback = true;
      const banner = document.getElementById('storageBanner');
      if (banner) banner.style.display = 'block';
    }
    updateNavBadge();
  }

  function checkDailyRollover() {
    const today = todayStr();
    if (state.stats.dailyDate !== today) {
      state.stats.dailyDate = today;
      state.stats.answersToday = 0;
      state.stats.newLearnedToday = 0;
    }
  }

  function recordDailyActivity(wasNewWord) {
    checkDailyRollover();
    const today = todayStr();
    state.stats.answersToday += 1;
    if (wasNewWord) {
      state.stats.newLearnedToday += 1;
    }
    if (state.stats.lastStudyDate !== today) {
      const yesterday = todayStr(Date.now() - 86400000);
      if (state.stats.lastStudyDate === yesterday) {
        state.stats.streak += 1;
      } else {
        state.stats.streak = 1;
      }
      state.stats.lastStudyDate = today;
    }
  }

  function applyTheme() {
    const root = document.documentElement;
    if (state.settings.theme === 'light' || state.settings.theme === 'dark') {
      root.setAttribute('data-theme', state.settings.theme);
    } else {
      root.removeAttribute('data-theme');
    }
  }

  function showToast(msg, duration = 3800) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, duration);
  }

  /* =========================================================
   * 2. НОРМАЛІЗАЦІЯ СЛІВ
   * ========================================================= */
  function makeWordId(frText) {
    return String(frText || '')
      .trim()
      .toLowerCase()
      .replace(/[^a-zàâäéèêëîïôöùûüÿçœæ]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'mot';
  }

  function stripFrenchArticles(frText) {
    let s = String(frText || '').trim().toLowerCase();
    s = s.replace(/[’‘]/g, "'");
    const prefixes = ['un ', 'une ', 'le ', 'la ', 'les ', "l'", "d'", 'se ', "s'"];
    let changed = true;
    while (changed) {
      changed = false;
      for (const p of prefixes) {
        if (s.startsWith(p)) {
          s = s.slice(p.length).trim();
          changed = true;
          break;
        }
      }
    }
    return makeWordId(s);
  }

  function stripDiacritics(str) {
    return String(str || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/œ/g, 'oe')
      .replace(/æ/g, 'ae');
  }

  function createWordRecord(raw) {
    const fr = String(raw.fr || '').trim();
    const uk = String(raw.uk || '').trim();
    const def = String(raw.def || '').trim();
    const ex = String(raw.ex || '').trim();
    const syn = Array.isArray(raw.syn)
      ? raw.syn.map(s => String(s).trim()).filter(Boolean)
      : (typeof raw.syn === 'string' ? raw.syn.split(',').map(s => s.trim()).filter(Boolean) : []);
    const pos = String(raw.pos || '').trim();
    const src = String(raw.src || 'Загальний').trim();
    const added = /^\d{4}-\d{2}-\d{2}$/.test(String(raw.added || '')) ? raw.added : todayStr();

    return {
      id: makeWordId(fr),
      fr,
      uk,
      def,
      ex,
      syn,
      pos,
      src,
      added,
      iv: typeof raw.iv === 'number' ? raw.iv : 0,
      ef: typeof raw.ef === 'number' ? raw.ef : 2.5,
      r: typeof raw.r === 'number' ? raw.r : 0,
      l: typeof raw.l === 'number' ? raw.l : 0,
      due: typeof raw.due === 'number' ? raw.due : 0,
      t: typeof raw.t === 'number' ? raw.t : 0
    };
  }

  function upsertWords(rawList) {
    let addedCount = 0;
    let updatedCount = 0;

    for (const item of rawList) {
      if (!item || typeof item !== 'object') continue;
      const fr = String(item.fr || '').trim();
      const uk = String(item.uk || '').trim();
      const def = String(item.def || '').trim();
      if (!fr || (!uk && !def)) continue;

      const normKey = stripFrenchArticles(fr);
      const idKey = makeWordId(fr);
      const existing = state.words.find(w =>
        makeWordId(w.fr) === idKey || stripFrenchArticles(w.fr) === normKey
      );

      if (existing) {
        existing.fr = fr;
        existing.id = makeWordId(fr);
        if (uk) existing.uk = uk;
        if (def) existing.def = def;
        if (item.ex !== undefined) existing.ex = String(item.ex || '').trim();
        if (item.syn !== undefined) {
          existing.syn = Array.isArray(item.syn)
            ? item.syn.map(s => String(s).trim()).filter(Boolean)
            : String(item.syn || '').split(',').map(s => s.trim()).filter(Boolean);
        }
        if (item.pos !== undefined) existing.pos = String(item.pos || '').trim();
        if (item.src !== undefined) existing.src = String(item.src || '').trim();
        if (item.added !== undefined && /^\d{4}-\d{2}-\d{2}$/.test(item.added)) {
          existing.added = item.added;
        }
        updatedCount++;
      } else {
        state.words.push(createWordRecord(item));
        addedCount++;
      }
    }

    saveState();
    return { addedCount, updatedCount };
  }

  function getPromptText(word) {
    if (state.settings.langMode === 'FR_FR') {
      return word.def || word.uk || '—';
    }
    return word.uk || word.def || '—';
  }

  /* =========================================================
   * 3. SM-2 ТА ФОКУС-ПУЛ
   * ========================================================= */
  const DAY_MS = 86400000;
  const MIN_MS = 60000;

  function getActiveWordsPool() {
    if (!state.settings.focusTopic || state.settings.focusTopic === 'all') {
      return state.words;
    }
    return state.words.filter(w => w.src === state.settings.focusTopic);
  }

  function getWordStatus(word) {
    if (!word.r || word.r === 0) return 'new';
    if (word.iv < 7) return 'learn';
    if (word.iv < 30) return 'know';
    return 'master';
  }

  function getStatusLabel(status) {
    switch (status) {
      case 'new': return 'Нове';
      case 'learn': return 'Вчу';
      case 'know': return 'Знаю';
      case 'master': return 'Засвоєно';
      default: return 'Нове';
    }
  }

  function previewNextInterval(word, grade) {
    const isInitial = (word.r === 0 || word.iv < 1);
    let ivDays = 0;
    if (grade === 'again') {
      return { iv: 0, ms: 10 * MIN_MS, label: '10 хв' };
    }
    if (isInitial) {
      if (grade === 'hard') return { iv: 0.5, ms: 12 * 60 * MIN_MS, label: '12 год' };
      if (grade === 'good') return { iv: 1, ms: DAY_MS, label: '1 дн' };
      if (grade === 'easy') return { iv: 3, ms: 3 * DAY_MS, label: '3 дн' };
    } else {
      const ef = word.ef || 2.5;
      if (grade === 'hard') ivDays = Math.min(365, word.iv * 1.2);
      if (grade === 'good') ivDays = Math.min(365, word.iv * ef);
      if (grade === 'easy') ivDays = Math.min(365, word.iv * ef * 1.3);
      ivDays = Math.max(1, Math.round(ivDays * 10) / 10);
      const rounded = Math.round(ivDays);
      return { iv: ivDays, ms: ivDays * DAY_MS, label: `${rounded} дн` };
    }
  }

  function applySM2Grade(word, grade) {
    const now = Date.now();
    const wasNew = (word.r === 0);
    const isInitial = (word.r === 0 || word.iv < 1);
    let ef = word.ef || 2.5;
    let iv = word.iv || 0;

    if (grade === 'again') {
      iv = 0;
      ef = Math.max(1.3, ef - 0.2);
      word.l = (word.l || 0) + 1;
      word.due = now + 10 * MIN_MS;
    } else if (isInitial) {
      if (grade === 'hard') {
        iv = 0.5;
        word.due = now + 12 * 60 * MIN_MS;
      } else if (grade === 'good') {
        iv = 1;
        word.due = now + DAY_MS;
      } else if (grade === 'easy') {
        iv = 3;
        ef = Math.min(3.2, ef + 0.15);
        word.due = now + 3 * DAY_MS;
      }
    } else {
      if (grade === 'hard') {
        iv = Math.min(365, iv * 1.2);
        ef = Math.max(1.3, ef - 0.15);
      } else if (grade === 'good') {
        iv = Math.min(365, iv * ef);
      } else if (grade === 'easy') {
        iv = Math.min(365, iv * ef * 1.3);
        ef = Math.min(3.2, ef + 0.15);
      }
      iv = Math.round(iv * 100) / 100;
      word.due = now + iv * DAY_MS;
    }

    word.iv = iv;
    word.ef = Math.round(ef * 100) / 100;
    word.r = (word.r || 0) + 1;
    word.t = now;

    recordDailyActivity(wasNew);
    saveState();
  }

  function handleMiniGameResult(word, isCorrect) {
    const now = Date.now();
    if (!isCorrect) {
      applySM2Grade(word, 'again');
    } else {
      if (word.r === 0 || word.due <= now) {
        applySM2Grade(word, 'good');
      } else {
        recordDailyActivity(false);
        saveState();
      }
    }
  }

  function getDueAndNewQueues() {
    checkDailyRollover();
    const pool = getActiveWordsPool();
    const now = Date.now();
    const dueReview = pool
      .filter(w => w.r > 0 && w.due <= now)
      .sort((a, b) => a.due - b.due);

    const remainingNewAllowance = Math.max(0, state.settings.newLimit - state.stats.newLearnedToday);
    const newPool = pool
      .filter(w => w.r === 0)
      .sort((a, b) => String(b.added || '').localeCompare(String(a.added || '')));

    const newToday = newPool.slice(0, remainingNewAllowance);
    return {
      dueReview,
      newToday,
      combined: [...dueReview, ...newToday],
      totalNewAvailable: newPool.length
    };
  }

  /* =========================================================
   * 4. ОЗВУЧЕННЯ (WEB SPEECH API)
   * ========================================================= */
  const speechSupported = ('speechSynthesis' in window);
  let frenchVoices = [];
  let activeUtterances = []; // Захист від збирання сміття (Garbage Collection)

  function refreshVoices() {
    if (!speechSupported) return;
    const voices = window.speechSynthesis.getVoices();
    // Фільтруємо лише французькі голоси (fr-FR, fr-CA, fr-CH тощо)
    frenchVoices = voices.filter(v => /^fr(-|_|$)/i.test(v.lang));
    
    const sel = document.getElementById('selVoice');
    if (sel) {
      const currentVal = state.settings.voiceURI;
      sel.innerHTML = '<option value="">Автоматичний вибір (fr)</option>' +
        frenchVoices.map(v => `<option value="${escapeHtml(v.voiceURI)}" ${currentVal === v.voiceURI ? 'selected' : ''}>${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`).join('');
    }
  }

  if (speechSupported) {
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }

  function speakFrench(text, rate = 1.0) {
    if (!speechSupported) return;
    const cleanText = String(text || '').replace(/\[|\]/g, '').trim();
    if (!cleanText) return;

    // Зупиняємо попереднє озвучення
    window.speechSynthesis.cancel();

    // Пауза 85мс потрібна для деяких браузерів (Safari/Chrome), щоб уникнути обривів
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = 'fr-FR';
      u.rate = rate;

      if (state.settings.voiceURI) {
        const chosen = frenchVoices.find(v => v.voiceURI === state.settings.voiceURI);
        if (chosen) u.voice = chosen;
      } else if (frenchVoices.length > 0) {
        // Якщо голос не обрано, намагаємось автоматично знайти найкращий (Premium/Enhanced)
        const premium = frenchVoices.find(v => v.name.includes('Premium') || v.name.includes('Enhanced'));
        u.voice = premium || frenchVoices[0];
      }

      // Додаємо в масив, щоб уникнути передчасного видалення об'єкта браузером
      activeUtterances.push(u);
      
      u.onend = () => {
        const idx = activeUtterances.indexOf(u);
        if (idx > -1) activeUtterances.splice(idx, 1);
      };
      
      u.onerror = (e) => {
        console.error("Speech error", e);
        const idx = activeUtterances.indexOf(u);
        if (idx > -1) activeUtterances.splice(idx, 1);
      };

      window.speechSynthesis.speak(u);
    }, 85);
  }

  function speakerBtnHtml(text, label = 'Озвучити') {
    if (!speechSupported) return '';
    const encoded = encodeURIComponent(String(text || '').replace(/\[|\]/g, ''));
    return `<button type="button" class="btn-icon js-speak-btn" data-speak="${encoded}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">
      <svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
    </button>`;
  }

  /* =========================================================
   * 5. ДОПОМІЖНІ ФУНКЦІЇ ТА РЕЖИМИ
   * ========================================================= */
  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function highlightBracketExample(ex, wordFr) {
    if (!ex) return '';
    const safe = escapeHtml(ex);
    if (/\[.+?\]/.test(safe)) {
      return safe.replace(/\[(.+?)\]/g, '<span class="hl-word">$1</span>');
    }
    return safe;
  }

  function maskBracketExample(ex, wordFr) {
    if (!ex) return '…';
    const safe = escapeHtml(ex);
    if (/\[.+?\]/.test(safe)) {
      return safe.replace(/\[(.+?)\]/g, '<span class="hl-word">[ … ]</span>');
    }
    const re = new RegExp(escapeHtml(wordFr).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
    if (re.test(safe)) {
      return safe.replace(re, '<span class="hl-word">[ … ]</span>');
    }
    return safe + ' <span class="hl-word">[ … ]</span>';
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickStudyWords(count = 10, filterFn = null) {
    const basePool = getActiveWordsPool();
    const pool = filterFn ? basePool.filter(filterFn) : basePool.slice();
    const now = Date.now();
    const due = shuffle(pool.filter(w => w.r > 0 && w.due <= now));
    const fresh = pool.filter(w => w.r === 0).sort((a, b) => String(b.added).localeCompare(String(a.added)));
    const rest = shuffle(pool.filter(w => w.r > 0 && w.due > now));
    return [...due, ...fresh, ...rest].slice(0, count);
  }

  function formatDueDate(word) {
    if (!word.r || word.r === 0) return '';
    const diff = word.due - Date.now();
    if (diff <= 0) return 'Сьогодні';
    const hours = Math.ceil(diff / (3600 * 1000));
    if (hours < 24) return `Через ${hours} год`;
    const days = Math.ceil(diff / DAY_MS);
    return `Через ${days} дн`;
  }

    // Прогноз повторень
    const daysForecast = [];
    const dayNames = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const startOfToday = new Date();
    startOfToday.setHours(0, 0, 0, 0);
    const baseMs = startOfToday.getTime();

    for (let d = 0; d < 7; d++) {
      const start = baseMs + d * DAY_MS;
      const end = start + DAY_MS;
      let cnt = 0;
      pool.forEach(w => {
        if (w.r > 0) {
          if (d === 0 && w.due <= end) cnt++;
          else if (d > 0 && w.due > start && w.due <= end) cnt++;
        }
      });
      const dt = new Date(start);
      daysForecast.push({
        label: d === 0 ? 'Сьог' : dayNames[dt.getDay()],
        count: cnt
      });

    const maxForecast = Math.max(1, ...daysForecast.map(f => f.count));

    container.innerHTML = `
      <div class="hero-grid">

            }).join('')}

        </div>

        <section class="index-card">
          <div class="hero-top">
            <div class="due-counter">
              <span class="due-label">До повторення сьогодні</span>
              <span class="due-number">${dueTotal}</span>
            </div>
            <button type="button" class="btn btn-primary" id="btnMainReview" style="min-width:170px; font-size:1.05rem;">
              Повторити
            </button>
          </div>
          <div class="hero-stats">
            <div class="stat-item">
              <span class="stat-val">${queues.newToday.length} / ${state.settings.newLimit}</span>
              <span class="stat-lbl">Нових на сьогодні</span>
            </div>
            <div class="stat-item">
              <span class="stat-val">${state.stats.streak} дн</span>
              <span class="stat-lbl">Серія поспіль</span>
            </div>
            <div class="stat-item">
              <span class="stat-val">${state.stats.answersToday}</span>
              <span class="stat-lbl">Відповідей за день</span>

          <div class="section-label">Словниковий запас (${pool.length})</div>

            <div class="seg-part" style="width:${(counts.learn / total) * 100}%; background:var(--st-learn);"></div>
            <div class="seg-part" style="width:${(counts.know / total) * 100}%; background:var(--st-know);"></div>
            <div class="seg-part" style="width:${(counts.master / total) * 100}%; background:var(--st-master);"></div>

          <div class="segment-legend">
            <div class="legend-item"><span class="legend-dot" style="background:var(--st-new);"></span><span>Нові</span><span class="legend-count">${counts.new}</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--st-learn);"></span><span>Вчу</span><span class="legend-count">${counts.learn}</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--st-know);"></span><span>Знаю</span><span class="legend-count">${counts.know}</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--st-master);"></span><span>Засвоєно</span><span class="legend-count">${counts.master}</span></div>

                <div class="forecast-col">
                  <span class="forecast-val">${f.count}</span>
                  <div class="forecast-bar-wrap">
                    <div class="forecast-bar" style="height:${f.count > 0 ? Math.max(8, h) : 0}%;"></div>

  /* =========================================================
   * 8. ЗАПУСК РЕЖИМІВ
   * ========================================================= */
  function startMode(modeId) {
    cleanupSession();
    const main = document.getElementById('mainView');
    if (!main) return;

    const meta = MODES_META.find(m => m.id === modeId);
    if (!meta) return;

    const pool = getActiveWordsPool();
    const topicLabel = state.settings.focusTopic !== 'all' ? ` (тема «${state.settings.focusTopic}»)` : '';

    if (modeId === 'synonyms') {
      const withSyn = pool.filter(w => Array.isArray(w.syn) && w.syn.length > 0);
      if (withSyn.length < 1 || pool.length < 4) {
        renderInsufficientWords(main, meta.name, Math.max(1 - withSyn.length, 4 - pool.length),
          `Для режиму «Синоніми» потрібно щонайменше 4 слова у словнику${topicLabel} та принаймні 1 слово із синонімами (syn).`);
        return;
      }
    } else if (modeId === 'context') {
      const withEx = pool.filter(w => Boolean(w.ex && w.ex.trim()));
      if (withEx.length < 1 || pool.length < 4) {
        renderInsufficientWords(main, meta.name, Math.max(1 - withEx.length, 4 - pool.length),
          `Для режиму «У контексті» потрібно щонайменше 4 слова у словнику${topicLabel} та принаймні 1 слово із прикладом (ex).`);
        return;
      }
    } else if (pool.length < meta.min) {
      renderInsufficientWords(main, meta.name, meta.min - pool.length,
        `Для старту режиму «${meta.name}» потрібно щонайменше ${meta.min} сл.${topicLabel}`);
      return;
    }

    switch (modeId) {
      case 'cards': runCardsMode(main); break;
      case 'choice': runChoiceMode(main); break;
      case 'write': runWriteMode(main); break;
      case 'dictation': runDictationMode(main); break;
      case 'context': runContextMode(main); break;
      case 'synonyms': runSynonymsMode(main); break;
      case 'pairs': runPairsMode(main); break;
      case 'blitz': runBlitzMode(main); break;
      case 'crossword': runCrosswordMode(main); break;
      case 'anagram': runAnagramMode(main); break;
    }
  }

              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                ${speakerBtnHtml(r.word.fr, 'Озвучити слово')}

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
          <button type="button" class="btn btn-primary" id="btnSummaryAgain">Ще раунд</button>
          <button type="button" class="btn" id="btnSummaryBack">До режимів</button>
        </div>
      </section>
    `;
    container.querySelector('#btnSummaryAgain').addEventListener('click', () => startMode(modeId));
    container.querySelector('#btnSummaryBack').addEventListener('click', () => renderCurrentTab());

  /* =========================================================
   * РЕЖИМ 1: КАРТКИ
   * ========================================================= */
  function runCardsMode(container, forceRandom = false) {
    const queues = getDueAndNewQueues();
    let deck = queues.combined.slice();

    if (deck.length === 0 && !forceRandom) {
      container.innerHTML = `
        <section class="index-card empty-state">
          <h2 class="empty-title">Усі заплановані слова на сьогодні повторено</h2>
          <p class="empty-desc">Ви можете закріпити 10 випадкових слів або обрати інший тренувальний режим.</p>
          <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
            <button type="button" class="btn btn-primary" id="btnRandom10">Закріпити 10 випадкових</button>
            <button type="button" class="btn" id="btnBackModes">До режимів</button>
          </div>
        </section>
      `;
      container.querySelector('#btnRandom10').addEventListener('click', () => runCardsMode(container, true));
      container.querySelector('#btnBackModes').addEventListener('click', () => renderCurrentTab());
      return;
    }

    if (forceRandom) {
      deck = shuffle(getActiveWordsPool()).slice(0, 10);
    }

    const totalInitial = deck.length;
    let completedCount = 0;
    let revealed = false;
    const summaryMap = new Map();

    function renderCard() {
      if (deck.length === 0) {
        renderRoundSummary(container, 'cards', Array.from(summaryMap.values()));
        return;
      }
      const word = deck[0];
      const pAgain = previewNextInterval(word, 'again');
      const pHard = previewNextInterval(word, 'hard');
      const pGood = previewNextInterval(word, 'good');
      const pEasy = previewNextInterval(word, 'easy');

      const showBothUkAndDef = (state.settings.langMode === 'UK_FR' && word.uk && word.def);

      container.innerHTML = `
        <div class="session-header">
          <button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button>
          <span class="session-progress">Картки · ${Math.min(completedCount + 1, totalInitial)} / ${totalInitial} (у черзі: ${deck.length})</span>
        </div>

    function gradeCurrent(grade) {
      const word = deck.shift();
      if (!word) return;
      applySM2Grade(word, grade);
      if (!summaryMap.has(word.id)) {
        summaryMap.set(word.id, { word, ok: grade !== 'again' });

      if (grade === 'again') {

    renderCard();

  /* =========================================================
   * РЕЖИМ 3: НАПИШИ (Із чіткими пробілами між словами)
   * ========================================================= */
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }

  function evaluateWrittenAnswer(inputRaw, targetRaw) {
    const inp = String(inputRaw || '').trim().toLowerCase();
    const tgt = String(targetRaw || '').trim().toLowerCase();
    if (!inp) return 'wrong';
    if (inp === tgt) return 'exact';
    if (stripDiacritics(inp) === stripDiacritics(tgt)) return 'almost';
    if (tgt.length >= 3 && levenshtein(inp, tgt) === 1) return 'almost';
    return 'wrong';
  }

  function buildMaskTemplate(fr, revealedCount) {
    let seenLetters = 0;
    const words = String(fr || '').trim().split(/\s+/);
    return words.map(w => {
      const chars = Array.from(w).map(ch => {
        if (ch === '-' || ch === "'" || ch === '’') return `<span>${escapeHtml(ch)}</span>`;
        seenLetters++;
        const display = seenLetters <= revealedCount ? escapeHtml(ch) : '_';
        return `<span>${display}</span>`;
      }).join('');
      return `<span class="template-word">${chars}</span>`;
    }).join('');
  }

                else if (opt === chosenVal) cls = 'wrong';
              }
              return `
                <button type="button" class="option-btn ${cls}" data-syn="${escapeHtml(opt)}" ${answered ? 'disabled' : ''}>
                  <span class="option-key">${i + 1}</span>
                  <span style="font-family:var(--font-fr); font-weight:600;">${escapeHtml(opt)}</span>
                </button>
              `;
            }).join('')}
          </div>
          ${answered ? `
            <div style="margin-top:14px; display:flex; justify-content:flex-end;">
              <button type="button" class="btn btn-primary" id="btnNextSyn">Далі (Enter)</button>
            </div>
          ` : ''}
        </section>
      `;

      container.querySelector('#btnExitMode').addEventListener('click', () => renderCurrentTab());
      container.querySelectorAll('[data-syn]').forEach(btn => {
        btn.addEventListener('click', () => selectSyn(btn.dataset.syn));
      });
      const nextBtn = container.querySelector('#btnNextSyn');
      if (nextBtn) nextBtn.addEventListener('click', nextStep);
    }

    function selectSyn(val) {
      if (answered) return;
      answered = true;
      const word = questions[idx];
      const isOk = (val === targetSyn);
      handleMiniGameResult(word, isOk);
      results.push({ word, ok: isOk });
      renderSyn(word, val);
    }

    function nextStep() {
      if (!answered) return;
      idx++;
      if (idx >= questions.length) {
        renderRoundSummary(container, 'synonyms', results);
      } else {
        setupSyn();
      }
    }

    function onKey(e) {
      if (!answered && ['1', '2', '3', '4'].includes(e.key)) {
        const val = currentOptions[Number(e.key) - 1];
        if (val !== undefined) selectSyn(val);
      } else if (answered && e.key === 'Enter') {
        e.preventDefault();
        nextStep();
      }
    }

    window.addEventListener('keydown', onKey);
    activeSessionCleanup = () => window.removeEventListener('keydown', onKey);
    setupSyn();
  }

  /* =========================================================
   * РЕЖИМ 7: ПАРИ
   * ========================================================= */
  function runPairsMode(container) {
    const selectedPool = pickStudyWords(10);
    const rounds = [selectedPool.slice(0, 5)];
    if (selectedPool.length >= 10) {
      rounds.push(selectedPool.slice(5, 10));
    } else {
      rounds.push(shuffle(getActiveWordsPool()).slice(0, 5));
    }

    let roundIdx = 0;
    let startTime = Date.now();
    let elapsedSec = 0;
    const mistakeIds = new Set();
    const allResults = [];

    let leftCol = [];
    let rightCol = [];
    let matchedIds = new Set();
    let selLeft = null;
    let selRight = null;

    const timerInterval = setInterval(() => {
      elapsedSec = Math.floor((Date.now() - startTime) / 1000);
      const tEl = container.querySelector('#pairsTimer');
      if (tEl) tEl.textContent = `${elapsedSec} с`;
    }, 500);

    activeSessionCleanup = () => clearInterval(timerInterval);

    function startRound() {
      const batch = rounds[roundIdx];
      leftCol = shuffle(batch.slice());
      rightCol = shuffle(batch.slice());
      matchedIds = new Set();
      selLeft = null;
      selRight = null;
      renderPairs();
    }

    function renderPairs() {
      container.innerHTML = `
        <div class="session-header">
          <button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button>
          <span class="session-progress">Пари · Раунд ${roundIdx + 1} / ${rounds.length} · <span id="pairsTimer">${elapsedSec} с</span></span>
        </div>
        <section class="index-card">
          <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:6px;">З'єднайте французький вираз та його значення:</div>
          <div class="pairs-columns">
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${leftCol.map(w => `
                <button type="button" class="pair-card ${matchedIds.has(w.id) ? 'matched' : ''} ${selLeft === w.id ? 'selected' : ''}" data-left="${w.id}">
                  <span style="font-family:var(--font-fr); font-weight:600;">${escapeHtml(w.fr)}</span>
                </button>
              `).join('')}
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${rightCol.map(w => `
                <button type="button" class="pair-card ${matchedIds.has(w.id) ? 'matched' : ''} ${selRight === w.id ? 'selected' : ''}" data-right="${w.id}">
                  <span>${escapeHtml(getPromptText(w))}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </section>
      `;

      container.querySelector('#btnExitMode').addEventListener('click', () => renderCurrentTab());
      container.querySelectorAll('[data-left]').forEach(btn => {
        btn.addEventListener('click', () => {
          selLeft = btn.dataset.left;
          checkPairMatch();
        });
      });
      container.querySelectorAll('[data-right]').forEach(btn => {
        btn.addEventListener('click', () => {
          selRight = btn.dataset.right;
          checkPairMatch();
        });
      });
    }

    function checkPairMatch() {
      if (!selLeft || !selRight) {
        renderPairs();
        return;
      }
      if (selLeft === selRight) {
        matchedIds.add(selLeft);
        const w = rounds[roundIdx].find(item => item.id === selLeft);
        if (w && speechSupported) speakFrench(w.fr, 1.0);
        selLeft = null;
        selRight = null;

        if (matchedIds.size === rounds[roundIdx].length) {
          rounds[roundIdx].forEach(word => {
            const ok = !mistakeIds.has(word.id);
            handleMiniGameResult(word, ok);
            allResults.push({ word, ok });
          });
          roundIdx++;
          if (roundIdx >= rounds.length) {
            clearInterval(timerInterval);
            renderRoundSummary(container, 'pairs', allResults,
              `<div style="margin-bottom:10px; font-family:var(--font-mono); font-size:0.9rem;">Час проходження: <strong>${elapsedSec} с</strong></div>`);
            return;
          } else {
            startRound();
            return;
          }
        }
        renderPairs();
      } else {
        mistakeIds.add(selLeft);
        mistakeIds.add(selRight);
        selLeft = null;
        selRight = null;
        renderPairs();
        showToast('Не збігається, спробуйте ще раз', 1200);
      }
    }

    startRound();
  }

  /* =========================================================
   * РЕЖИМ 8: БЛІЦ (60 секунд)
   * ========================================================= */
  function runBlitzMode(container) {
    const pool = getActiveWordsPool();
    let timeLeft = 60;
    let score = 0;
    const results = [];
    let currentPair = null;

    function nextChallenge() {
      const word = pool[Math.floor(Math.random() * pool.length)];
      const isTrue = Math.random() < 0.5;
      let shownWord = word;
      if (!isTrue) {
        const others = pool.filter(w => w.id !== word.id);
        shownWord = others[Math.floor(Math.random() * others.length)] || word;
      }
      currentPair = {
        word,
        shownMeaning: getPromptText(shownWord),
        isMatch: shownWord.id === word.id
      };
      renderBlitz();
    }

    function renderBlitz() {
      container.innerHTML = `
        <div class="session-header">
          <button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button>
          <span class="session-progress">Бліц · <span id="blitzTimer">${timeLeft} с</span> · Рахунок: ${score}</span>
        </div>
        <section class="index-card" style="text-align:center;">
          <div class="study-word-title">${escapeHtml(currentPair.word.fr)}</div>
          <hr class="study-divider">
          <div class="study-meaning" style="margin-bottom:20px;">${escapeHtml(currentPair.shownMeaning)}</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <button type="button" class="btn btn-danger" id="btnBlitzNo">← Ні (Неправильно)</button>
            <button type="button" class="btn btn-primary" id="btnBlitzYes">Так (Правильно) →</button>
          </div>
        </section>
      `;

      container.querySelector('#btnExitMode').addEventListener('click', () => renderCurrentTab());
      container.querySelector('#btnBlitzNo').addEventListener('click', () => answerBlitz(false));
      container.querySelector('#btnBlitzYes').addEventListener('click', () => answerBlitz(true));
    }

    function answerBlitz(userSaysMatch) {
      const ok = (userSaysMatch === currentPair.isMatch);
      if (ok) {
        score++;
        if (score > (state.stats.blitzBest || 0)) {
          state.stats.blitzBest = score;
        }
      }
      handleMiniGameResult(currentPair.word, ok);
      results.push({ word: currentPair.word, ok });
      nextChallenge();
    }

    const interval = setInterval(() => {
      timeLeft--;
      const tEl = container.querySelector('#blitzTimer');
      if (tEl) tEl.textContent = `${timeLeft} с`;
      if (timeLeft <= 0) {
        clearInterval(interval);
        renderRoundSummary(container, 'blitz', results,
          `<div style="margin-bottom:10px; font-family:var(--font-mono);">Рахунок: <strong>${score}</strong> · Рекорд: <strong>${state.stats.blitzBest || 0}</strong></div>`);
      }
    }, 1000);

    function onKey(e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); answerBlitz(false); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); answerBlitz(true); }
    }

    window.addEventListener('keydown', onKey);
    activeSessionCleanup = () => {
      clearInterval(interval);
      window.removeEventListener('keydown', onKey);
    };

    nextChallenge();
  }

  /* =========================================================
   * РЕЖИМ 9: КРОСВОРД (Адаптований до виразів)
   * ========================================================= */
  const FR_STOPWORDS = new Set([
    'un', 'une', 'le', 'la', 'les', 'de', 'des', 'du', 'dans', 'en', 'et', 'ou',
    'pour', 'par', 'sur', 'avec', 'sans', 'sous', 'vers', 'chez', 'aux', 'au',
    'se', 'sa', 'son', 'ses', 'leur', 'leurs', 'ce', 'cet', 'cette', 'ces',
    'mon', 'ton', 'ma', 'ta', 'mes', 'tes', 'nos', 'vos', 'qui', 'que', 'quoi',
    'plus', 'moins', 'tres', 'pas', 'ne', 'ni', 'y', 'a'
  ]);

  function extractCrosswordEntry(w) {
    const rawFr = String(w.fr || '').trim();
    const fullClean = stripFrenchArticles(rawFr)
      .replace(/-/g, '')
      .replace(/[^a-zàâäéèêëîïôöùûüÿçœæ]/gi, '')
      .toLowerCase();

    if (fullClean.length >= 3 && fullClean.length <= 12) {
      return { word: w, clean: fullClean, clueExtra: '' };
    }

    // Якщо це довгий вираз — беремо найдовше змістове слово
    const tokens = rawFr
      .replace(/[’‘]/g, "'")
      .split(/[\s\-']+/)
      .map(t => ({
        orig: t,
        clean: t.toLowerCase().replace(/[^a-zàâäéèêëîïôöùûüÿçœæ]/gi, '')
      }))
      .filter(t => t.clean.length >= 3 && t.clean.length <= 12 && !FR_STOPWORDS.has(stripDiacritics(t.clean)));

    if (tokens.length > 0) {
      tokens.sort((a, b) => b.clean.length - a.clean.length);
      const chosen = tokens[0];
      const maskedPhrase = rawFr.replace(new RegExp(chosen.orig.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '[…]');
      return { word: w, clean: chosen.clean, clueExtra: maskedPhrase };
    }

    if (fullClean.length > 12) {
      return { word: w, clean: fullClean.slice(0, 12), clueExtra: rawFr };
    }
    return null;
  }

  function generateCrosswordPuzzle() {
    const GRID_SIZE = 12;
    const candidates = shuffle(getActiveWordsPool())
      .map(w => extractCrosswordEntry(w))
      .filter(Boolean);

    const grid = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(null));
    const placed = [];

    function canPlace(str, r, c, dir) {
      const len = str.length;
      if (dir === 'H') {
        if (c < 0 || c + len > GRID_SIZE || r < 0 || r >= GRID_SIZE) return false;
        if (c > 0 && grid[r][c - 1] !== null) return false;
        if (c + len < GRID_SIZE && grid[r][c + len] !== null) return false;
        let intersections = 0;
        for (let i = 0; i < len; i++) {
          const cur = grid[r][c + i];
          if (cur !== null) {
            if (cur !== str[i]) return false;
            intersections++;
          } else {
            if (r > 0 && grid[r - 1][c + i] !== null) return false;
            if (r + 1 < GRID_SIZE && grid[r + 1][c + i] !== null) return false;
          }
        }
        return intersections;
      } else {
        if (r < 0 || r + len > GRID_SIZE || c < 0 || c >= GRID_SIZE) return false;
        if (r > 0 && grid[r - 1][c] !== null) return false;
        if (r + len < GRID_SIZE && grid[r + len][c] !== null) return false;
        let intersections = 0;
        for (let i = 0; i < len; i++) {
          const cur = grid[r + i][c];
          if (cur !== null) {
            if (cur !== str[i]) return false;
            intersections++;
          } else {
            if (c > 0 && grid[r + i][c - 1] !== null) return false;
            if (c + 1 < GRID_SIZE && grid[r + i][c + 1] !== null) return false;
          }
        }
        return intersections;
      }
    }

    function putWord(item, r, c, dir) {
      const str = item.clean;
      for (let i = 0; i < str.length; i++) {
        if (dir === 'H') grid[r][c + i] = str[i];
        else grid[r + i][c] = str[i];
      }
      placed.push({ ...item, r, c, dir });
    }

    if (candidates.length > 0) {
      const first = candidates.shift();
      const startRow = Math.floor(GRID_SIZE / 2);
      const startCol = Math.max(0, Math.floor((GRID_SIZE - first.clean.length) / 2));
      putWord(first, startRow, startCol, 'H');
    }

    for (const cand of candidates) {
      if (placed.length >= 9) break;
      let isPlaced = false;
      for (let i = 0; i < cand.clean.length && !isPlaced; i++) {
        const ch = cand.clean[i];
        for (const p of placed) {
          const nextDir = p.dir === 'H' ? 'V' : 'H';
          for (let j = 0; j < p.clean.length; j++) {
            if (p.clean[j] === ch) {
              const r = p.dir === 'H' ? p.r - i : p.r + j;
              const c = p.dir === 'H' ? p.c + j : p.c - i;
              const res = canPlace(cand.clean, r, c, nextDir);
              if (res !== false && res >= 1) {
                putWord(cand, r, c, nextDir);
                isPlaced = true;
                break;
              }
            }
          }
          if (isPlaced) break;
        }
      }
    }

    // Якщо мало перетинів — заповнюємо вільні рядки
    for (const cand of candidates) {
      if (placed.length >= 6) break;
      if (placed.some(p => p.word.id === cand.word.id)) continue;
      let done = false;
      for (let r = 0; r < GRID_SIZE && !done; r++) {
        for (let c = 0; c <= GRID_SIZE - cand.clean.length && !done; c++) {
          if (canPlace(cand.clean, r, c, 'H') !== false) {
            putWord(cand, r, c, 'H');
            done = true;
          }
        }
      }
    }

    placed.forEach((p, idx) => { p.num = idx + 1; });
    return { grid, placed, size: GRID_SIZE };
  }

  function runCrosswordMode(container) {
    const puzzle = generateCrosswordPuzzle();
    const { grid, placed, size } = puzzle;
    let activeDir = 'H';
    let lastFocused = null;

    const numMap = {};
    placed.forEach(p => {
      const key = `${p.r},${p.c}`;
      numMap[key] = numMap[key] ? `${numMap[key]}/${p.num}` : String(p.num);
    });

    const across = placed.filter(p => p.dir === 'H');
    const down = placed.filter(p => p.dir === 'V');

    container.innerHTML = `
      <div class="session-header">
        <button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button>
        <span class="session-progress">Кросворд · Слів: ${placed.length}</span>
      </div>
      <section class="index-card cw-wrapper">
        <div class="cw-grid" style="grid-template-columns: repeat(${size}, 1fr);">
          ${grid.map((row, r) => row.map((cell, c) => {
            if (cell === null) return `<div class="cw-cell empty"></div>`;
            const n = numMap[`${r},${c}`] || '';
            return `
              <div class="cw-cell">
                ${n ? `<span class="cw-num">${n}</span>` : ''}
                <input type="text" maxlength="1" data-r="${r}" data-c="${c}" data-ans="${cell}" aria-label="Клітинка ${r + 1},${c + 1}">
              </div>
            `;
          }).join('')).join('')}
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
          <button type="button" class="btn btn-primary" id="btnCwCheck">Перевірити</button>
          <button type="button" class="btn" id="btnCwHint">Підказати літеру</button>
          <button type="button" class="btn" id="btnCwReveal">Відповіді</button>
          <button type="button" class="btn" id="btnCwFinish">Завершити раунд</button>
        </div>

        <div class="cw-clues">
          <div>
            <div class="section-label">По горизонталі</div>
            ${across.length ? across.map(p => `
              <div class="cw-clue-item" data-focus="${p.r},${p.c},H">
                <strong>${p.num}.</strong> ${escapeHtml(getPromptText(p.word))}
                ${p.clueExtra ? `<span style="font-family:var(--font-fr); color:var(--text-muted); font-style:italic;"> (${escapeHtml(p.clueExtra)})</span>` : ''}
                <span class="badge">${p.clean.length} літ.</span>
              </div>
            `).join('') : '<div style="color:var(--text-muted);">—</div>'}
          </div>
          <div>
            <div class="section-label">По вертикалі</div>
            ${down.length ? down.map(p => `
              <div class="cw-clue-item" data-focus="${p.r},${p.c},V">
                <strong>${p.num}.</strong> ${escapeHtml(getPromptText(p.word))}
                ${p.clueExtra ? `<span style="font-family:var(--font-fr); color:var(--text-muted); font-style:italic;"> (${escapeHtml(p.clueExtra)})</span>` : ''}
                <span class="badge">${p.clean.length} літ.</span>
              </div>
            `).join('') : '<div style="color:var(--text-muted);">—</div>'}
          </div>
        </div>
      </section>
    `;

    container.querySelector('#btnExitMode').addEventListener('click', () => renderCurrentTab());

    function getInput(r, c) {
      return container.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
    }

    container.querySelectorAll('.cw-clue-item').forEach(el => {
      el.addEventListener('click', () => {
        const [r, c, dir] = el.dataset.focus.split(',');
        activeDir = dir;
        const inp = getInput(Number(r), Number(c));
        if (inp) inp.focus();
      });
    });

    container.querySelectorAll('.cw-cell input').forEach(inp => {
      inp.addEventListener('focus', () => { lastFocused = inp; });
      inp.addEventListener('input', () => {
        inp.classList.remove('cw-ok', 'cw-err');
        if (inp.value) {
          const r = Number(inp.dataset.r);
          const c = Number(inp.dataset.c);
          const next = activeDir === 'H' ? getInput(r, c + 1) : getInput(r + 1, c);
          if (next) next.focus();
        }
      });
      inp.addEventListener('keydown', e => {
        const r = Number(inp.dataset.r);
        const c = Number(inp.dataset.c);
        if (e.key === 'Backspace' && !inp.value) {
          const prev = activeDir === 'H' ? getInput(r, c - 1) : getInput(r - 1, c);
          if (prev) prev.focus();
        } else if (e.key === 'ArrowRight') { activeDir = 'H'; const n = getInput(r, c + 1); if (n) n.focus(); }
        else if (e.key === 'ArrowLeft') { activeDir = 'H'; const n = getInput(r, c - 1); if (n) n.focus(); }
        else if (e.key === 'ArrowDown') { activeDir = 'V'; const n = getInput(r + 1, c); if (n) n.focus(); }
        else if (e.key === 'ArrowUp') { activeDir = 'V'; const n = getInput(r - 1, c); if (n) n.focus(); }
      });
    });

    container.querySelector('#btnCwCheck').addEventListener('click', () => {
      container.querySelectorAll('.cw-cell input').forEach(inp => {
        const val = stripDiacritics(inp.value.trim().toLowerCase());
        const ans = stripDiacritics(inp.dataset.ans.toLowerCase());
        if (!val) return;
        if (val === ans) {
          inp.classList.add('cw-ok');
          inp.classList.remove('cw-err');
        } else {
          inp.classList.add('cw-err');
          inp.classList.remove('cw-ok');
        }
      });
    });

    container.querySelector('#btnCwHint').addEventListener('click', () => {
      const target = (lastFocused && !lastFocused.value)
        ? lastFocused
        : Array.from(container.querySelectorAll('.cw-cell input')).find(i => i.value.toLowerCase() !== i.dataset.ans);
      if (target) {
        target.value = target.dataset.ans;
        target.classList.add('cw-ok');
        target.focus();
      }
    });

    container.querySelector('#btnCwReveal').addEventListener('click', () => {
      container.querySelectorAll('.cw-cell input').forEach(inp => {
        inp.value = inp.dataset.ans;
        inp.classList.add('cw-ok');
        inp.classList.remove('cw-err');
      });
    });

    container.querySelector('#btnCwFinish').addEventListener('click', () => {
      const summary = placed.map(p => {
        let wordOk = true;
        for (let i = 0; i < p.clean.length; i++) {
          const r = p.dir === 'H' ? p.r : p.r + i;
          const c = p.dir === 'H' ? p.c + i : p.c;
          const inp = getInput(r, c);
          const v = stripDiacritics((inp ? inp.value : '').toLowerCase());
          const a = stripDiacritics(p.clean[i].toLowerCase());
          if (v !== a) wordOk = false;
        }
        handleMiniGameResult(p.word, wordOk);
        return { word: p.word, ok: wordOk };
      });
      renderRoundSummary(container, 'crossword', summary);
    });
  }

  /* =========================================================
   * РЕЖИМ 10: АНАГРАМА
   * ========================================================= */
  function runAnagramMode(container) {
    const questions = pickStudyWords(10);
    let idx = 0;
    let pool = [];
    let pickedIndices = [];
    let usedHintError = false;
    let finishedWord = false;
    const results = [];

    function setupAnagram() {
      const word = questions[idx];
      const chars = Array.from(word.fr);
      pool = shuffle(chars.map((ch, i) => ({ ch, i })));
      pickedIndices = [];
      usedHintError = false;
      finishedWord = false;
      renderAnagram();
    }

    function renderAnagram() {
      const word = questions[idx];
      container.innerHTML = `
        <div class="session-header">
          <button type="button" class="btn btn-sm" id="btnExitMode">← До режимів</button>
          <span class="session-progress">Анаграма · ${idx + 1} / ${questions.length}</span>
        </div>
        <section class="index-card">
          <div class="study-meaning">${escapeHtml(getPromptText(word))}</div>
          <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Складіть французький вираз із літер:</div>

          <div class="anagram-slots">
            ${pickedIndices.map((pi, pos) => `
              <button type="button" class="letter-tile" data-unpick="${pos}">${escapeHtml(pool[pi].ch)}</button>
            `).join('')}
          </div>

          <div class="anagram-pool">
            ${pool.map((item, pi) => {
              const used = pickedIndices.includes(pi);
              return `<button type="button" class="letter-tile ${used ? 'used' : ''}" data-pick="${pi}">${escapeHtml(item.ch)}</button>`;
            }).join('')}
          </div>

          ${!finishedWord ? `
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button type="button" class="btn" id="btnAnaHelp">Допомога (+1 літера)</button>
              <button type="button" class="btn" id="btnAnaReset">Очистити</button>
            </div>
          ` : `
            <div class="feedback-box ok" style="display:flex; align-items:center; justify-content:space-between;">
              <div>Складено: <strong style="font-family:var(--font-fr); font-size:1.15rem;">${escapeHtml(word.fr)}</strong></div>
              ${speakerBtnHtml(word.fr, 'Озвучити слово')}
            </div>
            <div style="margin-top:12px; display:flex; justify-content:flex-end;">
              <button type="button" class="btn btn-primary" id="btnNextAna">Далі (Enter)</button>
            </div>
          `}
        </section>
      `;

      container.querySelector('#btnExitMode').addEventListener('click', () => renderCurrentTab());
      container.querySelectorAll('[data-pick]').forEach(btn => {
        btn.addEventListener('click', () => pickTile(Number(btn.dataset.pick)));
      });
      container.querySelectorAll('[data-unpick]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (finishedWord) return;
          pickedIndices.splice(Number(btn.dataset.unpick), 1);
          renderAnagram();
        });
      });

      const helpBtn = container.querySelector('#btnAnaHelp');
      if (helpBtn) {
        helpBtn.addEventListener('click', () => {
          const targetChars = Array.from(word.fr);
          while (pickedIndices.length > 0) {
            const curStr = pickedIndices.map(pi => pool[pi].ch).join('');
            if (word.fr.toLowerCase().startsWith(curStr.toLowerCase())) break;
            pickedIndices.pop();
          }
          const nextChar = targetChars[pickedIndices.length];
          if (nextChar !== undefined) {
            const foundIdx = pool.findIndex((item, pi) => !pickedIndices.includes(pi) && item.ch.toLowerCase() === nextChar.toLowerCase());
            if (foundIdx !== -1) pickTile(foundIdx);
          }
        });
      }

      const resetBtn = container.querySelector('#btnAnaReset');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          pickedIndices = [];
          renderAnagram();
        });
      }

      const nextBtn = container.querySelector('#btnNextAna');
      if (nextBtn) nextBtn.addEventListener('click', nextWord);
    }

    function pickTile(pi) {
      if (finishedWord || pickedIndices.includes(pi)) return;
      pickedIndices.push(pi);
      const word = questions[idx];
      if (pickedIndices.length === pool.length) {
        const attempt = pickedIndices.map(i => pool[i].ch).join('').toLowerCase();
        if (attempt === word.fr.toLowerCase()) {
          finishedWord = true;
          handleMiniGameResult(word, !usedHintError);
          results.push({ word, ok: !usedHintError });
          if (speechSupported) speakFrench(word.fr, 1.0);
        } else {
          usedHintError = true;
          showToast('Порядок літер неправильний. Спробуйте ще раз.');
          pickedIndices = [];
        }
      }
      renderAnagram();
    }

    function nextWord() {
      if (!finishedWord) return;
      idx++;
      if (idx >= questions.length) {
        renderRoundSummary(container, 'anagram', results);
      } else {
        setupAnagram();
      }
    }

    function onKey(e) {
      if (finishedWord && e.key === 'Enter') {
        e.preventDefault();
        nextWord();
        return;
      }
      if (!finishedWord) {
        if (e.key === 'Backspace') {
          pickedIndices.pop();
          renderAnagram();
        } else if (e.key.length === 1) {
          const ch = stripDiacritics(e.key.toLowerCase());
          const found = pool.findIndex((item, pi) =>
            !pickedIndices.includes(pi) && stripDiacritics(item.ch.toLowerCase()) === ch
          );
          if (found !== -1) pickTile(found);
        }
      }
    }

    window.addEventListener('keydown', onKey);
    activeSessionCleanup = () => window.removeEventListener('keydown', onKey);
    setupAnagram();
  }

  function parseTolerantWordsJson(rawText) {
    let text = String(rawText || '').trim();
    if (!text) throw new Error('Поле порожнє. Вставте JSON-масив слів.');

    const firstBracket = text.indexOf('[');
    const lastBracket = text.lastIndexOf(']');
    if (firstBracket !== -1 && lastBracket !== -1 && lastBracket > firstBracket) {
      text = text.slice(firstBracket, lastBracket + 1);
    } else if (text.startsWith('{') && text.endsWith('}')) {
      text = `[${text}]`;
    } else {
      throw new Error('Не знайдено JSON-масиву у квадратних дужках [ ... ]. Перевірте скопійований код.');
    }

    text = text
      .replace(/[“”«»„‟]/g, '"')
      .replace(/,\s*([\]}])/g, '$1');

    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      throw new Error('Помилка розбору JSON: перевірте цілісність лапок та дужок.');
    }

    if (!Array.isArray(parsed)) {
      throw new Error('Очікувався масив об’єктів слів.');
    }
    return parsed;
  }
